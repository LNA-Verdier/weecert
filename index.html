<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16B888">
<title>WeeCert</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@500&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout : colonne d'app mobile centrée, barre du haut collante, onglets en bas, sessions en plein écran */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F3F6F8; --line:#E2E8EC; --line-d:#CCD5DB;
  --fg:#3B4752; --muted:#7B8894; --strong:#1E2933;
  --green:#4CC417; --green-d:#3A9C0F; --green-bg:#E9F8DE; --green-fg:#2F7F0A;
  --red:#FF4D4D; --red-d:#D63A3A; --red-bg:#FFE7E7; --red-fg:#C02F2F;
  --blue:#1AA5F0; --blue-d:#1386C4; --blue-bg:#E1F3FE; --blue-fg:#0F6FA6;
  --brick:#FF6F2E; --brick-d:#DB5617; --brick-l:#FFB38A;
  --gold:#FFC414; --gold-d:#DDA300; --gold-bg:#FFF5D6;
  --violet:#9C6BFF; --violet-d:#7D4DE0;
  --on:#FFFFFF;
  --f-ui:"Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121A21; --surface:#18232C; --soft:#1F2C36; --line:#2C3B47; --line-d:#3A4B58;
  --fg:#D9E2E8; --muted:#8C9BA7; --strong:#F3F7F9;
  --green-bg:#1C3111; --green-fg:#8EE05A; --red-bg:#3A1C1C; --red-fg:#FF9A9A;
  --blue-bg:#112E44; --blue-fg:#7CCBFA; --gold-bg:#3A3010; --brick-l:#8A4A2A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121A21; --surface:#18232C; --soft:#1F2C36; --line:#2C3B47; --line-d:#3A4B58;
  --fg:#D9E2E8; --muted:#8C9BA7; --strong:#F3F7F9;
  --green-bg:#1C3111; --green-fg:#8EE05A; --red-bg:#3A1C1C; --red-fg:#FF9A9A;
  --blue-bg:#112E44; --blue-fg:#7CCBFA; --gold-bg:#3A3010; --brick-l:#8A4A2A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;font-weight:700;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;color:var(--strong);font-weight:900;text-wrap:balance;line-height:1.2}
p{margin:0}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.certpick{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:2px solid var(--line);border-radius:14px;min-width:0}
.certpick .badge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--on);font-weight:900;font-size:12px;flex:none}
.certpick span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;color:var(--strong);font-size:15px}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px;padding:6px 6px}
.stat svg{width:24px;height:24px}
.spacer{flex:1}
.banner{background:var(--gold-bg);color:var(--strong);font-size:13px;font-weight:700;border-bottom:2px solid var(--line)}
.banner .wrap{padding-block:8px}

/* Bottom tabs */
main{padding-block:18px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;border:2px solid transparent;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--blue)}
.tabs .wrap{position:relative}
.tab{position:relative;z-index:1;transition:color .2s}
.tabind{position:absolute;top:6px;bottom:6px;left:0;width:0;border:2px solid var(--blue);background:var(--blue-bg);border-radius:12px;pointer-events:none;z-index:0;opacity:0}
.tabind.ready{opacity:1;transition:transform .34s cubic-bezier(.3,1.35,.5,1),width .34s cubic-bezier(.3,1.35,.5,1)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;border-radius:16px;background:var(--green);color:var(--on);font-weight:900;text-transform:uppercase;letter-spacing:.07em;font-size:15px;box-shadow:0 4px 0 var(--green-d);transition:transform .06s, box-shadow .06s, filter .15s;width:100%}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.brick{background:var(--brick);box-shadow:0 4px 0 var(--brick-d)}
.btn.violet{background:var(--violet);box-shadow:0 4px 0 var(--violet-d)}
.btn.ghost{background:var(--surface);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-d);cursor:not-allowed;filter:none}
.btn.small{min-height:40px;padding:8px 14px;font-size:13px;width:auto}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.iconbtn svg{width:26px;height:26px}

/* Home */
.hero{display:flex;align-items:center;gap:16px;padding:16px;border:2px solid var(--line);border-radius:20px}
.hero .bubble{position:relative;background:var(--soft);border-radius:16px;padding:12px 14px;font-weight:800;color:var(--strong);flex:1;min-width:0}
.hero .bubble::before{content:"";position:absolute;left:-8px;top:24px;border:8px solid transparent;border-right-color:var(--soft);border-left:0}
.mascot{flex:none}
.goal{display:flex;align-items:center;gap:14px;margin-top:14px}
.ring{flex:none}
.goal .lbl{font-size:13px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.goal .val{font-size:18px;font-weight:900;color:var(--strong)}
.sec-title{font-size:13px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.09em;margin:26px 0 10px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);text-align:left;background:var(--surface);transition:transform .06s, box-shadow .06s;min-width:0}
.mode:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.mode:disabled{opacity:.55;cursor:not-allowed}
.mode .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--on)}
.mode .ic svg{width:26px;height:26px}
.mode h3{font-size:17px}
.mode p{font-size:13px;color:var(--muted);font-weight:700}
.mode .pill{font-size:12px;font-weight:900;padding:2px 8px;border-radius:99px;background:var(--red);color:var(--on)}
.mode.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px}
.mode.wide .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
@media (max-width:420px){.modes{grid-template-columns:1fr}}

.path{display:flex;flex-direction:column;gap:10px}
.unit{display:flex;align-items:center;gap:14px;padding:12px 14px;border:2px solid var(--line);border-radius:16px;text-align:left;background:var(--surface);width:100%}
.unit:hover{background:var(--soft)}
.unit .orb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--on);box-shadow:0 4px 0 rgba(0,0,0,.18);font-weight:900}
.unit .orb svg{width:24px;height:24px}
.unit .body{flex:1;min-width:0}
.unit .name{font-weight:900;color:var(--strong);font-size:15px}
.unit .meta{font-size:12px;color:var(--muted);font-weight:800}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--gold);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}

/* Leaderboard */
.league{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--soft)}
.league h2{font-size:20px}
.league p{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px;margin:16px 0;padding:4px;background:var(--soft);border-radius:14px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:900;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--blue);box-shadow:0 2px 0 var(--line)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px}
.row.me{background:var(--blue-bg)}
.row .rk{width:28px;text-align:center;font-weight:900;color:var(--muted)}
.row .rk.m1{color:var(--gold-d)} .row .rk.m2{color:#8E9CA8} .row .rk.m3{color:var(--brick-d)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--on);font-weight:900;flex:none}
.row .nm{flex:1;min-width:0;font-weight:800;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.row .xp{font-weight:900;color:var(--strong)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:10px}

/* Profile */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid var(--line);border-radius:16px}
.tile svg{width:28px;height:28px;flex:none}
.tile b{display:block;font-size:20px;font-weight:900;color:var(--strong)}
.tile span{font-size:12px;color:var(--muted);font-weight:800}
.ready{display:flex;flex-direction:column;gap:12px}
.ready .it{padding:14px;border:2px solid var(--line);border-radius:16px}
.ready .hd{display:flex;align-items:center;gap:10px}
.ready .hd .badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--on);font-weight:900;font-size:12px}
.ready .hd b{flex:1;color:var(--strong)}
.ready .sub{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.ready .sub strong{color:var(--strong)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:2px solid var(--line);border-radius:16px;text-align:center}
.bdg .hex{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:var(--on);transform:rotate(-6deg);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.bdg .hex svg{width:28px;height:28px;transform:rotate(6deg)}
.bdg b{font-size:12px;color:var(--strong);line-height:1.2}
.bdg small{font-size:11px;color:var(--muted);line-height:1.2}
.bdg.locked .hex{background:var(--line)!important;color:var(--muted);box-shadow:none}
.bdg.locked b{color:var(--muted)}

/* Import */
.card{padding:16px;border:2px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:12px}
.card p{font-size:14px;color:var(--fg);font-weight:700}
.fmt{overflow-x:auto;background:var(--soft);border-radius:12px;padding:12px;font-family:var(--f-code);font-size:12px;line-height:1.6;white-space:pre;color:var(--strong)}
textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:14px;padding:12px;font-family:var(--f-code);font-size:12px;background:var(--surface);color:var(--fg);resize:vertical}
.filelbl{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:2px dashed var(--line-d);border-radius:14px;color:var(--blue);font-weight:900;cursor:pointer;text-align:center}
.filelbl input{position:absolute;opacity:0;width:1px;height:1px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:140px}
.note{font-size:13px;color:var(--muted);font-weight:700}
.ok{color:var(--green-fg)} .err{color:var(--red-fg)}
.counts{display:flex;flex-direction:column;gap:8px}
.counts div{display:flex;justify-content:space-between;font-size:14px}

/* Session overlay */
.session{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.s-head .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.prog{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s cubic-bezier(.3,1.4,.6,1);position:relative}
.prog>i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.combo{display:flex;align-items:center;gap:2px;font-weight:900;color:var(--brick)}
.combo svg{width:22px;height:22px}
.timer{font-weight:900;font-size:17px;padding:4px 10px;border-radius:10px;background:var(--soft);color:var(--strong)}
.timer.warn{background:var(--red-bg);color:var(--red-fg)}
.s-body{flex:1;overflow-y:auto}
.s-body .wrap{padding-block:8px 24px;display:flex;flex-direction:column;gap:16px}
.qtag{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.chip.new{background:var(--violet);color:var(--on)} .chip.rev{background:var(--blue-bg);color:var(--blue-fg)} .chip.bad{background:var(--red-bg);color:var(--red-fg)}
.qtext{font-size:21px;font-weight:900;color:var(--strong);line-height:1.3;text-wrap:pretty}
pre.code{margin:0;overflow-x:auto;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-family:var(--f-code);font-size:13px;line-height:1.55;color:var(--strong)}
.hint{font-size:13px;color:var(--muted);font-weight:800}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line);text-align:left;background:var(--surface);font-weight:700;color:var(--strong);transition:transform .05s,box-shadow .05s,background .15s,border-color .15s;width:100%}
.opt:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.opt .k{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--muted);flex:none}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--blue);background:var(--blue-bg);box-shadow:0 3px 0 var(--blue)}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.good{border-color:var(--green);background:var(--green-bg);box-shadow:0 3px 0 var(--green)}
.opt.good .k{border-color:var(--green);color:var(--green-fg)}
.opt.bad{border-color:var(--red);background:var(--red-bg);box-shadow:0 3px 0 var(--red)}
.opt.bad .k{border-color:var(--red);color:var(--red-fg)}
.opt:disabled{cursor:default}
.s-foot{border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
.s-foot .wrap{padding-block:14px;display:flex;flex-direction:column;gap:12px}
.s-foot.good{background:var(--green-bg);border-color:transparent}
.s-foot.bad{background:var(--red-bg);border-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start;animation:rise .25s ease-out}
.fb .ico{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.fb .ico svg{width:30px;height:30px}
.fb h3{font-size:21px}
.s-foot.good h3{color:var(--green-fg)} .s-foot.bad h3{color:var(--red-fg)}
.fb .ans{font-size:14px;font-weight:800;color:var(--strong);margin-top:2px}
.fb .exp{font-size:14px;font-weight:600;color:var(--fg);margin-top:6px;max-height:30vh;overflow-y:auto}
.s-foot.good .btn{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.s-foot.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
@keyframes rise{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.flash-good .opt.sel{border-color:var(--green);background:var(--green-bg);box-shadow:0 3px 0 var(--green)}
.flash-bad .opt.sel{border-color:var(--red);background:var(--red-bg);box-shadow:0 3px 0 var(--red)}

/* Exam nav */
.grid-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.grid-nav button{height:44px;border-radius:10px;border:2px solid var(--line);font-weight:900;font-size:13px}
.grid-nav button.done{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-fg)}
.grid-nav button.flag{box-shadow:inset 0 -4px 0 var(--gold)}
.grid-nav button.cur{outline:3px solid var(--strong);outline-offset:1px}
.flagbtn[aria-pressed="true"]{color:var(--gold-d)}
.confirm{padding:16px;border-radius:16px;background:var(--gold-bg);display:flex;flex-direction:column;gap:12px}
.confirm p{color:var(--strong)}

/* Results */
.res{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:12px}
.res h2{font-size:28px;color:var(--gold-d)}
.res .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.kpi{border:2px solid currentColor;border-radius:16px;overflow:hidden;color:var(--gold)}
.kpi .h{background:currentColor;padding:4px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.kpi .h span{color:var(--on)}
.kpi .v{padding:10px 4px;font-size:20px;font-weight:900;color:var(--strong);background:var(--surface)}
.kpi.g{color:var(--green)} .kpi.b{color:var(--blue)}
.newbadges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.review{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.review details{border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.review summary{cursor:pointer;font-weight:800;color:var(--strong);font-size:14px}
.review .r-a{font-size:13px;margin-top:8px;color:var(--green-fg);font-weight:800}
.review .r-y{font-size:13px;color:var(--red-fg);font-weight:800}
.review .r-e{font-size:13px;margin-top:4px;font-weight:600}
.dombars{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.dombars .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:800}
.pass{font-weight:900;padding:6px 14px;border-radius:99px}
.pass.y{background:var(--green-bg);color:var(--green-fg)} .pass.n{background:var(--red-bg);color:var(--red-fg)}

/* Sheet */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(10,20,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;animation:rise .2s ease-out}
.sheet h2{font-size:18px;margin-bottom:4px}
.copt{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--line);border-radius:16px;text-align:left;width:100%}
.copt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-bg)}
.copt .badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--on);font-weight:900;font-size:13px;flex:none}
.copt b{display:block;color:var(--strong)}
.copt small{color:var(--muted);font-weight:700}

.trans{position:fixed;inset:0;z-index:70;display:grid;place-items:center;text-align:center;color:var(--on);padding:24px max(16px,env(safe-area-inset-left,0px));animation:tin 1.7s ease forwards;cursor:pointer}
.trans .in{display:flex;flex-direction:column;align-items:center;gap:10px;animation:tpop 1.7s ease forwards}
.trans .lbl{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;opacity:.85}
.trans .tag{font-size:15px;font-weight:900;padding:4px 14px;border-radius:99px;background:rgba(255,255,255,.22)}
.trans h2{color:var(--on);font-size:34px;line-height:1.1}
.trans p{font-size:15px;font-weight:800;opacity:.9}
@keyframes tin{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes tpop{0%{transform:translateY(24px) scale(.92)}20%{transform:none}100%{transform:translateY(-8px)}}
.srcs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-2px 0 12px}
.srcchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:2px solid var(--line);border-radius:99px;font-weight:800;font-size:13px;color:var(--muted);background:var(--surface)}
.srcchip svg{width:14px;height:14px}
.srcchip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-fg)}
.txtin{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-weight:700;background:var(--surface);color:var(--fg)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:700;color:var(--strong)}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--blue)}
.srctable{display:flex;flex-direction:column;gap:10px}
.srcrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:2px solid var(--line);border-radius:14px}
.srcrow b{color:var(--strong)} .srcrow .spacer{flex:1}
.badge{box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.badge svg{width:74%;height:74%;display:block;overflow:visible}
.trans .bigbadge{width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.2);display:grid;place-items:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.trans .bigbadge svg{width:52px;height:52px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--strong);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;max-width:calc(100% - 32px)}

.busy{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:85;width:min(420px,calc(100% - 32px));display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:2px solid var(--blue);border-radius:16px;box-shadow:0 4px 0 var(--blue-d)}
.busy .bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.busy b{color:var(--strong);font-size:14px}
.busy small{color:var(--muted);font-size:12px;font-weight:700}
.busy .bar{margin-top:4px}
.busy .bar>i{background:var(--blue);transition:width .2s}
.spin{width:26px;height:26px;border-radius:50%;border:4px solid var(--blue-bg);border-top-color:var(--blue);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* Parcours de cours */
.pathwrap{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.ubanner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;color:var(--on);box-shadow:0 4px 0 rgba(0,0,0,.18);margin-top:14px}

.nrow{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;width:150px}

.dbub{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:3px 8px;font-size:11px;font-weight:800;color:var(--fg);text-align:center;line-height:1.25;margin-bottom:2px;max-width:120px}
.dname{font-size:11px;font-weight:900;color:var(--muted);margin-top:-2px}
@keyframes sway{50%{transform:translateY(-4px) rotate(-1.5deg)}}

.chest.ready{margin-top:40px}.chest.ready svg{animation:sway 2.4s ease-in-out infinite}.chest .nbub{position:absolute;top:-30px}
.chest.locked svg{filter:saturate(.55);opacity:.85}
.chest.open svg{animation:pop .6s ease-out}

.avbtn{width:40px;height:40px;border-radius:50%;padding:0;overflow:hidden;border:2px solid var(--line);flex:none}
.avbtn svg,.av.img svg,.avprev svg,.avopt svg{display:block;width:100%;height:100%}

.swatch{width:38px;height:38px;border-radius:50%;border:3px solid var(--line)}
.avopt[aria-pressed="true"],.swatch[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}

.fc{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:12px;font-weight:800;color:var(--fg);line-height:1.3}
.nm .fc span{white-space:normal}
.fc .badge{width:18px;height:18px;border-radius:6px;display:inline-grid;place-items:center;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.srcchip.pre-ok{border-color:var(--green);background:var(--green-bg);color:var(--green-fg)}
.urow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.urow .cnt{font-weight:900;color:var(--strong);font-size:15px;white-space:nowrap}
.urow .cnt small{font-size:11px;color:var(--muted);font-weight:800;margin-left:3px}
.readycard{display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px solid var(--line);border-radius:18px;margin-top:14px}
.readycard .txt{flex:1;min-width:0}
.readycard b{display:block;color:var(--strong);font-size:16px}
.readycard span{font-size:13px;color:var(--muted);font-weight:700}
.node{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);box-shadow:0 6px 0 var(--line-d);transition:transform .06s,box-shadow .06s}
.node svg{width:32px;height:32px}
.node:active{transform:translateY(6px);box-shadow:0 0 0 var(--line-d)}
.node.done{background:var(--gold);color:var(--on);box-shadow:0 6px 0 var(--gold-d)}
.node.cur{background:var(--uc);color:var(--on);box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 0 6px var(--bg),0 0 0 10px var(--line);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 0 6px var(--bg),0 0 0 13px var(--line)}}
.nlabel{font-size:12px;font-weight:800;color:var(--fg);text-align:center;line-height:1.25}
.node.todo+.nlabel{color:var(--muted)}
.nbub{position:absolute;top:-34px;background:var(--surface);border:2px solid var(--line);color:var(--uc);font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:12px;white-space:nowrap;animation:float 1.6s ease-in-out infinite}
.nbub::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--line)}
@keyframes float{50%{transform:translateY(-4px)}}
.ltitle{font-size:26px}
.lesson{font-weight:600;font-size:16px;line-height:1.6;color:var(--fg);display:flex;flex-direction:column;gap:12px}
.lesson h3{font-size:19px;margin-top:10px}
.lesson h4{font-size:16px;color:var(--strong)}
.lesson ul,.lesson ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.lesson strong{color:var(--strong);font-weight:800}
.lesson code{font-family:var(--f-code);font-size:.86em;background:var(--soft);padding:1px 5px;border-radius:6px;color:var(--strong)}
.lesson pre.code code{background:none;padding:0;font-size:inherit}
.lesson a{color:var(--blue-fg);font-weight:800}
.tbl{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.45}
.tbl th{background:var(--soft);color:var(--strong);font-weight:900;text-align:left}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;min-width:110px}
.tbl tr:last-child td{border-bottom:0}
/* Intro de leçon et célébration de section */
.intro{position:fixed;inset:0;z-index:75;display:grid;place-items:center;background:var(--ic);color:var(--on);text-align:center;padding:24px max(16px,env(safe-area-inset-left,0px));cursor:pointer;transition:opacity .3s ease;animation:fadein .2s ease}

.intro .in{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px}
.intro .hop{animation:hop .9s ease-in-out infinite}
.intro .shadow{width:70px;height:10px;border-radius:50%;background:rgba(0,0,0,.18);margin-top:-14px;animation:shad .9s ease-in-out infinite}
.intro .lbl{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;opacity:.9;margin-top:6px}
.intro h2{color:var(--on);font-size:28px;line-height:1.15}
.intro p{font-size:15px;font-weight:800;opacity:.9}
.ldbar{width:220px;height:14px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:8px}

@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-22px) scaleY(1.04)}60%{transform:translateY(-22px)}}
@keyframes shad{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}

@keyframes fadein{from{opacity:0}}
.celeb{position:fixed;inset:0;z-index:76;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#33449C 0%,#1A2152 55%,#10142F 100%);color:#fff;text-align:center;padding:24px max(16px,env(safe-area-inset-left,0px));transition:opacity .3s ease;animation:fadein .25s ease;overflow:hidden}

.celeb .chestbig{position:relative;animation:chestin .55s cubic-bezier(.3,1.5,.5,1) both}

.celeb .frog{position:absolute;right:-18px;bottom:-6px;animation:chestin .5s .9s cubic-bezier(.3,1.5,.5,1) both}
.celeb .kick{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;color:#FFD65A}
.celeb h2{color:#fff;font-size:32px;line-height:1.1}
.celeb p{font-size:16px;font-weight:800;color:rgba(255,255,255,.85)}
.celeb .xpbig{font-size:30px;font-weight:900;color:#FFD65A;padding:6px 18px;border-radius:99px;background:rgba(255,196,20,.14);border:2px solid rgba(255,196,20,.45)}
.celeb .btn{max-width:320px;margin-top:10px}
@keyframes spinr{to{transform:rotate(360deg)}}
@keyframes glow{50%{transform:scale(1.15);opacity:.8}}
@keyframes chestin{from{transform:scale(.3) translateY(40px);opacity:0}}
@keyframes lidopen{from{transform:rotate(0)}to{transform:rotate(-38deg) translate(-2px,-6px)}}

.mascot .eye{transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

@keyframes bounce{0%{transform:scale(.6)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

<script type="text/weecert">
// Banque de questions originales, rédigées à partir des exam guides publics et de la documentation Databricks.
const BANK = [
// ===== DATA ENGINEER ASSOCIATE =====
["dea","plat","Où Delta Lake enregistre-t-il l'historique des transactions d'une table ?",["Dans le répertoire _delta_log, sous forme de fichiers JSON et de checkpoints Parquet","Dans le metastore Hive uniquement","Dans un fichier _SUCCESS à la racine de la table","Dans les logs du driver Spark"],0,"Chaque commit écrit un fichier JSON numéroté dans _delta_log. Des checkpoints Parquet sont générés régulièrement pour reconstruire plus vite l'état de la table."],
["dea","plat","Un job de transformation tourne chaque nuit. Quel compute minimise le coût tout en restant adapté ?",["Un cluster all-purpose partagé laissé allumé","Du job compute (ou du serverless pour les jobs) créé pour l'exécution puis arrêté","Un SQL warehouse Pro","Un cluster single node permanent"],1,"Le job compute est créé au lancement et détruit à la fin, avec un tarif DBU inférieur à l'all-purpose. Le serverless jobs supprime en plus la gestion de l'infrastructure."],
["dea","plat","Quelle requête lit la table orders telle qu'elle était à la version 12 ?",["SELECT * FROM orders@12","SELECT * FROM orders VERSION AS OF 12","SELECT * FROM orders HISTORY 12","RESTORE orders TO 12"],1,"Le time travel s'utilise avec VERSION AS OF ou TIMESTAMP AS OF. RESTORE modifie la table au lieu de simplement la lire."],
["dea","plat","Après un VACUUM avec la rétention par défaut, que devient le time travel ?",["Il reste possible sur toutes les versions","Il échoue pour les versions dont les fichiers, plus vieux que 7 jours, ont été supprimés","Il est désactivé définitivement sur la table","Il ne fonctionne plus que sur la dernière version"],1,"VACUUM supprime les fichiers non référencés plus vieux que la rétention (7 jours par défaut). Les versions qui en dépendent ne sont plus lisibles."],
["dea","ops","Pour une nouvelle table Delta souvent filtrée sur plusieurs colonnes, quelle optimisation de layout est recommandée ?",["Partitionner sur chaque colonne filtrée","Le liquid clustering avec CLUSTER BY","Un ZORDER sur toutes les colonnes","Désactiver les statistiques de fichiers"],1,"Le liquid clustering remplace partitionnement et ZORDER pour les nouvelles tables. Les clés peuvent évoluer sans réécrire toute la table."],
["dea","plat","Que fait la commande OPTIMIZE sur une table Delta ?",["Elle supprime les anciennes versions","Elle compacte les petits fichiers en fichiers plus gros","Elle recalcule le schéma","Elle convertit la table en Parquet"],1,"OPTIMIZE réécrit les petits fichiers en fichiers plus gros pour accélérer les lectures. Supprimer les anciens fichiers est le rôle de VACUUM."],
["dea","gov","Lors d'un DROP TABLE dans Unity Catalog, quelle est la différence entre table managée et table externe ?",["Aucune","Table managée : les données sont supprimées avec la table. Table externe : seules les métadonnées sont supprimées","Une table externe ne peut pas être supprimée","Une table managée garde ses fichiers dans le stockage"],1,"Unity Catalog gère le cycle de vie des fichiers d'une table managée. Pour une table externe, les fichiers restent à leur emplacement."],
["dea","plat","Quel est l'avantage principal du serverless compute pour un notebook ?",["Il permet d'installer n'importe quel driver système","Le démarrage est quasi immédiat et Databricks gère la capacité","Il est gratuit","Il ne consomme pas de DBU"],1,"Le serverless tourne dans le plan de calcul géré par Databricks : pas de cluster à configurer et un démarrage en quelques secondes."],
["dea","plat","Quelle commande liste les opérations passées (écritures, MERGE, OPTIMIZE...) sur une table Delta ?",["SHOW TABLES","DESCRIBE HISTORY ma_table","DESCRIBE EXTENDED ma_table","SHOW PARTITIONS ma_table"],1,"DESCRIBE HISTORY renvoie une ligne par version : opération, utilisateur, horodatage et métriques."],
["dea","ing","Quel format de source utilise Auto Loader dans spark.readStream ?",["delta","cloudFiles","autoloader","files"],1,"Auto Loader s'utilise avec .format(\"cloudFiles\"), et l'option cloudFiles.format indique le format des fichiers (json, csv, parquet...)."],
["dea","ing","Pourquoi l'option cloudFiles.schemaLocation est-elle nécessaire avec l'inférence de schéma d'Auto Loader ?",["Elle définit où écrire les données","Elle stocke le schéma inféré et son évolution entre les exécutions","Elle remplace le checkpoint","Elle chiffre les fichiers sources"],1,"Auto Loader persiste le schéma inféré à cet emplacement, ce qui permet de suivre son évolution d'un run à l'autre."],
["dea","ing","Avec le mode d'évolution de schéma par défaut d'Auto Loader (addNewColumns), que se passe-t-il quand une nouvelle colonne apparaît ?",["La colonne est ignorée silencieusement","Le stream s'arrête en erreur, le schéma est mis à jour, et un redémarrage prend la colonne en compte","Le stream continue en mettant la colonne dans _rescued_data","Toute la table est réécrite"],1,"L'échec est volontaire. En production, on configure des retries sur le job pour redémarrer automatiquement."],
["dea","ing","À quoi sert la colonne _rescued_data ?",["À stocker les lignes supprimées","À capturer les données qui ne correspondent pas au schéma (type, colonne inconnue, casse)","À dater l'ingestion","À tracer l'utilisateur qui a écrit"],1,"Plutôt que de perdre des valeurs mal typées ou inattendues, elles sont conservées dans _rescued_data pour analyse."],
["dea","ing","On relance la même commande COPY INTO sur un dossier dont les fichiers ont déjà été chargés. Que se passe-t-il ?",["Les fichiers sont chargés une seconde fois","Les fichiers déjà chargés sont ignorés : la commande est idempotente","La commande échoue","La table est vidée puis rechargée"],1,"COPY INTO garde la trace des fichiers chargés. Seuls les nouveaux sont ingérés, sauf avec l'option force."],
["dea","ing","Quelle fonction SQL lit directement des fichiers CSV ou JSON avec inférence de schéma ?",["read_files()","load_csv()","from_files()","spark_read()"],0,"read_files() est la fonction table SQL pour lire des fichiers depuis un volume ou un stockage cloud, par exemple dans un CREATE TABLE AS SELECT."],
["dea","ing","Vous devez ingérer des données Salesforce sans écrire de code de connexion. Quelle fonctionnalité utiliser ?",["Auto Loader","Lakeflow Connect (connecteurs managés)","COPY INTO","Delta Sharing"],1,"Lakeflow Connect fournit des connecteurs managés vers des applications SaaS et des bases de données, avec ingestion incrémentale."],
["dea","ing","Où stocker des fichiers bruts (CSV, images) gouvernés par Unity Catalog ?",["Dans le DBFS root","Dans un volume Unity Catalog","Dans le répertoire /tmp du driver","Dans une table temporaire"],1,"Les volumes stockent des fichiers non tabulaires avec les mêmes droits et la même lignée que les tables. Chemin : /Volumes/catalog/schema/volume."],
["dea","trans","Que fait cette instruction ?",["Elle remplace toute la table customers","Elle met à jour les clients existants et insère les nouveaux (upsert)","Elle supprime les clients absents de updates","Elle échoue car UPDATE SET * n'existe pas"],1,"MERGE combine mise à jour et insertion selon la condition ON. Pour supprimer les lignes absentes de la source, on ajouterait WHEN NOT MATCHED BY SOURCE THEN DELETE.","MERGE INTO customers t\nUSING updates s\nON t.id = s.id\nWHEN MATCHED THEN UPDATE SET *\nWHEN NOT MATCHED THEN INSERT *"],
["dea","trans","Quelle est la différence entre INSERT OVERWRITE et INSERT INTO ?",["Aucune","INSERT OVERWRITE remplace les données existantes, INSERT INTO ajoute","INSERT INTO remplace, INSERT OVERWRITE ajoute","INSERT OVERWRITE crée une nouvelle table"],1,"INSERT OVERWRITE remplace atomiquement le contenu. Une nouvelle version Delta est créée, l'ancienne reste accessible en time travel."],
["dea","trans","Quelle fonction compléter pour appliquer une hausse de 20 % à chaque élément du tableau prices ?",["explode","transform","map_values","aggregate"],1,"transform est une fonction d'ordre supérieur qui applique une lambda à chaque élément. explode, lui, transforme un tableau en plusieurs lignes.","SELECT ____(prices, p -> p * 1.2) FROM catalog"],
["dea","trans","Que renvoie COUNT(col) par rapport à COUNT(*) ?",["La même chose","COUNT(col) ignore les valeurs NULL de col","COUNT(*) ignore les NULL","COUNT(col) compte les valeurs distinctes"],1,"COUNT(*) compte toutes les lignes, COUNT(col) seulement celles où col n'est pas NULL."],
["dea","trans","Parmi ces opérations PySpark, laquelle déclenche réellement l'exécution ?",["df.filter(...)","df.select(...)","df.count()","df.withColumn(...)"],2,"Spark est paresseux : les transformations construisent un plan, les actions (count, collect, write, show) l'exécutent."],
["dea","ing","Que fait un stream configuré avec .trigger(availableNow=True) ?",["Il tourne en continu toutes les secondes","Il traite toutes les données disponibles en plusieurs micro-batchs, puis s'arrête","Il ne traite qu'un seul fichier","Il attend un déclenchement manuel"],1,"availableNow convient au traitement incrémental planifié : tout le backlog est traité, puis le stream s'arrête proprement."],
["dea","ing","Quel est le rôle de checkpointLocation dans Structured Streaming ?",["Stocker les données de sortie","Enregistrer la progression et l'état pour reprendre après une panne sans doublon","Définir le format d'entrée","Configurer le nombre de partitions"],1,"Le checkpoint conserve les offsets traités et l'état, ce qui garantit la tolérance aux pannes et l'exactly-once vers un sink Delta."],
["dea","trans","Dans l'architecture médaillon, que contient typiquement la couche silver ?",["Les données brutes telles qu'ingérées","Des données nettoyées, dédupliquées et conformées","Des agrégats métier prêts pour les dashboards","Les logs du cluster"],1,"Bronze = brut, silver = nettoyé et conformé, gold = agrégé et orienté métier."],
["dea","trans","Comment obtenir une ligne par élément d'une colonne de type tableau ?",["flatten(col)","explode(col)","split(col)","collect_list(col)"],1,"explode génère une ligne par élément. collect_list fait l'inverse en regroupant des valeurs dans un tableau."],
["dea","trans","Quelle est la particularité d'une vue temporaire (CREATE TEMP VIEW) ?",["Elle est visible par tous les utilisateurs","Elle n'existe que pendant la session courante","Elle stocke physiquement les données","Elle est versionnée en Delta"],1,"Une vue temporaire est liée à la session. Elle disparaît à la fin et n'est pas enregistrée dans le catalogue."],
["dea","trans","Dans Lakeflow Declarative Pipelines (ex-DLT), quel objet choisir pour une ingestion incrémentale en append ?",["Une vue matérialisée","Une streaming table","Une vue temporaire","Une table externe"],1,"La streaming table traite chaque donnée source une seule fois, ce qui est idéal pour l'ingestion. La vue matérialisée convient aux agrégats recalculés."],
["dea","trans","Avec cette expectation, que se passe-t-il pour une ligne où amount = -5 ?",["Le pipeline s'arrête","La ligne est écartée et la violation est comptée dans les métriques","La ligne est écrite avec un flag","La ligne part automatiquement dans une table de quarantaine"],1,"DROP ROW écarte la ligne. Sans clause ON VIOLATION, elle est gardée mais comptée. Avec FAIL UPDATE, la mise à jour échoue.","CONSTRAINT valid_amount\nEXPECT (amount > 0) ON VIOLATION DROP ROW"],
["dea","trans","Quelle clause d'expectation fait échouer la mise à jour du pipeline dès qu'une ligne viole la règle ?",["ON VIOLATION DROP ROW","ON VIOLATION FAIL UPDATE","ON VIOLATION WARN","Aucune clause"],1,"FAIL UPDATE stoppe la mise à jour. Sans clause, le comportement est « warn » : la ligne est conservée et la violation enregistrée."],
["dea","jobs","Un job de 5 tâches échoue à la tâche 4. Comment relancer sans réexécuter les tâches réussies ?",["Relancer le job complet","Utiliser Repair run","Cloner le job","Supprimer les tâches 1 à 3"],1,"Repair run relance uniquement les tâches en échec et celles qui en dépendent."],
["dea","cicd","Quel fichier décrit un projet Databricks Asset Bundles ?",["bundle.json","databricks.yml","pipeline.conf","requirements.txt"],1,"databricks.yml décrit les ressources (jobs, pipelines) et les targets. Le déploiement se fait avec databricks bundle deploy -t <target>."],
["dea","trans","Quelle syntaxe déclarative gère un flux CDC avec historisation SCD de type 2 ?",["MERGE INTO ... SCD 2","AUTO CDC (ex-APPLY CHANGES INTO) ... STORED AS SCD TYPE 2","COPY INTO ... HISTORY","CREATE SNAPSHOT TABLE"],1,"AUTO CDC gère l'ordre des événements, les suppressions et l'historique SCD 1 ou 2 automatiquement."],
["dea","jobs","Quelle est la différence entre un pipeline en mode triggered et en mode continuous ?",["Triggered traite les données disponibles puis s'arrête, continuous tourne en permanence","Triggered est réservé au SQL","Continuous est moins cher","Aucune"],0,"Triggered convient aux traitements planifiés, continuous à la faible latence avec un compute toujours allumé."],
["dea","jobs","Comment exécuter une tâche uniquement si une condition est remplie dans Lakeflow Jobs ?",["Avec une tâche If/else condition","Avec un trigger d'arrivée de fichier","Ce n'est pas possible","Avec une cluster policy"],0,"La tâche If/else évalue une condition (souvent sur des task values ou des paramètres) et oriente le flux du job."],
["dea","plat","Quel est l'espace de noms à trois niveaux de Unity Catalog ?",["workspace.database.table","catalog.schema.table","metastore.catalog.table","schema.table.column"],1,"Unity Catalog organise les objets en catalog.schema.objet (table, vue, volume, fonction, modèle)."],
["dea","gov","Quels privilèges faut-il pour lire une table ?",["SELECT seulement","USE CATALOG, USE SCHEMA et SELECT","MODIFY et SELECT","ALL PRIVILEGES"],1,"Il faut pouvoir traverser le catalogue et le schéma (USE CATALOG, USE SCHEMA) en plus du SELECT sur la table."],
["dea","gov","Quelle commande donne le droit de lecture sur une table au groupe analysts ?",["GRANT READ ON analysts TO sales.orders","GRANT SELECT ON TABLE sales.orders TO `analysts`","ALLOW SELECT sales.orders analysts","SET PERMISSION SELECT FOR analysts"],1,"Syntaxe : GRANT privilège ON type objet TO principal. Les noms de groupe se mettent entre backticks."],
["dea","plat","Quel outil permet de partager une table avec un partenaire externe, même hors Databricks ?",["Lakehouse Federation","Delta Sharing","Auto Loader","Un export CSV planifié"],1,"Delta Sharing est un protocole ouvert de partage en lecture, sans copie. Le destinataire peut utiliser Databricks, Spark, pandas, Power BI..."],
["dea","plat","Quelle lignée Unity Catalog capture-t-il automatiquement ?",["Uniquement entre notebooks","La lignée des tables et des colonnes pour les requêtes exécutées","Aucune, elle doit être déclarée","Uniquement celle des modèles ML"],1,"UC capture la lignée au niveau table et colonne, consultable dans Catalog Explorer."],
["dea","plat","Combien de metastores Unity Catalog recommande-t-on par région cloud ?",["Un par workspace","Un par région, partagé par les workspaces de cette région","Un par utilisateur","Autant que de catalogues"],1,"On crée un metastore par région et on l'attache aux workspaces de la région. L'isolation se fait par catalogues."],
