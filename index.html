st(countries), \"country_code\")\n```\n\nLa **broadcast join** envoie une copie complète de la petite table à chaque exécuteur. La grosse table n'a plus besoin d'être redistribuée par clé, ce qui supprime le shuffle le plus coûteux. Spark la choisit seul quand une table est sous le seuil `spark.sql.autoBroadcastJoinThreshold` (10 Mo par défaut). Le hint `F.broadcast()`, ou `/*+ BROADCAST(c) */` en SQL, la force.\n\n### Les unions\n\n| Méthode | Doublons | Correspondance des colonnes |\n| --- | --- | --- |\n| `df1.union(df2)` (PySpark) | Gardés | **Par position** : les colonnes doivent être dans le même ordre |\n| `df1.unionByName(df2, allowMissingColumns=True)` | Gardés | **Par nom**. Les colonnes absentes d'un côté sont remplies de NULL |\n| `UNION ALL` (SQL) | Gardés | Par position |\n| `UNION` (SQL) | **Supprimés** | Par position |\n\nAttention au piège de vocabulaire : en PySpark, `union` garde les doublons, comme `UNION ALL` en SQL. Pour les supprimer, on ajoute `.distinct()`. `unionAll` est un ancien alias de `union`.\n\n### Pièges d'examen\n\n- « Toutes les lignes de A, même sans correspondance dans B » : `left` join. « Les lignes de A absentes de B » : `left_anti`.\n- Deux DataFrames aux colonnes dans un ordre différent : `unionByName`. Avec `union`, les valeurs se mélangent sans erreur si les types sont compatibles.\n- Petite table de référence jointe à une très grosse table : broadcast join.\n- Une jointure sur une liste de clés (`on=[...]`) ne garde qu'une colonne par clé. Une condition `a.id == b.id` garde les deux colonnes, d'où des erreurs d'ambiguïté ensuite.", "kw": ["join", "union", "broadcast", "anti"]}, {"id": "dea-trans-3", "t": "Restructurer les données", "md": "### Les opérations de base\n\n| Besoin | PySpark | SQL |\n| --- | --- | --- |\n| Ajouter ou remplacer une colonne | `withColumn(\"total\", F.col(\"qty\") * F.col(\"price\"))` | `SELECT *, qty * price AS total` |\n| Plusieurs colonnes d'un coup | `withColumns({\"a\": ..., \"b\": ...})` | |\n| Renommer | `withColumnRenamed(\"cust\", \"customer_id\")` | `cust AS customer_id` |\n| Supprimer | `drop(\"tmp\", \"debug\")` | `SELECT * EXCEPT (tmp, debug)` |\n| Filtrer | `filter(F.col(\"amount\") > 0)` ou `where(...)` | `WHERE amount > 0` |\n| Découper un texte | `F.split(\"full_name\", \" \")` donne un ARRAY | `split(full_name, ' ')` |\n| Lire un élément | `F.split(\"full_name\", \" \")[0]` ou `getItem(0)` | `split(full_name, ' ')[0]` ou `element_at(..., 1)` |\n| Une ligne par élément d'un tableau | `F.explode(\"items\")` | `explode(items)` |\n| Champ d'une structure | `F.col(\"address.city\")` | `address.city` |\n\n`filter` et `where` sont deux noms pour la même opération. `element_at` commence à 1, alors que l'index `[0]` commence à 0.\n\n### Exploser un tableau\n\n```python\n# une commande avec 3 articles devient 3 lignes\norders.select(\"order_id\", F.explode(\"items\").alias(\"item\")) \\\n      .select(\"order_id\", \"item.sku\", \"item.qty\")\n```\n\n| Fonction | Tableau vide ou NULL |\n| --- | --- |\n| `explode` | La ligne disparaît |\n| `explode_outer` | La ligne est gardée avec un NULL |\n| `posexplode` | Ajoute la position de l'élément |\n\nL'opération inverse regroupe les lignes en tableau : `collect_list` garde les doublons, `collect_set` les supprime.\n\n### Fonctions d'ordre supérieur\n\nPour travailler dans un tableau sans l'exploser :\n\n```sql\nSELECT\n  transform(items, x -> x.qty * x.price)  AS line_totals,   -- appliquer à chaque élément\n  filter(items, x -> x.qty > 0)           AS valid_items,   -- garder certains éléments\n  exists(items, x -> x.sku = 'A12')       AS has_a12,       -- au moins un élément vérifie\n  array_contains(tags, 'promo')           AS is_promo\nFROM silver.orders;\n```\n\n### Pièges d'examen\n\n- `withColumn` avec un nom existant remplace la colonne, sans erreur.\n- Une série de `withColumn` dans une boucle alourdit le plan d'exécution. Préférer un seul `select` ou `withColumns`.\n- Les commandes sans articles disparaissent après `explode` : il faut `explode_outer` pour les garder.\n- Sur un tableau, `transform` et `filter` gardent une ligne par commande. `explode` en crée une par élément.", "kw": ["withcolumn", "explode", "split", "array", "filter (", "transform", "pivot", "struct", "nested"]}, {"id": "dea-trans-4", "t": "Dédoublonner et agréger", "md": "### Trois façons de dédoublonner\n\n| Méthode | Ce qu'elle garde | Quand l'utiliser |\n| --- | --- | --- |\n| `distinct()` ou `SELECT DISTINCT` | Les lignes entièrement identiques une seule fois | Doublons exacts |\n| `dropDuplicates([\"order_id\"])` | Une ligne par clé, **sans garantie** sur laquelle | Peu importe la version gardée |\n| Fenêtre `row_number()` | La ligne choisie par un ordre, par exemple la plus récente | Garder la dernière version d'un enregistrement |\n\n```python\nfrom pyspark.sql import functions as F, Window\n\nw = Window.partitionBy(\"customer_id\").orderBy(F.col(\"updated_at\").desc())\nlatest = (customers\n  .withColumn(\"rn\", F.row_number().over(w))\n  .filter(\"rn = 1\")\n  .drop(\"rn\"))\n```\n\nEn SQL, la clause `QUALIFY` filtre directement sur la fenêtre :\n\n```sql\nSELECT * FROM bronze.customers\nQUALIFY row_number() OVER (PARTITION BY customer_id ORDER BY updated_at DESC) = 1;\n```\n\n### Ne pas réinsérer ce qui existe déjà : MERGE\n\nDédoublonner le lot entrant ne suffit pas si la table cible contient déjà ces clés. `MERGE INTO` compare les deux :\n\n```sql\nMERGE INTO silver.customers t\nUSING updates s\nON t.customer_id = s.customer_id\nWHEN MATCHED THEN UPDATE SET *\nWHEN NOT MATCHED THEN INSERT *;\n```\n\nAvec seulement `WHEN NOT MATCHED THEN INSERT`, on obtient une insertion sans doublon (« insert-only merge »). Le lot source doit lui-même être dédoublonné : si deux lignes source correspondent à la même ligne cible, le MERGE échoue.\n\n### Agréger\n\n```python\n(orders.groupBy(\"country\")\n   .agg(F.count(\"*\").alias(\"nb_orders\"),\n        F.countDistinct(\"customer_id\").alias(\"nb_clients\"),\n        F.approx_count_distinct(\"customer_id\").alias(\"nb_clients_approx\"),\n        F.avg(\"amount\").alias(\"panier_moyen\"),\n        F.sum(\"amount\").alias(\"ca\")))\n```\n\n- `countDistinct` est exact mais coûteux sur de gros volumes. `approx_count_distinct` (algorithme HyperLogLog++) est beaucoup plus rapide, avec une erreur relative par défaut de 5 %.\n- `df.describe()` donne count, mean, stddev, min et max. `df.summary()` ajoute les quartiles (25 %, 50 %, 75 %).\n- Une fonction de fenêtre garde toutes les lignes et ajoute une colonne calculée, là où `groupBy` réduit à une ligne par groupe. Total cumulé : `F.sum(\"amount\").over(Window.partitionBy(\"customer_id\").orderBy(\"ts\").rowsBetween(Window.unboundedPreceding, Window.currentRow))`.\n- `rank` laisse des trous après une égalité (1, 1, 3). `dense_rank` n'en laisse pas (1, 1, 2). `row_number` numérote sans égalité (1, 2, 3).\n\n### Pièges d'examen\n\n- « Garder l'enregistrement le plus récent par clé » : `row_number` sur une fenêtre triée, pas `dropDuplicates`.\n- « Ne pas créer de doublons avec ce qui est déjà dans la table » : MERGE, ou `dropDuplicates` sur le lot puis MERGE.\n- « Estimer rapidement le nombre de valeurs distinctes » : `approx_count_distinct`.\n- `count(DISTINCT col)` ignore les NULL.", "kw": ["dropduplicates", "distinct", "duplicate", "merge", "groupby", "agg(", "count", "window", "rank", "approx"]}, {"id": "dea-trans-5", "t": "Régler les performances", "md": "Le guide demande d'ajuster quelques paramètres Spark, puis de **re-mesurer**. La démarche compte autant que les valeurs : on observe dans le Spark UI ou le profil de requête, on change un seul paramètre, puis on compare.\n\n### Les paramètres du guide\n\n| Paramètre | Rôle | Défaut | Où le régler |\n| --- | --- | --- | --- |\n| `spark.sql.shuffle.partitions` | Nombre de partitions après un shuffle (jointure, `groupBy`, tri) | 200 | Dans la session : `spark.conf.set(...)` ou `SET` en SQL |\n| `spark.default.parallelism` | Nombre de partitions par défaut pour les RDD | Nombre total de cœurs | Configuration du cluster |\n| `spark.sql.autoBroadcastJoinThreshold` | Taille maximale d'une table pour une broadcast join automatique | 10 Mo. `-1` désactive | Dans la session |\n| `spark.executor.memory` | Mémoire de chaque exécuteur | Selon le type de nœud | Configuration du cluster, avant démarrage |\n| `spark.driver.memory` | Mémoire du driver | Selon le type de nœud | Configuration du cluster, avant démarrage |\n\n```python\nspark.conf.set(\"spark.sql.shuffle.partitions\", 64)          # petit volume : moins de partitions\nspark.conf.set(\"spark.sql.autoBroadcastJoinThreshold\", 50 * 1024 * 1024)  # 50 Mo\n```\n\nLes paramètres de mémoire et `spark.default.parallelism` se fixent au démarrage du cluster. Un `spark.conf.set` en cours de session n'a pas d'effet sur eux. En serverless, Databricks gère le calcul et seuls quelques paramètres de session restent modifiables.\n\n### Lire les symptômes\n\n| Symptôme | Cause probable | Réglage |\n| --- | --- | --- |\n| Des milliers de tâches minuscules sur un petit volume | Trop de partitions de shuffle | Baisser `spark.sql.shuffle.partitions`, ou laisser AQE regrouper |\n| Quelques tâches très longues, les autres finies | Asymétrie (*skew*) sur une clé | AQE skew join, ou revoir la clé |\n| Débordement sur disque (*spill*) ou OOM sur les exécuteurs | Partitions trop grosses ou mémoire insuffisante | Plus de partitions, ou plus de mémoire par exécuteur |\n| OOM sur le driver | `collect()` ou `toPandas()` sur un gros résultat, ou broadcast trop gros | Éviter de ramener les données au driver, augmenter `spark.driver.memory` |\n| Gros shuffle pour joindre une petite table | Table au-dessus du seuil de broadcast | Hint `broadcast` ou seuil relevé |\n\n### Adaptive Query Execution (AQE)\n\nAQE est actif par défaut sur Databricks. Pendant l'exécution, il regroupe les petites partitions de shuffle, passe une jointure en broadcast si une table s'avère petite, et découpe les partitions asymétriques. C'est pourquoi la valeur de `spark.sql.shuffle.partitions` compte moins qu'autrefois.\n\n### Pièges d'examen\n\n- Régler le nombre de partitions après une jointure ou une agrégation : `spark.sql.shuffle.partitions`, pas `spark.default.parallelism`.\n- Le driver plante sur un `collect()` : le problème vient de la quantité ramenée, ajouter des exécuteurs n'y change rien.\n- Désactiver la broadcast automatique : seuil à `-1`.\n- Toujours mesurer avant et après, avec le Spark UI ou le profil de requête.", "kw": ["shuffle", "partitions", "broadcast", "memory", "aqe", "spill"]}, {"id": "dea-trans-6", "t": "Les objets de la couche gold", "md": "Sources : [materialized views](https://docs.databricks.com/aws/en/views/materialized) et [streaming tables](https://docs.databricks.com/aws/en/tables/streaming).\n\nQuatre objets Unity Catalog peuvent servir une équipe BI. Ils se distinguent par deux questions : le résultat est-il stocké, et qui le tient à jour ?\n\n| Objet | Résultat stocké ? | Mise à jour | Cas d'usage |\n| --- | --- | --- | --- |\n| **Table** (managed) | Oui | Par votre code : `INSERT`, `MERGE`, `CREATE OR REPLACE` | Contrôle total, écritures complexes |\n| **Vue** | Non, seulement la requête | Recalculée à chaque lecture | Requête légère, sécurité (masquer des colonnes), toujours à jour |\n| **Materialized view** | Oui | Rafraîchie par Databricks, de façon incrémentale quand c'est possible | Agrégats coûteux lus souvent par des tableaux de bord |\n| **Streaming table** | Oui | Traite seulement les nouvelles données, chaque ligne une seule fois | Source en ajout seul : fichiers, Kafka, bronze vers silver |\n\n```sql\n-- materialized view : un agrégat pour la BI, rafraîchi chaque heure\nCREATE OR REPLACE MATERIALIZED VIEW gold.ca_par_jour\n  SCHEDULE EVERY 1 HOUR\nAS SELECT order_date, country, sum(amount) AS ca\n   FROM silver.orders GROUP BY order_date, country;\n\n-- streaming table : ingestion incrémentale de fichiers\nCREATE OR REFRESH STREAMING TABLE bronze.orders\nAS SELECT * FROM STREAM read_files('/Volumes/main/raw/orders/', format => 'json');\n\n-- vue : rien n'est stocké\nCREATE OR REPLACE VIEW gold.clients_fr AS\nSELECT customer_id, name FROM silver.customers WHERE country = 'FR';\n```\n\nCréées depuis Databricks SQL, une materialized view ou une streaming table s'appuient sur un pipeline serverless géré par Databricks. Dans un pipeline déclaratif, on les déclare avec `@dp.materialized_view` et `@dp.table` en Python, ex-`@dlt.table`.\n\n### Materialized view ou streaming table ?\n\n- La source est en ajout seul et on veut traiter chaque nouvelle ligne une fois : **streaming table**.\n- La requête fait des agrégats, des jointures, ou la source peut être modifiée (mises à jour, suppressions) : **materialized view**. Elle produit toujours le même résultat qu'un recalcul complet.\n- Une streaming table ne recalcule pas les lignes déjà traitées si la source change. C'est sa limite.\n\n### Les variantes de vues\n\n| Vue | Portée |\n| --- | --- |\n| `CREATE VIEW` | Objet Unity Catalog permanent, partageable avec des GRANT |\n| `CREATE TEMP VIEW` | La session ou le notebook en cours seulement |\n| `CREATE GLOBAL TEMP VIEW` | Toutes les sessions du même cluster, dans le schéma `global_temp`, jusqu'à l'arrêt du cluster |\n\n### Pièges d'examen\n\n- « Précalculer un agrégat coûteux pour un tableau de bord, rafraîchi régulièrement » : materialized view.\n- « Toujours à jour, sans stockage supplémentaire » : vue.\n- « Nouveaux fichiers traités une seule fois » : streaming table.\n- Une vue temporaire disparaît avec la session. Elle n'est pas visible depuis un autre notebook.", "kw": ["materialized", "streaming table", "view", "gold"]}, {"id": "dea-trans-7", "t": "Qualité des données", "md": "Source : [expectations](https://docs.databricks.com/aws/en/dlt/expectations).\n\nDeux mécanismes complémentaires : les **expectations**, dans les pipelines déclaratifs, et les **contraintes Delta**, sur n'importe quelle table.\n\n### Les expectations\n\nUne expectation est une règle booléenne attachée à une table du pipeline. Ce qui arrive aux lignes non conformes dépend de l'action choisie :\n\n| SQL | Python | Ligne non conforme | Le pipeline |\n| --- | --- | --- | --- |\n| `EXPECT (cond)` | `@dp.expect` | **Gardée**, l'écart est compté dans les métriques | Continue |\n| `EXPECT (cond) ON VIOLATION DROP ROW` | `@dp.expect_or_drop` | **Supprimée**, et comptée | Continue |\n| `EXPECT (cond) ON VIOLATION FAIL UPDATE` | `@dp.expect_or_fail` | Aucune ligne écrite pour ce lot | **Échoue** |\n\n```sql\nCREATE OR REFRESH STREAMING TABLE silver.orders (\n  CONSTRAINT id_present   EXPECT (order_id IS NOT NULL) ON VIOLATION DROP ROW,\n  CONSTRAINT montant_ok   EXPECT (amount >= 0),\n  CONSTRAINT date_valide  EXPECT (order_date <= current_date()) ON VIOLATION FAIL UPDATE\n)\nAS SELECT * FROM STREAM bronze.orders;\n```\n\nEn Python, `@dp.expect_all`, `@dp.expect_all_or_drop` et `@dp.expect_all_or_fail` appliquent un dictionnaire de règles d'un coup. Les métriques (lignes passées, supprimées) s'affichent sur la page du pipeline et se requêtent dans l'**event log** du pipeline.\n\n### Mettre en quarantaine plutôt que supprimer\n\n`DROP ROW` fait disparaître les lignes. Pour les analyser, on crée une seconde table avec la règle inverse :\n\n```python\n@dp.table\n@dp.expect_or_drop(\"valide\", \"reading < 120\")\ndef silver_readings():\n    return spark.readStream.table(\"bronze_readings\")\n\n@dp.table\n@dp.expect_or_drop(\"invalide\", \"reading >= 120\")\ndef quarantine_readings():\n    return spark.readStream.table(\"bronze_readings\")\n```\n\n### Les contraintes Delta\n\nHors pipeline, une table Delta peut porter des contraintes vérifiées à chaque écriture. Une seule ligne non conforme fait échouer toute la transaction, rien n'est écrit.\n\n```sql\nALTER TABLE silver.orders ALTER COLUMN order_id SET NOT NULL;\nALTER TABLE silver.orders ADD CONSTRAINT montant_positif CHECK (amount >= 0);\n```\n\n### Pièges d'examen\n\n- `EXPECT` seul : les lignes invalides sont **gardées** et signalées. `DROP ROW` : supprimées et signalées. `FAIL UPDATE` : le pipeline s'arrête.\n- Les métriques de qualité se lisent sur la page du pipeline, table par table, ou dans l'event log.\n- `location != NULL` ne marche jamais. On écrit `location IS NOT NULL`.\n- Une contrainte `CHECK` ne supprime pas les lignes fautives : elle refuse toute l'écriture.", "kw": ["expect", "constraint", "quality", "quarantine", "check"]}]}, {"u": "jobs", "t": "Lakeflow Jobs", "w": 16, "lessons": [{"id": "dea-jobs-1", "t": "Tâches et graphe de dépendances", "md": "Source : [Lakeflow Jobs](https://docs.databricks.com/aws/en/jobs/).\n\nUn **job** est un graphe orienté sans cycle (DAG) de **tâches**. Chaque tâche a un type, un calcul et une liste de tâches dont elle dépend (*Depends on*). Une tâche démarre quand ses dépendances sont terminées selon sa condition *Run if* (leçon 2).\n\n| Type de tâche | Usage |\n| --- | --- |\n| Notebook, script Python, wheel, JAR | Code d'ingénierie |\n| SQL : requête, fichier, tableau de bord, alerte | Rafraîchir un rapport, exécuter du SQL sur un warehouse |\n| Pipeline | Lancer une mise à jour d'un pipeline déclaratif |\n| dbt | Exécuter un projet dbt |\n| Run Job | Appeler un autre job |\n| If/else condition, For each | Flux de contrôle (leçon 2) |\n\n### Ordonner les tâches\n\n- **Séquence** : B dépend de A.\n- **Fan-out** : plusieurs tâches dépendent de la même tâche et s'exécutent en parallèle.\n- **Fan-in** : une tâche dépend de plusieurs autres, et attend qu'elles soient toutes terminées.\n- Pour ajouter un contrôle avant une tâche existante, on crée une nouvelle tâche dans le **même job** et on la met en dépendance de la tâche existante.\n\n### Passer des informations\n\n- **Paramètres de job** : définis au niveau du job, transmis à toutes les tâches, modifiables pour un lancement. Lus dans un notebook avec `dbutils.widgets.get(\"date\")`.\n- **Task values** : une tâche publie une valeur, une tâche suivante la lit.\n\n```python\n# tâche check_volume\ndbutils.jobs.taskValues.set(key=\"record_count\", value=n)\n# tâche suivante, ou condition d'une tâche If/else : {{tasks.check_volume.values.record_count}}\nn = dbutils.jobs.taskValues.get(taskKey=\"check_volume\", key=\"record_count\")\n```\n\n### La tâche pipeline\n\nUn pipeline déclaratif (Lakeflow Spark Declarative Pipelines, ex-DLT) se lance dans un job via une tâche Pipeline. Ses réglages à connaître :\n\n| Réglage | Options |\n| --- | --- |\n| Mode d'exécution | **Triggered** : traite les données disponibles puis s'arrête. **Continuous** : tourne et met à jour en permanence, jusqu'à l'arrêt manuel |\n| Mode de développement | **Development** : réutilise le calcul, pas de reprise automatique, pour itérer vite. **Production** : redémarre le calcul et relance sur erreur |\n| Code source | Un ou plusieurs notebooks ou fichiers, en SQL et en Python mélangés si besoin |\n\n### Pièges d'examen\n\n- *Depends on* : quand une autre tâche doit réussir avant celle-ci.\n- Un tableau de bord qui doit attendre trois tâches parallèles : fan-in, il dépend des trois.\n- Un pipeline peut mélanger des sources SQL et Python. Ce n'est pas une raison pour le réécrire.\n- Pipeline en mode continuous et production : les tables sont mises à jour en permanence et le calcul reste allumé jusqu'à l'arrêt du pipeline.", "kw": ["task", "depends on", "dag", "pipeline", "delta live", "live table", "notebook"]}, {"id": "dea-jobs-2", "t": "Flux de contrôle", "md": "Sources : [conditions Run if](https://docs.databricks.com/aws/en/jobs/run-if), [tâche If/else](https://docs.databricks.com/aws/en/jobs/if-else), [tâche For each](https://docs.databricks.com/aws/en/jobs/for-each), [repair run](https://docs.databricks.com/aws/en/jobs/repair-job-failures).\n\n### Reprises et délais\n\nChaque tâche peut avoir un nombre de **retries**, un délai entre deux tentatives et un **timeout**. Une erreur passagère, comme un réseau ou une source momentanément indisponible, est ainsi absorbée sans intervention. Un seuil d'alerte de durée signale les exécutions anormalement longues.\n\n### Les conditions Run if\n\nPar défaut, une tâche ne s'exécute que si toutes ses dépendances ont réussi. La condition *Run if* change cette règle :\n\n| Condition | La tâche s'exécute si… | Exemple |\n| --- | --- | --- |\n| All succeeded (défaut) | toutes les dépendances ont réussi | Enchaînement normal |\n| At least one succeeded | au moins une a réussi | Sources redondantes |\n| None failed | aucune n'a échoué, certaines ont pu être ignorées | Après une branche If/else |\n| All done | toutes sont terminées, quel que soit le résultat | Nettoyage, rapport final |\n| At least one failed | au moins une a échoué | Notification ou correction |\n| All failed | toutes ont échoué | Plan de secours |\n\n### Brancher et boucler\n\n- **If/else condition** : compare une valeur (paramètre ou task value) à une autre, par exemple `{{tasks.check_volume.values.record_count}} > 1000000`. Les tâches de la branche *true* ou *false* s'exécutent, les autres sont ignorées.\n- **For each** : répète une tâche pour chaque élément d'une liste, par exemple une liste de pays, avec un nombre d'itérations en parallèle réglable.\n- Le jour de la semaine ou la date du lancement s'obtiennent par les références dynamiques, comme `{{job.start_time.iso_weekday}}`, ce qui permet de n'exécuter une tâche que le dimanche.\n\n### Relancer après un échec : repair run\n\nAprès correction de l'erreur, **Repair run** relance uniquement les tâches en échec et celles qui en dépendent. Les tâches réussies ne sont pas réexécutées, ce qui économise du temps et du calcul. La réparation utilise les **réglages actuels** du job : un chemin de notebook ou une taille de cluster modifiés sont pris en compte. Elle existe dans l'interface et dans l'API (`repairRun`), et fonctionne aussi pour un job à une seule tâche.\n\n### Concurrence et notifications\n\n- `max_concurrent_runs` limite les exécutions simultanées du job, 1 par défaut. Au-delà, un nouveau lancement est **ignoré** (*skipped*), sauf si la **mise en file d'attente** (*queueing*) est activée.\n- Les **notifications** se règlent sur le job ou la tâche : au démarrage, en cas de succès, d'échec ou de dépassement de durée. Elles partent par e-mail ou vers une destination webhook, Slack ou Teams.\n\n### Pièges d'examen\n\n- Relancer après une correction : **Repair run**, pas un nouveau lancement complet.\n- Une tâche qui ne doit s'exécuter que si une autre réussit : dépendance avec *All succeeded*. Si l'autre échoue : *At least one failed*.\n- Router selon une valeur calculée : tâche If/else qui lit une task value.\n- Un lancement planifié marqué *skipped* : `max_concurrent_runs` atteint et file d'attente désactivée.\n- Être averti d'un échec par e-mail : notification sur le job.", "kw": ["repair", "retry", "if/else", "condition", "concurren", "notification", "alert", "email", "skipped"]}, {"id": "dea-jobs-3", "t": "Déclencheurs", "md": "Sources : [déclencheurs](https://docs.databricks.com/aws/en/jobs/triggers), [arrivée de fichiers](https://docs.databricks.com/aws/en/jobs/file-arrival-triggers).\n\n| Déclencheur | Le job démarre… | À retenir |\n| --- | --- | --- |\n| **Planifié** (*scheduled*) | à heure fixe | Mode simple ou syntaxe **cron** (Quartz), avec un fuseau horaire. Le cron se copie d'un job à l'autre |\n| **Arrivée de fichiers** (*file arrival*) | quand de nouveaux fichiers arrivent dans un volume ou une *external location* Unity Catalog | Vérification environ chaque minute. Un fichier écrasé sous le même nom ne déclenche rien |\n| **Mise à jour de table** (*table update*) | quand une ou plusieurs tables Unity Catalog sont mises à jour | Déclenche la couche silver dès que le bronze a de nouvelles données |\n| **Continu** | dès que l'exécution précédente se termine, avec succès ou en échec | Le job tourne en permanence. Non combinable avec d'autres déclencheurs |\n| **Manuel** | sur *Run now* ou par un orchestrateur externe via l'API | Aucun déclencheur configuré |\n\nLes déclencheurs sur fichiers et sur tables ont deux réglages anti-rafale : un **délai minimum entre deux déclenchements**, et une **attente après le dernier changement**, qui patiente jusqu'à ce que les arrivées se calment.\n\n### Temps ou données : comment choisir\n\n| Situation | Déclencheur |\n| --- | --- |\n| Les données arrivent à heure connue, ou le besoin est à heure fixe (rapport du matin) | Planifié |\n| Les fichiers arrivent à des moments imprévisibles et il faut les traiter vite, sans calcul allumé en permanence | Arrivée de fichiers |\n| Le job dépend d'une table produite par un autre pipeline ou une autre équipe | Mise à jour de table |\n| Latence de quelques secondes exigée | Continu, ou streaming continu |\n\nLe déclencheur décide **quand le job démarre**. Il ne dit pas quels fichiers traiter : avec un déclencheur d'arrivée de fichiers, c'est le checkpoint d'Auto Loader qui sait quels fichiers sont nouveaux.\n\n### Ne pas confondre avec les triggers de streaming\n\nDans le code Structured Streaming, `trigger` règle le rythme des micro-batchs à l'intérieur d'une exécution :\n\n| Code | Comportement |\n| --- | --- |\n| Sans trigger | Micro-batchs enchaînés dès que possible (par défaut toutes les 500 ms) |\n| `trigger(processingTime=\"5 seconds\")` | Un micro-batch toutes les 5 secondes |\n| `trigger(availableNow=True)` | Traite tout ce qui est disponible, en plusieurs micro-batchs, puis s'arrête |\n\nUn job planifié toutes les 12 minutes avec `availableNow=True` tient un objectif de fraîcheur de 15 minutes sans calcul allumé en permanence. Le **checkpoint** et les journaux d'écriture anticipée (*write-ahead logs*) enregistrent les offsets traités, ce qui permet de reprendre exactement là où l'exécution précédente s'était arrêtée.\n\n### Pièges d'examen\n\n- « Exécuter le silver dès que le bronze a été mis à jour » : déclencheur de mise à jour de table.\n- « Reproduire un planning complexe sur d'autres jobs » : syntaxe cron.\n- « Traiter tout l'existant puis s'arrêter » : `availableNow=True`. « Toutes les 5 secondes » : `processingTime`.\n- Le déclencheur d'arrivée de fichiers lance le job, et Auto Loader choisit les fichiers grâce à son checkpoint.", "kw": ["trigger", "schedule", "cron", "file arrival", "table update", "availablenow", "processingtime", "checkpoint"]}]}, {"u": "cicd", "t": "CI/CD", "w": 10, "lessons": [{"id": "dea-cicd-1", "t": "Git folders", "md": "Source : [Git folders](https://docs.databricks.com/aws/en/repos/).\n\nUn **Git folder** est un dossier du workspace relié à un dépôt distant : GitHub, GitLab, Azure DevOps, Bitbucket… Chaque utilisateur travaille dans son propre clone. Les opérations se font dans la boîte de dialogue Git :\n\n| Opération | Dans Databricks |\n| --- | --- |\n| Cloner un dépôt | Oui |\n| Créer une branche, changer de branche | Oui |\n| Voir les différences, committer et pousser (*commit & push*) | Oui |\n| Récupérer les changements (*pull*) | Oui |\n| Merge, rebase, résolution de conflits, reset | Oui, aujourd'hui dans l'interface |\n| Pull request | Lancée depuis l'intégration Git. La revue et la fusion se font chez le fournisseur |\n\nLe flux type : créer une branche de fonctionnalité à partir de `main`, modifier les notebooks, committer et pousser, ouvrir une pull request, faire relire, fusionner. La CI se déclenche alors sur la branche principale.\n\nL'authentification passe par un jeton personnel du fournisseur ou par l'application Databricks GitHub, configuré dans les paramètres utilisateur.\n\n### Pièges d'examen\n\n- Les questions anciennes disent que Repos ne sait pas fusionner. C'est faux aujourd'hui : merge, rebase et résolution de conflits sont dans l'interface. Q13 du site est obsolète pour cette raison.\n- Un Git folder versionne le code, il ne déploie rien. Pour déployer jobs et pipelines d'un environnement à l'autre : bundles et CLI.\n- Chaque développeur a son clone et sa branche. On ne travaille pas à plusieurs dans le même Git folder.", "kw": ["git", "repo", "branch", "pull request", "commit"]}, {"id": "dea-cicd-2", "t": "Declarative Automation Bundles", "md": "Sources : [bundles](https://docs.databricks.com/aws/en/dev-tools/bundles/), [variables](https://docs.databricks.com/aws/en/dev-tools/bundles/variables), [targets](https://docs.databricks.com/aws/en/dev-tools/bundles/settings).\n\nUn **bundle** décrit en YAML tout ce qu'il faut déployer : le code, les ressources (jobs, pipelines, tableaux de bord, etc.) et leur configuration pour chaque environnement. Le même code part en dev, en test puis en prod. Seuls les paramètres changent.\n\n### La structure\n\nUn seul fichier **`databricks.yml` à la racine** du projet. C'est la configuration principale, qui peut inclure d'autres fichiers YAML.\n\n```yaml\nbundle:\n  name: ventes_etl\n\ninclude:\n  - resources/*.yml          # définitions des jobs et pipelines\n\nvariables:\n  catalog:\n    description: Catalogue cible\n    default: dev\n  warehouse_id:\n    lookup:\n      warehouse: \"Shared SQL\"  # résolu par son nom au déploiement\n\nresources:\n  jobs:\n    etl_job:                   # clé de la ressource, utilisée par \"bundle run\"\n      name: etl-ventes-${bundle.target}\n      tasks:\n        - task_key: ingest\n          notebook_task:\n            notebook_path: ../src/ingest.ipynb\n            base_parameters:\n              catalog: ${var.catalog}\n\ntargets:\n  dev:\n    mode: development          # ressources préfixées au nom du développeur, plannings en pause\n    default: true\n    workspace:\n      host: https://dev.cloud.databricks.com\n  prod:\n    mode: production\n    workspace:\n      host: https://prod.cloud.databricks.com\n    variables:\n      catalog: prod            # surcharge de la variable pour la prod\n    run_as:\n      service_principal_name: sp-etl-prod\n```\n\n### Variables et surcharges\n\n- On déclare une variable dans `variables`, avec une valeur par défaut, et on la référence par `${var.nom}`.\n- Chaque **target** peut surcharger les variables, l'hôte du workspace, le calcul, les permissions ou l'identité d'exécution (`run_as`).\n- La valeur peut aussi venir de la ligne de commande (`--var=\"catalog=test\"`) ou d'une variable d'environnement `BUNDLE_VAR_catalog`.\n- Des substitutions prédéfinies existent : `${bundle.target}`, `${workspace.current_user.userName}`, etc.\n\n### Mode development ou production\n\n| `mode: development` | `mode: production` |\n| --- | --- |\n| Ressources préfixées par `[dev nom_utilisateur]`, pour que chacun ait sa copie | Ressources déployées telles quelles |\n| Plannings et déclencheurs mis en pause | Plannings actifs |\n| Pipelines en mode développement | Vérifications supplémentaires, `run_as` conseillé avec un service principal |\n\n### Reprendre des ressources créées à la main\n\n`databricks bundle generate job --existing-job-id 123` écrit la configuration YAML d'un job existant. `databricks bundle deployment bind etl_job 123` relie ensuite la ressource du bundle au job existant, pour le mettre à jour au lieu d'en créer un second.\n\n### Pièges d'examen\n\n- Un seul `databricks.yml` à la racine, qui contient le nom du bundle, les targets et les includes.\n- Un paramètre qui change selon l'environnement : une variable, surchargée dans `targets`.\n- La configuration propre à la prod, comme l'hôte, le catalogue ou l'identité d'exécution, se place dans la section `targets` du `databricks.yml`.\n- Un format de bundle valide commence par `resources:` puis `jobs:`, avec une liste `tasks` qui contient des `task_key`.", "kw": ["bundle", "databricks.yml", "target", "variable", "yaml"]}, {"id": "dea-cicd-3", "t": "Databricks CLI et pipeline CI/CD", "md": "Source : [commandes bundle de la CLI](https://docs.databricks.com/aws/en/dev-tools/cli/bundle-commands).\n\n### Les commandes à connaître\n\n| Commande | Rôle |\n| --- | --- |\n| `databricks bundle init` | Créer un projet à partir d'un modèle |\n| `databricks bundle validate -t prod` | Vérifier la syntaxe et la configuration résolue, sans rien déployer |\n| `databricks bundle deploy -t prod` | Déployer le code et créer ou mettre à jour les ressources de la target |\n| `databricks bundle run -t prod etl_job` | Lancer une ressource déployée, désignée par sa **clé** dans le YAML |\n| `databricks bundle summary` | Afficher ce qui est déployé et où |\n| `databricks bundle destroy -t dev` | Supprimer les ressources déployées |\n| `databricks bundle generate` / `deployment bind` | Reprendre une ressource créée à la main |\n\nSans `-t`, la CLI utilise la target marquée `default: true`. L'ordre normal est donc **validate, deploy, run**.\n\n### Dans la CI\n\n```yaml\n# .github/workflows/deploy.yml (extrait)\non:\n  push:\n    branches: [main]\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: databricks/setup-cli@main\n      - run: databricks bundle validate -t prod\n      - run: databricks bundle deploy -t prod\n        env:\n          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}\n          DATABRICKS_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}\n          DATABRICKS_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}\n```\n\nEn CI, la CLI s'authentifie avec un **service principal** (OAuth machine à machine), jamais avec le compte d'un développeur. Les tests d'intégration se lancent sur la target de test avant le déploiement en prod.\n\n### Pièges d'examen\n\n- Déployer : `databricks bundle deploy`. Lancer le job déployé : `databricks bundle run <clé>`. La clé est celle du YAML, pas le nom affiché du job.\n- Ordre complet : `validate`, puis `deploy`, puis `run`.\n- Déployer en prod : `deploy --target prod`, qui applique les réglages de `targets.prod`.\n- Paquet versionné et déployable par un ordonnanceur externe : bundles.", "kw": ["databricks bundle", "cli", "deploy", "validate"]}]}, {"u": "ops", "t": "Dépannage, supervision et optimisation", "w": 10, "lessons": [{"id": "dea-ops-1", "t": "Suivre les jobs", "md": "Source : [suivi des jobs](https://docs.databricks.com/aws/en/jobs/monitor).\n\n### L'historique des exécutions\n\nL'onglet **Runs** d'un job montre chaque exécution sous forme de matrice : une colonne par exécution, une ligne par tâche, avec la durée et le statut. On y voit d'un coup d'œil :\n\n- une **tendance** : une tâche qui passait de 5 à 12 minutes en une semaine\n- une tâche qui échoue régulièrement\n- l'exécution en cours, qu'on ouvre pour voir la tâche lente et ses métriques de calcul\n\nUne dérive se diagnostique en comparant l'exécution actuelle à une référence : volume traité, métriques du cluster (CPU, mémoire), plan d'exécution. Les tables système `system.lakeflow.*` donnent le même historique en SQL, sur tous les jobs.\n\n### Les statuts\n\n| Statut | Sens |\n| --- | --- |\n| Succeeded | Terminée avec succès |\n| Failed | Erreur dans la tâche |\n| Upstream failed | Non exécutée car une tâche dont elle dépend a échoué |\n| Skipped / Excluded | Ignorée : branche non retenue d'un If/else, ou limite de concurrence atteinte |\n| Timed out | Durée maximale dépassée |\n| Canceled | Arrêtée manuellement |\n\nDans le **graphe** de l'exécution, une tâche en *Upstream failed* renvoie à la vraie cause : la première tâche en *Failed* en amont.\n\n### Pièges d'examen\n\n- Une tâche lente dans l'exécution en cours : onglet Runs, ouvrir l'exécution active, puis la tâche.\n- Un job passé de 5 à 12 minutes : comparer les métriques dans l'historique des exécutions.\n- Plusieurs tâches en *Upstream failed* : corriger la tâche en amont, puis Repair run.", "kw": ["run history", "runs tab", "historical", "slow", "sla", "baseline"]}, {"id": "dea-ops-2", "t": "Lire le Spark UI", "md": "Source : [diagnostiquer avec le Spark UI](https://docs.databricks.com/aws/en/optimizations/spark-ui-guide/).\n\nLe Spark UI s'ouvre depuis le calcul de l'exécution. Il se lit de haut en bas : un **job** Spark se découpe en **stages**, séparés par les shuffles, et chaque stage en **tâches**, une par partition. On cherche d'abord le stage le plus long (onglets *Jobs* puis *Stages*), puis on ouvre ses **Summary Metrics** : min, 25e centile, médiane, 75e centile et max de chaque mesure sur les tâches.\n\n### Les trois goulets du guide\n\n| Goulet | Ce qu'on voit dans le stage | Correctifs |\n| --- | --- | --- |\n| **Data skew** (asymétrie) | Durée max des tâches très supérieure à la médiane (par exemple 20 min contre 30 s). Quelques tâches lisent beaucoup plus de données que les autres | AQE skew join (actif par défaut), hint `skew`, broadcast de la petite table, revoir la clé de jointure ou de regroupement |\n| **Shuffle** | Gros volumes en *Shuffle Read* et *Shuffle Write* entre deux stages | Broadcast de la petite table, filtrer et sélectionner les colonnes avant la jointure, ajuster `spark.sql.shuffle.partitions` |\n| **Spill** (débordement) | Colonnes *Spill (Memory)* et *Spill (Disk)* non nulles : la partition ne tient pas en mémoire et passe par le disque | Plus de partitions pour en réduire la taille, ou des nœuds avec plus de mémoire |\n\nAutres indices dans les métriques :\n\n- un **GC time** élevé indique une pression mémoire sur les exécuteurs\n- un temps CPU proche de la durée des tâches indique un job limité par le calcul. Un temps CPU très inférieur indique que les tâches attendent : lecture, réseau, shuffle\n- un stage avec quelques tâches seulement sur un gros cluster indique trop peu de partitions\n\nPour une requête SQL, le **query profile** donne la même lecture, opérateur par opérateur.\n\n### Pièges d'examen\n\n- Max beaucoup plus grand que la médiane dans les Summary Metrics : data skew.\n- *Spill* sur disque dans un stage de shuffle : partitions trop grosses. Correctif attendu : `spark.sql.shuffle.partitions`.\n- Job quatre fois plus lent, il faut trouver le stage fautif : Spark UI du calcul de l'exécution, onglets Jobs et Stages.\n- Ajouter des nœuds ne corrige pas un skew : la tâche la plus lourde reste sur un seul cœur.", "kw": ["spark ui", "skew", "spill", "shuffle", "stage", "cpu"]}, {"id": "dea-ops-3", "t": "Liquid Clustering et predictive optimization", "md": "Sources : [liquid clustering](https://docs.databricks.com/aws/delta/clustering), [predictive optimization](https://docs.databricks.com/aws/en/optimizations/predictive-optimization).\n\n### Liquid Clustering\n\nLe Liquid Clustering **remplace le partitionnement et le Z-ordering**. Il range les données selon des clés de clustering pour que les requêtes filtrées sur ces clés lisent moins de fichiers (*data skipping*). On peut changer les clés plus tard sans réécrire les données existantes.\n\n```sql\nCREATE TABLE sales (...) CLUSTER BY (customer_id, purchase_date);  -- à la création\nALTER TABLE sales CLUSTER BY (region);   -- changer les clés\nALTER TABLE sales CLUSTER BY AUTO;       -- Databricks choisit les clés selon les requêtes\nALTER TABLE sales CLUSTER BY NONE;       -- désactiver\nOPTIMIZE sales;                          -- clustering incrémental\nOPTIMIZE sales FULL;                     -- reclusterer tout l'existant, après un changement de clés\n```\n\n- Jusqu'à **4 clés**, avec des statistiques collectées (les 32 premières colonnes par défaut).\n- **Incompatible avec `PARTITIONED BY` et `ZORDER`**. Pour une table partitionnée, on réécrit la table (CTAS ou `REPLACE`). Les runtimes les plus récents (18.1+) proposent aussi `ALTER TABLE ... REPLACE PARTITIONED BY WITH CLUSTER BY`.\n- Le clustering s'applique en partie à l'écriture, et pour le reste avec `OPTIMIZE`.\n- `CLUSTER BY AUTO` demande une table **managed** Unity Catalog et la predictive optimization.\n- Bien adapté à : filtres sur des colonnes à forte cardinalité, données asymétriques, tables qui grossissent vite, écritures concurrentes, usages qui changent.\n\n### Predictive optimization\n\nLa predictive optimization fait tourner automatiquement la maintenance des tables **managed** Unity Catalog, au bon moment, sur du calcul serverless :\n\n- `OPTIMIZE`, y compris le Liquid Clustering\n- `VACUUM`\n- `ANALYZE`, pour les statistiques\n\nElle s'active au niveau du compte, d'un catalogue ou d'un schéma, et les objets enfants en héritent. Plus besoin de planifier des jobs `OPTIMIZE` et `VACUUM` à la main. L'historique de ses opérations est dans la table système `system.storage.predictive_optimization_operations_history`.\n\n### Pièges d'examen\n\n- Table partitionnée et Z-orderée qui reste lente : passer au Liquid Clustering. Il faut réécrire la table, les deux ne se combinent pas.\n- Ne plus planifier `OPTIMIZE` et `VACUUM` à la main : activer la predictive optimization sur le catalogue ou le schéma.\n- Savoir si une table clusterée a bien été optimisée : `DESCRIBE HISTORY` montre les opérations `OPTIMIZE`.\n- Predictive optimization et `CLUSTER BY AUTO` : tables managed seulement.", "kw": ["liquid", "clustering", "z-order", "zorder", "predictive", "optimize", "partition"]}, {"id": "dea-ops-4", "t": "Diagnostiquer les pannes", "md": "Sources : [dépannage du calcul](https://docs.databricks.com/aws/en/compute/troubleshooting/), [bibliothèques](https://docs.databricks.com/aws/en/libraries/).\n\n### Le cluster ne démarre pas\n\nLe premier réflexe est l'onglet **Event log** du cluster, qui donne le motif de l'échec.\n\n| Cause | Indice | Correctif |\n| --- | --- | --- |\n| Capacité ou quota du cloud | Type d'instance indisponible dans la zone, quota de cœurs atteint | Autre type d'instance ou autre zone, demande de quota, pool, serverless |\n| Réseau | Plus d'adresses IP libres dans le sous-réseau, règles de pare-feu | Agrandir le sous-réseau, corriger le réseau |\n| Droits | Profil d'instance ou identité cloud refusés | Corriger le rôle cloud |\n| Script d'initialisation | Le script échoue, avec ses journaux dans l'event log | Corriger ou retirer le script |\n| Politique de calcul | La configuration demandée viole la politique | Ajuster la configuration à la politique |\n\n### Conflits de bibliothèques\n\n- Le runtime embarque déjà de nombreuses bibliothèques. En installer une autre version peut casser une dépendance. Symptômes : `ImportError`, `ModuleNotFoundError`, erreurs étranges après une installation.\n- Les bibliothèques **de notebook** (`%pip install paquet==1.2.3`, puis `dbutils.library.restartPython()`) n'affectent que ce notebook. Les bibliothèques **de cluster** affectent tous ses utilisateurs.\n- Bonnes pratiques : figer les versions, regrouper les dépendances dans un fichier `requirements.txt`, choisir une version de runtime compatible, et utiliser les *environments* en serverless.\n\n### Out of memory\n\n| Où | Causes typiques | Correctifs |\n| --- | --- | --- |\n| **Driver** | `collect()`, `toPandas()` ou `display()` sur un gros résultat, broadcast trop gros, nombreux notebooks sur un all-purpose | Ne ramener que des agrégats ou un échantillon, écrire en table, augmenter `spark.driver.memory` ou la taille du driver |\n| **Exécuteurs** | Partitions trop grosses, skew, `explode` qui multiplie les lignes | Plus de partitions, traiter le skew, nœuds avec plus de mémoire |\n\nPour déboguer du code Python pas à pas, le **débogueur interactif** des notebooks pose des points d'arrêt et affiche les variables. L'explorateur de variables les montre aussi.\n\n### Pièges d'examen\n\n- `OutOfMemoryError` juste après `display(df.collect())` ou `toPandas()` : c'est la mémoire du driver, il faut ramener moins de données.\n- OOM dans un stage de shuffle, avec du spill : augmenter `spark.sql.shuffle.partitions`.\n- Inspecter les variables d'une fonction qui échoue : débogueur interactif du notebook.\n- Données mal réparties sur les nœuds : `repartition` sur une clé plus équilibrée.", "kw": ["outofmemory", "memory", "driver", "library", "debugger", "topandas", "collect"]}]}, {"u": "gov", "t": "Gouvernance et sécurité", "w": 15, "lessons": [{"id": "dea-gov-1", "t": "Tables managed et external", "md": "Sources : [tables managed](https://docs.databricks.com/aws/en/tables/managed), [tables external](https://docs.databricks.com/aws/en/tables/external), [conversion](https://docs.databricks.com/aws/en/tables/convert-external-managed).\n\n| | **Managed** | **External** |\n| --- | --- | --- |\n| Qui gère les fichiers | Unity Catalog, dans l'emplacement managé du metastore, du catalogue ou du schéma | Vous, dans un chemin cloud que vous indiquez par `LOCATION` |\n| `DROP TABLE` | Supprime les métadonnées **et les données**. Les fichiers sont effacés après 7 jours, `UNDROP` est possible pendant ce délai | Supprime seulement les métadonnées. **Les fichiers restent** |\n| Optimisations automatiques | Predictive optimization, `CLUSTER BY AUTO`, meilleures performances | Non |\n| Quand l'utiliser | Par défaut, recommandé | Données partagées avec d'autres outils qui lisent le chemin, données existantes à ne pas déplacer |\n\n### Créer\n\n```sql\n-- managed : aucun chemin\nCREATE TABLE main.sales.orders (id BIGINT, amount DECIMAL(10,2));\n\n-- external : un chemin dans une external location Unity Catalog\nCREATE TABLE main.sales.orders_ext (id BIGINT, amount DECIMAL(10,2))\nLOCATION 's3://bucket-ventes/orders';\n```\n\nUne table external s'appuie sur deux objets Unity Catalog : une **storage credential**, qui contient l'identité cloud, et une **external location**, qui associe un chemin à cette credential. Il faut le privilège `CREATE EXTERNAL TABLE` sur l'external location.\n\n### Convertir\n\n```sql\nALTER TABLE main.sales.orders_ext SET MANAGED;    -- external vers managed\nALTER TABLE main.sales.orders_ext UNSET MANAGED;  -- retour arrière, sous 14 jours\n```\n\n- `SET MANAGED` copie les données et le journal Delta vers l'emplacement managé, en gardant l'historique, les droits et les vues. L'écriture est bloquée une à deux minutes pendant la bascule.\n- Les flux Structured Streaming qui lisent ou écrivent la table échouent après la conversion. Il faut **les redémarrer** avec la même configuration.\n- Il faut le runtime 17.3 LTS ou plus récent, ou le serverless, et être propriétaire de la table.\n- Il n'existe pas de commande pour passer de managed à external. On réécrit les données, par exemple avec un CTAS et une clause `LOCATION`.\n\n### Pièges d'examen\n\n- Après `DROP TABLE`, les fichiers sont toujours là : la table était external. Ils ont disparu : elle était managed.\n- Retirer un schéma : `DROP` les tables managed temporaires supprime aussi leurs données. `DROP` les tables external ne retire que la référence et garde les fichiers.\n- Profiter des optimisations automatiques : tables managed. Convertir une table external existante : `SET MANAGED`.\n- Préparer un emplacement cloud gouverné : storage credential puis external location.", "kw": ["managed", "external", "drop table", "location", "set managed", "external location", "storage credential"]}, {"id": "dea-gov-2", "t": "Privilèges", "md": "Sources : [privilèges Unity Catalog](https://docs.databricks.com/aws/en/data-governance/unity-catalog/manage-privileges/privileges), [politiques DENY](https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/deny-policies).\n\n### La règle des trois niveaux\n\nPour lire une table, il faut un privilège à **chaque niveau** du chemin :\n\n```sql\nGRANT USE CATALOG ON CATALOG sales_catalog                TO `analystes`;\nGRANT USE SCHEMA  ON SCHEMA  sales_catalog.market_data    TO `analystes`;\nGRANT SELECT      ON TABLE   sales_catalog.market_data.summary TO `analystes`;\n```\n\nSans `USE CATALOG` et `USE SCHEMA`, le `SELECT` seul ne suffit pas. Un privilège accordé à un niveau est **hérité** par tout ce qu'il contient : `GRANT SELECT ON SCHEMA` donne la lecture de toutes les tables du schéma, présentes et futures.\n\n### Les privilèges courants\n\n| Privilège | Sur | Permet |\n| --- | --- | --- |\n| `USE CATALOG`, `USE SCHEMA` | Catalogue, schéma | Traverser ce niveau. Ne donne accès à aucune donnée |\n| `BROWSE` | Catalogue | Voir les métadonnées des objets sans lire les données |\n| `SELECT` | Table, vue | Lire |\n| `MODIFY` | Table | Insérer, mettre à jour, supprimer des lignes |\n| `CREATE TABLE`, `CREATE SCHEMA`… | Schéma, catalogue | Créer des objets à l'intérieur |\n| `READ VOLUME`, `WRITE VOLUME` | Volume | Lire ou écrire des fichiers |\n| `EXECUTE` | Fonction | Appeler une fonction |\n| `MANAGE` | Tout objet | Gérer les droits et l'objet, sans en être propriétaire |\n| `ALL PRIVILEGES` | Tout objet | Tous les privilèges applicables, sauf `MANAGE` |\n\nLe **propriétaire** d'un objet, souvent son créateur, a tous les droits dessus et peut les accorder. On transfère la propriété avec `ALTER TABLE t OWNER TO data_admins`. Le propriétaire d'un schéma peut gérer les droits de tout ce qu'il contient. Les administrateurs du metastore et du workspace peuvent réattribuer la propriété d'objets orphelins, par exemple après le départ d'un employé.\n\n### Accorder, retirer, vérifier\n\n```sql\nGRANT SELECT, MODIFY ON TABLE main.sales.orders TO `data-engineers`;  -- tirets : backticks obligatoires\nREVOKE MODIFY ON TABLE main.sales.orders FROM `data-engineers`;\nSHOW GRANTS ON TABLE main.sales.orders;\n```\n\n- Les bénéficiaires sont des utilisateurs, des groupes ou des **service principals** (identités techniques pour les jobs et la CI). Bonne pratique : accorder à des groupes.\n- Dans l'interface : Catalog Explorer, onglet **Permissions** de l'objet. On y voit aussi qui a accès et qui est propriétaire.\n\n### Et DENY ?\n\nUnity Catalog n'a pas d'instruction `DENY` autonome : sans GRANT, il n'y a pas d'accès, et `REVOKE` retire un GRANT existant. `DENY` existait dans les anciennes ACL de tables du Hive metastore. Dans Unity Catalog, un refus explicite passe par une **politique ABAC DENY** (en bêta), qui l'emporte sur tout GRANT. Voir la leçon 4.\n\n### Pièges d'examen\n\n- `GRANT SELECT` sur une vue réussi mais accès refusé : il manque `USE CATALOG` et `USE SCHEMA` sur le chemin catalogue, schéma, vue.\n- Lire sans modifier : `SELECT`. Gérer entièrement une table : `ALL PRIVILEGES`.\n- Déléguer la gestion des droits d'un schéma sans faire d'administrateur : `MANAGE` sur le schéma, ou transfert de propriété.\n- `USAGE` et `DATABASE` sont la syntaxe Hive metastore. En Unity Catalog : `USE CATALOG`, `USE SCHEMA` et `SCHEMA`.\n- Un nom de groupe avec un tiret s'écrit entre backticks.", "kw": ["grant", "privilege", "permission", "owner", "use catalog", "usage", "select"]}, {"id": "dea-gov-3", "t": "Masques de colonnes et filtres de lignes", "md": "Source : [filtres de lignes et masques de colonnes](https://docs.databricks.com/aws/en/tables/row-and-column-filters).\n\nLes deux mécanismes reposent sur une **fonction SQL** attachée à une table. Elle s'évalue à chaque lecture, selon la personne qui interroge. La fonction `is_account_group_member('groupe')` teste l'appartenance à un groupe.\n\n| | Filtre de lignes (*row filter*) | Masque de colonne (*column mask*) |\n| --- | --- | --- |\n| Effet | Cache des **lignes** entières | Remplace la **valeur** d'une colonne |\n| La fonction renvoie | Un BOOLEAN : la ligne est visible si TRUE | Une valeur du même type que la colonne |\n| Attachement | `ALTER TABLE ... SET ROW FILTER f ON (col)` | `ALTER TABLE ... ALTER COLUMN c SET MASK f` |\n\n### Filtre de lignes\n\n```sql\n-- 1. créer la fonction\nCREATE FUNCTION main.secure.region_filter(region STRING)\nRETURN is_account_group_member('all_regions') OR region = 'EU';\n\n-- 2. l'attacher à la table\nALTER TABLE main.secure.events SET ROW FILTER main.secure.region_filter ON (region);\n```\n\n### Masque de colonne\n\n```sql\nCREATE FUNCTION main.secure.mask_email(email STRING)\nRETURN CASE WHEN is_account_group_member('rh') THEN email ELSE '***' END;\n\nALTER TABLE main.secure.employees ALTER COLUMN email SET MASK main.secure.mask_email;\n```\n\nOn les retire avec `DROP ROW FILTER` et `ALTER COLUMN ... DROP MASK`. Avant ces fonctions, on utilisait des **vues dynamiques** : une vue avec `CASE WHEN is_account_group_member(...)` ou un `WHERE`, sur laquelle on donnait `SELECT` à la place de la table.\n\n### Pièges d'examen\n\n- L'ordre compte : créer la fonction, puis l'attacher.\n- Une fonction de filtre renvoie un BOOLEAN. Une fonction de masque renvoie une valeur du type de la colonne.\n- « Même table, chaque groupe voit des lignes différentes » : filtre de lignes. « Masquer un e-mail sauf pour les RH » : masque de colonne.\n- Ces règles s'appliquent table par table. Pour en appliquer à des centaines de tables d'un coup : ABAC.", "kw": ["row filter", "mask", "row-level", "dynamic view", "is_account_group_member"]}, {"id": "dea-gov-4", "t": "ABAC", "md": "Sources : [politiques ABAC](https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/policies), [politiques DENY](https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/deny-policies).\n\nL'**ABAC** (contrôle d'accès par attributs) applique filtres et masques à partir de **governed tags**, et non table par table. On tague les colonnes et les tables sensibles, puis on écrit **une politique** attachée à un catalogue, un schéma ou au metastore. Elle s'applique à toutes les tables qui correspondent, y compris celles créées plus tard.\n\n```sql\n-- masquer tous les numéros de sécurité sociale tagués pii=ssn, sauf pour les admins\nCREATE POLICY mask_ssn\nON SCHEMA prod.customers\nCOLUMN MASK ssn_to_last_nr\nTO us_analysts EXCEPT admins\nFOR TABLES\nMATCH COLUMNS has_tag_value('pii', 'ssn') AS ssn\nON COLUMN ssn\nUSING COLUMNS (4);\n\n-- filtrer les lignes européennes des tables sensibles\nCREATE POLICY hide_eu_customers\nON SCHEMA prod.customers\nROW FILTER non_eu_region\nTO us_analysts\nFOR TABLES\nWHEN has_tag_value('sensitivity', 'high')\nMATCH COLUMNS has_tag('geo_region') AS region\nUSING COLUMNS (region);\n```\n\n| Clause | Rôle |\n| --- | --- |\n| `ON CATALOG / SCHEMA / METASTORE` | Portée de la politique, héritée par tout ce qu'elle contient |\n| `TO ... EXCEPT ...` | Qui est filtré ou masqué, et qui en est exempté |\n| `WHEN` | Quelles tables, d'après leurs tags |\n| `MATCH COLUMNS` | Quelles colonnes, d'après leurs tags |\n\nLes politiques **DENY**, en bêta, utilisent la même syntaxe pour refuser explicitement un privilège, aujourd'hui `MANAGE ACCESS CONTROL`, sur les objets tagués. Un DENY l'emporte sur tout GRANT, et on le consulte avec `SHOW EFFECTIVE POLICIES`, pas avec `SHOW GRANTS`.\n\nIl faut le runtime 16.4 ou plus récent, ou le serverless, le privilège `MANAGE` sur l'objet, et `EXECUTE` sur la fonction.\n\n### Pièges d'examen\n\n- « Une seule règle pour toutes les colonnes sensibles, actuelles et futures » : ABAC avec governed tags. Les filtres et masques table par table ne passent pas à l'échelle.\n- ABAC réutilise les mêmes fonctions SQL que les filtres et masques. La différence est la façon de cibler, par tags.\n- Un tag ajouté sur une nouvelle colonne suffit pour qu'elle soit protégée, sans modifier la politique.", "kw": ["abac", "tag", "policy"]}]}]};

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayNum(s){if(!s)return -1e6;const[y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/DAY)}
function weekKey(){const d=new Date();const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const wd=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-wd);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/DAY+1)/7);return y+"-W"+w}
const fmtTime=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(r).padStart(2,"0")};

/* ---------- Persistence ---------- */
const writing={},pending={};
async function writeDoc(path,data){
  if(!S.db||!S.uid||S.localOnly)return;
  if(writing[path]){pending[path]=data;return}
  writing[path]=true;
  try{await S.db.doc(path).set(data)}catch(e){if(e&&(e.code==="not_granted"||e.code==="capability_disabled")){S.localOnly=true;renderBanner()}}
  writing[path]=false;
  if(pending[path]){const d=pending[path];delete pending[path];writeDoc(path,d)}
}
function rollKeys(){const p=S.player,w=weekKey(),t=today();if(p.weekKey!==w){p.weekKey=w;p.weekXp=0}if(p.dayKey!==t){p.dayKey=t;p.dayXp=0}}
function focusOf(c){const u=COURSE[c];const all=u?u.flatMap(x=>x.lessons):[];const d=S.player.course||{};return{c,prep:readiness(c),done:all.filter(l=>d[l.id]).length,total:all.length,at:Date.now()}}
function progOf(){const out={};const d=S.player.course||{};for(const c of Object.keys(CERTS)){const active=Object.keys(S.srs[c]||{}).length>0||Object.keys(d).some(id=>id.startsWith(c+"-"));if(active)out[c]=readiness(c)}return out}
function savePlayer(){rollKeys();try{S.player.prog=progOf();delete S.player.focus}catch(e){}LS.set("player",S.player);if(S.uid)writeDoc("players/"+S.uid,S.player);renderTop()}

/* ---------- Spaced repetition (resserrée) ----------
   Ratée : revient tout de suite en Rattrapage. Rattrapage réussi : revient à J+1.
   Réussie : J+2, puis J+5. 3 réussites d'affilée : maîtrisée (sort des leçons, reste dans sprints et examens). */
function record(q,ok){
  const m=S.srs[q.c];const e=m[q.id]||{c:0,due:0,w:0,n:0,k:0,m:0};const now=Date.now();
  e.n++;
  if(ok){e.k++;if(e.w){e.w=0;e.c=0;e.due=now+DAY;S.player.cleared++}else{e.c++;e.due=now+(e.c===1?2:5)*DAY;if(e.c>=3)e.m=1}}
  else{e.c=0;e.w=1;e.m=0;e.due=now}
  m[q.id]=e;S.player.answered++;if(ok)S.player.correct++;
}
function wrongList(c){const m=S.srs[c];return allQ(c).filter(q=>m[q.id]&&m[q.id].w)}
function stats(c,d){const m=S.srs[c];const qs=allQ(c).filter(q=>!d||q.d===d);let seen=0,mast=0,due=0;const now=Date.now();for(const q of qs){const e=m[q.id];if(e){seen++;if(e.m)mast++;else if(!e.w&&e.due<=now)due++}}return{total:qs.length,seen,mast,due}}
function mastery(c,d){const m=S.srs[c];const qs=allQ(c).filter(q=>!d||q.d===d);if(!qs.length)return 0;let s=0;for(const q of qs){const e=m[q.id];if(e)s+=e.m?1:e.w?0:Math.min(e.c,3)/3}return Math.round(100*s/qs.length)}

/* ---------- XP, streak, badges ---------- */
function addXp(n){rollKeys();S.player.xp+=n;S.player.weekXp+=n;S.player.dayXp+=n}
function streakOf(p){if(!p.lastDay)return 0;const diff=dayNum(today())-dayNum(p.lastDay);if(diff<=1)return p.streak;if(diff===2&&p.freezeWeek!==weekKey())return p.streak;return 0}
function bumpStreak(){const p=S.player,t=today();if(p.lastDay===t)return null;const diff=dayNum(t)-dayNum(p.lastDay);let froze=false;
  if(diff===1)p.streak++;else if(diff===2&&p.freezeWeek!==weekKey()&&p.streak>0){p.freezeWeek=weekKey();p.streak++;froze=true}else p.streak=1;
  p.lastDay=t;p.best=Math.max(p.best,p.streak);return froze}

function inlineMd(t){const codes=[];t=t.replace(/`([^`]+)`/g,(_,x)=>{codes.push(x);return"\u0000"+(codes.length-1)+"\u0000"});t=esc(t);

function md2html(md){const L=md.split("\n");let h="",i=0;const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
  while(i<L.length){const l=L[i];
    if(/^```/.test(l)){let j=i+1,b=[];while(j<L.length&&!/^```/.test(L[j]))b.push(L[j++]);h+=`<pre class="code">${esc(b.join("\n"))}</pre>`;i=j+1;continue}
    if(/^\s*\|/.test(l)){const rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(L[i++]);const head=cells(rows[0]);const body=rows.slice(1).filter(r=>!/^\s*\|\s*:?-{2,}/.test(r));

    if(/^\s*[-*]\s+/.test(l)){let items=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i]))items.push(L[i++].replace(/^\s*[-*]\s+/,""));h+=`<ul>${items.map(x=>`<li>${inlineMd(x)}</li>`).join("")}</ul>`;continue}

const STOPW=new Set("avec dans pour plus elle elles sont cette ces etre fait faire leur leurs entre comme sans sous mais donc tout tous toute toutes quel quelle quels quelles what which that this with from have when will should into than then they their there would could each data table tables databricks using used uses option following true false best does need needs your about only also more most other some such".split(" "));
const toks=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9_.]+/g," ").split(" ").map(w=>w.replace(/^\.+|\.+$/g,"")).filter(w=>w.length>=4&&!STOPW.has(w)&&!/^\d+$/.test(w));
const LMAP={};
function lessonMap(c){const units=courseOf(c);if(!units)return {};const qs=allQ(c);const key=qs.length+":"+qs.map(q=>q.id).join("").length;if(LMAP[c]&&LMAP[c].key===key)return LMAP[c].m;const m={};
  for(const u of units){const L=u.lessons.length;const docs=u.lessons.map(l=>new Set(toks(l.t+" "+l.md+" "+l.kw.join(" "))));const df={};docs.forEach(d=>d.forEach(w=>df[w]=(df[w]||0)+1));
    for(const q of qs){if(q.d!==u.u)continue;const raw=(q.q+" "+q.o.join(" ")+" "+(q.code||"")).toLowerCase();const qt=new Set(toks(raw+" "+(q.e||"")));
      const sc=docs.map((d,i)=>{let v=0;qt.forEach(w=>{if(d.has(w))v+=Math.log(1+L/df[w])});return v+1.5*u.lessons[i].kw.filter(k=>raw.includes(k)).length});

function viewLeague(){
  const wk=weekKey();const meId=S.uid;
  let list=S.players.slice();
  if(!S.online)list=[Object.assign({id:"me"},S.player)];
  const rows=list.map(p=>({id:p.id,xp:S.lbMode==="week"?(p.weekKey===wk?p.weekXp||0:0):p.xp||0,streak:streakOf(p),badges:(p.badges||[]).length,prog:p.prog||{},avatar:p.avatar})).filter(r=>S.lbMode!=="week"||r.xp>0||r.id===meId).sort((a,b)=>b.xp-a.xp);
  const left=((new Date().getDay()||7)===7)?"Se termine ce soir à minuit":`Se termine dans ${8-(new Date().getDay()||7)} jours`;
  return `
  <section class="league">${mascot(64,"wow")}<div><h2>${S.lbMode==="week"?"Ligue de la semaine":"Classement général"}</h2><p>${S.lbMode==="week"?left+" · remise à zéro chaque lundi":"Total d'XP depuis le début"} · toutes certifications confondues</p></div></section>
  <div class="seg" role="group" aria-label="Période"><button data-act="lb" data-m="week" aria-pressed="${S.lbMode==="week"}">Cette semaine</button><button data-act="lb" data-m="all" aria-pressed="${S.lbMode==="all"}">Depuis le début</button></div>
  ${rows.length?`<div class="rows">${rows.map((r,i)=>{const nm=r.id==="me"||r.id===meId?"Toi":(S.names[r.id]||"Collègue");const ini=(nm==="Toi"?(S.names[meId]||"Toi"):nm).split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();return `<div class="row${r.id===meId||r.id==="me"?" me":""}"><span class="rk m${i+1} num">${i+1}</span>${r.avatar?`<span class="av img">${avatarSvg(r.avatar,42)}</span>`:`<span class="av" style="background:${hashColor(r.id)}">${esc(ini)}</span>`}<span class="nm">${esc(nm)}<small>${Object.entries(r.prog).filter(([c])=>CERTS[c]).map(([c,v])=>`${CERTS[c].tag} ${v} % · `).join("")}${r.streak?`${r.streak} j de série · `:""}${r.badges} badge${r.badges>1?"s":""}</small></span><span class="xp num">${r.xp} XP</span></div>`}).join("")}</div>`
  :`<div class="empty">${mascot(64,"sad")}<b>Personne n'a encore marqué de points cette semaine.</b><span>Termine une leçon pour prendre la tête.</span></div>`}
  ${!S.online?`<p class="note" style="margin-top:14px">Le classement partagé s'affiche dès que la connexion au serveur WeeCert est rétablie.</p>`:""}`;
}
async function resolveNames(){
  if(!S.user||!S.online)return;const ids=S.players.map(p=>p.id).concat(S.uid?[S.uid]:[]).filter(id=>!(id in S.names));if(!ids.length)return;
  try{const ps=await S.user.profiles(ids);let ch=false;for(const id of ids){const n=ps&&ps[id]&&ps[id].name;S.names[id]=n||"Collègue";ch=true}if(ch&&(S.tab==="league"||S.tab==="profile")&&$("#session").hidden)render()}catch(e){}
}
