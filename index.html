["dep","dev","Quel est le rôle du watermark dans ce code ?",["Trier les événements","Borner l'état conservé et ignorer les événements arrivant plus de 10 min en retard","Retarder l'écriture de 10 minutes","Filtrer les événements des 10 dernières minutes"],1,"Le watermark indique jusqu'à quand attendre les données en retard. Au-delà, l'état de la fenêtre est purgé et les événements trop tardifs sont ignorés.","(df.withWatermark(\"event_time\", \"10 minutes\")\n   .groupBy(window(\"event_time\", \"5 minutes\"))\n   .count())"],
["dep","dev","Pour une jointure externe stream-stream, qu'est-ce qui est obligatoire ?",["Un broadcast","Des watermarks et une contrainte temporelle dans la condition de jointure","Un trigger continuous","Un checkpoint différent par source"],1,"Sans watermark ni borne temporelle, Spark ne peut ni émettre les lignes sans correspondance ni purger l'état."],
["dep","dev","Quel cas d'usage justifie foreachBatch dans un stream ?",["Lire plusieurs sources","Exécuter un MERGE (upsert) de chaque micro-batch vers une table Delta","Augmenter le parallélisme","Remplacer le checkpoint"],1,"foreachBatch donne un DataFrame batch par micro-batch, ce qui permet MERGE, écritures multiples ou logique non supportée en streaming."],
["dep","dev","Comment rendre idempotentes les écritures Delta dans foreachBatch ?",["Avec le mode overwrite","Avec les options txnAppId et txnVersion","Avec un cache","Avec repartition(1)"],1,"txnAppId (identifiant stable) et txnVersion (le batchId) permettent à Delta d'ignorer un batch déjà écrit en cas de relance."],
["dep","dev","Pourquoi préférer une pandas UDF à une UDF Python classique ?",["Elle s'exécute sur le driver","Elle traite des lots vectorisés via Apache Arrow, avec beaucoup moins de surcoût de sérialisation","Elle est écrite en Scala","Elle ne nécessite pas de cluster"],1,"Les pandas UDF échangent des blocs Arrow au lieu de sérialiser ligne par ligne. Mieux encore : utiliser les fonctions natives Spark quand elles existent."],
["dep","dev","Comment passer une valeur calculée par une tâche à une tâche suivante du même job ?",["Avec une variable globale Python","Avec dbutils.jobs.taskValues.set puis get","En écrivant dans /tmp","Avec spark.conf.set"],1,"Les task values partagent de petites valeurs entre tâches d'un même run. Elles sont aussi utilisables dans les conditions If/else."],
["dep","dev","Quelle tâche Lakeflow Jobs exécute une même tâche pour chaque élément d'une liste de paramètres ?",["Run Job","For each","If/else","Python wheel"],1,"La tâche For each boucle sur une liste (statique ou issue de task values) avec un parallélisme configurable."],
["dep","perf","Comment activer le Change Data Feed sur une table existante ?",["ALTER TABLE t SET TBLPROPERTIES (delta.enableChangeDataFeed = true)","OPTIMIZE t WITH CDF","CREATE CDF ON t","spark.conf.set('cdf', true)"],0,"Une fois activé, Delta enregistre les changements ligne à ligne à partir de cette version. Lecture avec readChangeFeed ou table_changes()."],
["dep","perf","Quelles valeurs peut prendre la colonne _change_type du Change Data Feed ?",["insert, update, delete","insert, update_preimage, update_postimage, delete","add, remove","new, old"],1,"Une mise à jour produit deux lignes : l'image avant (preimage) et l'image après (postimage)."],
["dep","ing","Un stream lit une table Delta qui subit des UPDATE et DELETE, et il échoue. Quelle option permet d'ignorer ces commits et de continuer ?",["ignoreDeletes","skipChangeCommits","readChangeFeed","mergeSchema"],1,"skipChangeCommits ignore les commits qui modifient des fichiers existants. Pour propager ces changements, il faut lire le Change Data Feed."],
["dep","dev","Avec AUTO CDC ... STORED AS SCD TYPE 2, quelles colonnes sont ajoutées pour l'historique ?",["valid_from et valid_to","__START_AT et __END_AT","_commit_version","effective_date"],1,"Elles délimitent la période de validité de chaque version. La version courante a __END_AT à NULL."],
["dep","dev","Pourquoi la clause SEQUENCE BY est-elle essentielle dans AUTO CDC ?",["Elle définit la clé primaire","Elle ordonne les événements pour gérer les arrivées dans le désordre","Elle partitionne la table","Elle filtre les doublons exacts"],1,"Sans ordre fiable, une mise à jour ancienne pourrait écraser une plus récente. SEQUENCE BY indique la colonne d'ordonnancement."],
["dep","perf","Que permet une lecture avec l'option readChangeFeed et startingVersion ?",["Revenir à une version","Lire uniquement les lignes modifiées depuis cette version","Supprimer les versions antérieures","Comparer deux schémas"],1,"C'est la base d'une propagation incrémentale silver vers gold sans relire toute la table."],
["dep","model","Les contraintes PRIMARY KEY et FOREIGN KEY de Unity Catalog sont-elles vérifiées à l'écriture ?",["Oui, toujours","Non, elles sont informatives (l'optimiseur peut s'en servir avec RELY)","Oui, mais seulement en SQL","Seulement sur les tables externes"],1,"PK et FK documentent le modèle et peuvent aider l'optimiseur. NOT NULL et CHECK, elles, sont vérifiées à l'écriture."],
["dep","manip","Que se passe-t-il à l'INSERT ?",["Seule la ligne valide est insérée","Toute la transaction échoue, aucune ligne n'est insérée","La ligne invalide est mise à NULL","Un simple warning est émis"],1,"Une violation de CHECK fait échouer toute l'écriture. Pour filtrer ligne à ligne, on utilise des expectations dans un pipeline.","ALTER TABLE orders ADD CONSTRAINT valid_qty CHECK (qty > 0);\nINSERT INTO orders VALUES (1, 'A', 5), (2, 'B', -1);"],
["dep","model","Quelle est la différence entre SHALLOW CLONE et DEEP CLONE ?",["Aucune","Shallow référence les fichiers de la source sans les copier, deep copie les données","Shallow copie tout, deep ne copie que le schéma","Deep clone est en lecture seule"],1,"Le shallow clone est rapide et peu coûteux, idéal pour tester. Le deep clone est autonome, utile pour l'archivage ou la migration."],
["dep","perf","Que sont les deletion vectors ?",["Des index de suppression de colonnes","Un mécanisme qui marque des lignes comme supprimées sans réécrire immédiatement les fichiers","Une sauvegarde des lignes supprimées","Un type de contrainte"],1,"DELETE, UPDATE et MERGE deviennent bien plus rapides. La purge physique se fait ensuite via OPTIMIZE ou REORG TABLE ... APPLY (PURGE)."],
["dep","model","Dans un modèle en étoile en couche gold, que contient la table de faits ?",["Les attributs descriptifs","Les mesures numériques et les clés vers les dimensions","Uniquement des clés techniques","Les logs d'ingestion"],1,"Les faits portent les mesures (montants, quantités) et les clés étrangères vers les dimensions descriptives."],
["dep","model","Comment générer une clé de substitution unique dans une table Delta ?",["Avec rand()","Avec une colonne GENERATED ALWAYS AS IDENTITY","Avec monotonically_increasing_id(), garanti contigu","Avec current_timestamp()"],1,"Les colonnes identity garantissent l'unicité. monotonically_increasing_id est unique dans un DataFrame, mais ni contigu ni stable entre exécutions."],
["dep","ing","Que permet Lakehouse Federation ?",["Copier des bases externes dans Delta","Interroger des bases externes (PostgreSQL, Snowflake...) via des catalogues étrangers, sans déplacer les données","Partager des tables avec l'extérieur","Fusionner plusieurs metastores"],1,"On crée une connexion puis un foreign catalog. Les requêtes sont poussées vers la source et gouvernées par Unity Catalog."],
["dep","ing","Dans Delta Sharing, quel est l'intérêt de partager une table WITH HISTORY ?",["Le destinataire peut écrire","Le destinataire peut faire du time travel et lire le Change Data Feed","Les données sont copiées chez le destinataire","Le partage devient public"],1,"Avec l'historique, le destinataire peut faire du time travel, lire le CDF et utiliser la table comme source de streaming."],
["dep","ing","Quels objets peut-on ajouter à un share Delta Sharing entre deux environnements Databricks ?",["Uniquement des tables","Notamment des tables, vues, volumes, modèles et notebooks","Uniquement des fichiers CSV","Des clusters"],1,"Le partage Databricks-to-Databricks couvre de nombreux actifs, dont tables, vues, volumes, modèles et notebooks."],
["dep","ing","Quel rôle joue le recipient dans Delta Sharing ?",["C'est le propriétaire des données","C'est l'entité qui reçoit l'accès en lecture à un ou plusieurs shares","C'est le cluster qui exécute le partage","C'est un format de fichier"],1,"Le fournisseur crée un share, puis un recipient pour le destinataire, et lui accorde l'accès au share."],
["dep","mon","Quelle table système consulter pour analyser la consommation DBU par job ?",["system.access.audit","system.billing.usage","system.compute.clusters","information_schema.tables"],1,"system.billing.usage détaille la consommation avec des métadonnées comme le job, le warehouse ou les tags."],
["dep","mon","Que fournit le monitoring de qualité de données (Lakehouse Monitoring) sur une table ?",["Des sauvegardes automatiques","Des tables de métriques de profil et de dérive, avec un dashboard","Du chiffrement","Un index de recherche"],1,"Un monitor (snapshot, time series ou inference) génère des métriques de profil et de drift, interrogeables en SQL et visibles dans un dashboard."],
["dep","mon","Dans la Spark UI, une forte valeur de Spill (Disk) sur un stage indique :",["Un problème réseau","Que les partitions ne tiennent pas en mémoire","Un cache efficace","Une lecture Delta optimale"],1,"Le spill survient quand les données d'une tâche dépassent la mémoire. Pistes : plus de partitions, des nœuds plus gros, réduire le skew."],
["dep","mon","Dans la Spark UI, une tâche dure 20 fois plus longtemps que les autres du même stage. Cause la plus probable ?",["Un data skew","Un cluster trop gros","Un problème de schéma","Une table trop petite"],0,"Une partition beaucoup plus grosse crée une tâche retardataire. AQE peut découper les partitions skewées lors des jointures."],
["dep","mon","Comment être alerté quand un indicateur calculé en SQL dépasse un seuil ?",["Avec une alerte Databricks SQL","Avec OPTIMIZE","Avec une cluster policy","Avec Delta Sharing"],0,"Une alerte évalue le résultat d'une requête selon un planning et notifie une destination (e-mail, Slack, Teams, webhook)."],
["dep","perf","Sur combien de colonnes Delta collecte-t-il par défaut des statistiques pour le data skipping ?",["Toutes","Les 32 premières","Les 10 premières","Aucune"],1,"delta.dataSkippingNumIndexedCols vaut 32 par défaut. On place les colonnes filtrées en début de schéma ou on utilise delta.dataSkippingStatsColumns."],
["dep","perf","Que fait l'Adaptive Query Execution (AQE) ?",["Elle compile le code Python","Elle ré-optimise le plan à l'exécution : fusion de partitions, changement de stratégie de jointure, gestion du skew","Elle met en cache toutes les tables","Elle ajoute des index"],1,"AQE s'appuie sur les statistiques réelles collectées entre les stages pour ajuster le plan."],
["dep","perf","Quelle est la valeur par défaut de spark.sql.autoBroadcastJoinThreshold ?",["1 Mo","10 Mo","1 Go","Pas de seuil"],1,"Sous 10 Mo estimés, la petite table est diffusée à tous les executors, ce qui évite un shuffle."],
["dep","perf","Qu'est-ce que la predictive optimization ?",["Un modèle de prévision des coûts","L'exécution automatique d'OPTIMIZE, VACUUM et ANALYZE sur les tables managées Unity Catalog","Un cache prédictif des requêtes","Un autoscaling plus agressif"],1,"Databricks identifie les tables qui en bénéficient et lance la maintenance automatiquement, sans planification manuelle."],
["dep","perf","Quand le partitionnement d'une table Delta est-il généralement déconseillé ?",["Pour les tables de moins d'1 To ou sur des colonnes à forte cardinalité","Pour les tables de logs","Pour les tables gold","Jamais"],0,"Trop de partitions créent de petits fichiers. Le liquid clustering est préférable dans la plupart des cas."],
["dep","perf","Quel type de code bénéficie le moins de Photon ?",["Les requêtes SQL","Les opérations DataFrame natives","Les UDF Python ligne à ligne","Les agrégations"],2,"Photon accélère les opérateurs SQL et DataFrame natifs. Les UDF Python s'exécutent en dehors de Photon."],
["dep","sec","Que fait cette instruction ?",["Elle crée une partition par région","Elle applique une fonction qui filtre les lignes visibles selon l'utilisateur","Elle supprime les régions inconnues","Elle crée un index"],1,"Les row filters UC appliquent une fonction SQL à chaque requête. Les column masks fonctionnent de façon similaire sur une colonne.","ALTER TABLE sales SET ROW FILTER region_filter ON (region);"],
["dep","sec","Quelle fonction utiliser dans une vue dynamique pour tester l'appartenance de l'utilisateur à un groupe ?",["current_group()","is_account_group_member('rh')","has_role('rh')","user_in('rh')"],1,"is_account_group_member vérifie les groupes au niveau du compte, ce qui est recommandé avec Unity Catalog."],
["dep","sec","Que se passe-t-il si on affiche dans un notebook une valeur obtenue par dbutils.secrets.get ?",["Elle s'affiche en clair","Elle est remplacée par [REDACTED]","Le notebook plante","Elle est encodée en base64"],1,"Databricks masque les secrets dans les sorties. Ce n'est pas une protection absolue : les droits sur le scope restent essentiels."],
["dep","gov","Quelle table système permet d'auditer qui a accédé à quelles ressources ?",["system.billing.usage","system.access.audit","system.query.history","system.compute.warehouses"],1,"system.access.audit enregistre les événements d'audit du compte et des workspaces."],
["dep","ops","Avec quelle identité exécuter les jobs de production ?",["Le compte de l'ingénieur qui a créé le job","Un service principal","Un compte admin partagé","L'utilisateur anonyme"],1,"Un service principal découple la production des comptes individuels et limite les droits au strict nécessaire."],
["dep","ops","Dans un bundle, que fait mode: development sur une target ?",["Il déploie en production","Il préfixe les ressources avec le nom de l'utilisateur et met les plannings en pause","Il désactive les tests","Il supprime les ressources existantes"],1,"Chaque développeur obtient ses propres copies isolées, sans déclencher les plannings."],
["dep","ops","Comment tester unitairement une transformation PySpark ?",["En l'exécutant en production","En l'isolant dans une fonction, puis en comparant le résultat avec assertDataFrameEqual (pyspark.testing) sous pytest","En regardant le résultat dans un dashboard","Ce n'est pas possible"],1,"Isoler la logique dans des fonctions pures permet de la tester sur de petits DataFrames construits dans le test."],
["dep","ops","Quelle commande vérifie la configuration d'un bundle avant déploiement ?",["databricks bundle validate","databricks bundle check","databricks jobs test","databricks bundle lint"],0,"validate vérifie la syntaxe et la résolution des variables. C'est une bonne première étape d'un pipeline CI."],

// Questions originales sur les nouveautés de l'exam guide d'octobre 2026
["dep", "manip", "Vous devez classer 2 millions d'avis clients en quatre thèmes fixes dans un pipeline SQL. Quelle approche est la plus directe ?", ["ai_classify(texte, ARRAY('livraison','qualité','prix','service'))", "Une UDF Python qui appelle une API externe ligne par ligne", "Un modèle entraîné à la main dans un notebook", "Une expression régulière par thème"], 0, "ai_classify range un texte dans des catégories fournies, directement en SQL et en batch. ai_query reste l'option générale pour appeler n'importe quel endpoint."],
["dep", "manip", "Que fait ai_query dans une requête SQL ?", ["Il interroge Genie en langage naturel", "Il appelle un endpoint de Model Serving pour chaque ligne et renvoie la réponse du modèle", "Il génère automatiquement une requête SQL", "Il entraîne un modèle sur la table"], 1, "ai_query envoie une requête à un endpoint (modèle de fondation ou modèle personnalisé) pour chaque ligne. L'option responseFormat permet d'obtenir une sortie structurée."],
["dep", "manip", "Que renvoie cette requête si le champ reading contient la chaîne « n/a » ?", ["Une erreur, la requête échoue", "NULL pour cette ligne", "La chaîne « n/a »", "0"], 1, "try_variant_get renvoie NULL quand la valeur ne peut pas être convertie dans le type demandé. variant_get, lui, ferait échouer la requête.", "SELECT try_variant_get(payload, '$.reading', 'DOUBLE') FROM bronze.events"],
["dep", "manip", "Pourquoi stocker des événements JSON hétérogènes en VARIANT plutôt qu'en STRING ?", ["VARIANT impose un schéma strict à l'écriture", "VARIANT stocke un format binaire optimisé : les requêtes sont beaucoup plus rapides, sans figer le schéma", "VARIANT compresse le texte en ZIP", "STRING ne peut pas contenir de JSON"], 1, "VARIANT évite de reparser le texte à chaque lecture tout en acceptant des structures qui changent. On le crée avec parse_json et on le lit avec : et ::, ou variant_get."],
["dep", "ing", "Deux enseignes veulent compter leurs clients communs sans qu'aucune ne voie la liste de clients de l'autre. Quelle fonctionnalité utiliser ?", ["Delta Sharing en partage ouvert", "Une Clean Room", "Lakehouse Federation", "Une vue dynamique partagée"], 1, "Dans une Clean Room, chaque partie apporte ses tables, seuls des notebooks approuvés s'exécutent, et seuls les résultats autorisés, comme un agrégat, sortent."],
["dep", "ing", "Un partenaire n'utilise pas Databricks mais doit lire une table gold depuis Power BI. Quel mode de partage choisir ?", ["Databricks-to-Databricks avec l'identifiant de son metastore", "Partage ouvert (Databricks-to-Open) avec un fichier d'identification ou une fédération OIDC", "Un export CSV quotidien", "Lakehouse Federation"], 1, "Le partage ouvert sert les destinataires hors Databricks : Power BI, pandas, Spark, Tableau, Snowflake. Le partage D2D demande un metastore Unity Catalog chez le destinataire."],
["dep", "model", "Toutes les équipes doivent calculer le panier moyen de la même façon dans leurs tableaux de bord et dans Genie. Quelle solution ?", ["Une materialized view par tableau de bord", "Une metric view Unity Catalog qui définit la mesure une seule fois", "Un commentaire sur la table", "Une vue temporaire"], 1, "Une metric view définit dimensions et mesures de façon gouvernée et réutilisable. Un ratio comme le panier moyen est recalculé correctement selon les dimensions demandées."],
["dep", "model", "Comment interroge-t-on une mesure définie dans une metric view ?", ["SELECT SUM(mesure) FROM vue", "SELECT dimension, MEASURE(`Chiffre d'affaires`) FROM vue GROUP BY ALL", "SELECT * FROM vue WHERE measure = 'CA'", "CALL vue.compute('CA')"], 1, "Les mesures d'une metric view s'appellent avec la fonction MEASURE(), regroupées par les dimensions choisies."],
["dep", "dev", "Un job serverless doit coûter le moins possible et peut démarrer avec quelques minutes de retard. Quel réglage choisir ?", ["Mode performance optimized", "Mode standard", "Un cluster all-purpose", "L'option high memory"], 1, "Le mode standard consomme moins de DBU au prix d'un démarrage plus long, de l'ordre de 4 à 6 minutes. Le mode performance optimized sert les traitements urgents."],
["dep", "sec", "Vous devez pouvoir joindre deux tables sur l'email des clients sans jamais exposer l'email en clair. Quelle méthode ?", ["Remplacer l'email par NULL", "Un hachage salé, toujours identique pour un même email", "Une généralisation au domaine de l'email", "Un chiffrement différent à chaque ligne"], 1, "Un hachage déterministe avec un sel secret donne la même valeur pour le même email, ce qui permet les jointures, sans pouvoir retrouver l'email. C'est une pseudonymisation : la donnée reste personnelle au sens du RGPD."],

// ===== DATA ANALYST ASSOCIATE =====
["daa","plat","Quel type de SQL warehouse démarre le plus vite, sans gestion de capacité ?",["Classic","Pro","Serverless","Single node"],2,"Le serverless démarre en quelques secondes, s'arrête automatiquement et intègre les dernières optimisations."],
["daa","plat","De nombreux analystes voient leurs requêtes mises en file d'attente sur le même warehouse. Que faire ?",["Augmenter la taille (T-shirt) du cluster","Augmenter le nombre maximum de clusters (scaling)","Réduire l'auto stop","Passer en classic"],1,"La taille accélère une requête lourde. Le nombre de clusters absorbe la concurrence."],
["daa","plat","Une requête unique très lourde est lente. Quel réglage aide le plus ?",["Augmenter la taille du warehouse","Augmenter le nombre de clusters","Activer les alertes","Ajouter un filtre de dashboard"],0,"Une requête s'exécute sur un seul cluster : plus il est gros, plus elle dispose de ressources."],
["daa","plat","À quoi sert le paramètre auto stop d'un SQL warehouse ?",["Arrêter les requêtes longues","Arrêter le warehouse après une période d'inactivité pour réduire les coûts","Limiter le nombre d'utilisateurs","Vider le cache"],1,"Arrêté, le warehouse ne consomme plus de DBU. Il redémarre automatiquement à la requête suivante."],
["daa","ana","Une requête relancée sans changement des données revient instantanément. Pourquoi ?",["Le warehouse est plus gros","Le cache des résultats de requête a été utilisé","La table est partitionnée","La requête a été annulée"],1,"Databricks SQL met en cache les résultats. Le cache est invalidé si les tables sous-jacentes changent."],
["daa","ana","Quel outil permet d'identifier l'étape la plus coûteuse d'une requête lente ?",["Le query profile","Catalog Explorer","Les alertes","Genie"],0,"Depuis l'historique des requêtes, le query profile montre les opérateurs, le temps passé, les lignes et les octets lus."],
["daa","plat","Que garantit le format Delta Lake aux analystes ?",["Des transactions ACID et des lectures cohérentes","Un stockage propriétaire fermé","L'absence de schéma","Des données uniquement en mémoire"],0,"Delta apporte ACID, historique et time travel sur un format ouvert basé sur Parquet."],
["daa","imp","Comment créer rapidement une table à partir d'un fichier CSV local, sans code ?",["Avec l'interface d'ajout de données (upload de fichier)","Avec Delta Sharing","Avec une alerte","Ce n'est pas possible"],0,"L'interface d'upload permet d'envoyer un fichier, d'ajuster le schéma et de créer une table Delta managée."],
["daa","data","Quelle commande affiche l'emplacement, le nombre de fichiers et la taille d'une table Delta ?",["DESCRIBE DETAIL","SHOW TABLES","DESCRIBE HISTORY","SHOW GRANTS"],0,"DESCRIBE DETAIL renvoie les métadonnées physiques : format, location, numFiles, sizeInBytes."],
["daa","data","Où consulter la lignée, l'historique et les permissions d'une table depuis l'interface ?",["Catalog Explorer","Le query editor","Les paramètres du warehouse","Le Marketplace"],0,"Catalog Explorer regroupe aperçu, détails, historique, lignée, permissions et insights d'une table."],
["daa","data","Quelle est la portée d'une vue temporaire dans Databricks SQL ?",["Tout le metastore","La session en cours uniquement","Le catalogue courant","Tous les warehouses"],1,"Elle disparaît à la fin de la session et n'est pas visible des autres utilisateurs."],
["daa","data","Quel est l'avantage d'une vue matérialisée par rapport à une vue classique ?",["Elle stocke des résultats précalculés et se rafraîchit, ce qui accélère les lectures","Elle est toujours plus récente","Elle ne coûte rien","Elle permet d'écrire dans la table source"],0,"Une vue classique recalcule à chaque requête. La vue matérialisée stocke le résultat et se rafraîchit, souvent de façon incrémentale."],
["daa","data","Dans l'architecture médaillon, quelle couche les dashboards BI doivent-ils interroger en priorité ?",["Bronze","Silver","Gold","Landing"],2,"Gold contient des tables agrégées et orientées métier, optimisées pour la consommation."],
["daa","data","Comment lire une table telle qu'elle était hier à 8h ?",["SELECT * FROM t TIMESTAMP AS OF '2026-10-28 08:00'","SELECT * FROM t WHERE ts = yesterday","RESTORE t","SELECT * FROM t@yesterday"],0,"TIMESTAMP AS OF lit la version valide à cet instant, dans la limite de la rétention."],
["daa","sql","Que renvoie cette requête ?",["Toutes les commandes triées","La commande la plus récente de chaque client","La première commande historique de chaque client","Une erreur, QUALIFY n'existe pas"],1,"QUALIFY filtre sur le résultat d'une fonction de fenêtre, sans sous-requête. Avec ORDER BY DESC, la plus récente est au rang 1.","SELECT * FROM orders\nQUALIFY ROW_NUMBER() OVER (\n  PARTITION BY customer_id ORDER BY order_date DESC\n) = 1"],
["daa","sql","Quelle jointure conserve toutes les lignes de la table de gauche, même sans correspondance ?",["INNER JOIN","LEFT JOIN","CROSS JOIN","LEFT SEMI JOIN"],1,"Les colonnes de droite valent NULL quand il n'y a pas de correspondance."],
["daa","sql","Quelle est la différence entre UNION et UNION ALL ?",["Aucune","UNION supprime les doublons, UNION ALL les garde","UNION ALL supprime les doublons","UNION ne fonctionne qu'avec deux colonnes"],1,"UNION ALL est plus rapide car il évite la déduplication."],
["daa","sql","Quelle clause filtre sur le résultat d'une agrégation ?",["WHERE","HAVING","QUALIFY","FILTER BY"],1,"WHERE filtre avant l'agrégation, HAVING après le GROUP BY."],
["daa","sql","Que produit GROUP BY ROLLUP (pays, ville) ?",["Seulement le détail pays et ville","Le détail, les sous-totaux par pays et le total général","Toutes les combinaisons possibles","Un tableau croisé"],1,"ROLLUP crée une hiérarchie de sous-totaux. CUBE produirait toutes les combinaisons, y compris par ville seule."],
["daa","sql","Comment remplacer les NULL de la colonne remise par 0 ?",["COALESCE(remise, 0)","NULLIF(remise, 0)","IF(remise)","ZEROIFNULL(remise, 1)"],0,"COALESCE renvoie la première valeur non nulle de sa liste. NULLIF fait l'inverse : il renvoie NULL si les deux valeurs sont égales."],
["daa","sql","Comment regrouper des ventes par mois à partir d'un timestamp ?",["date_trunc('MONTH', ts)","month_of(ts)","round(ts, 'M')","cast(ts AS month)"],0,"date_trunc ramène le timestamp au premier jour du mois. month(ts) ne donnerait que le numéro du mois, sans l'année."],
["daa","sql","Comment déclarer un paramètre nommé dans une requête Databricks SQL ?",["WHERE region = :region","WHERE region = $region","WHERE region = @region","WHERE region = ?region"],0,"La syntaxe :nom définit un marqueur de paramètre nommé, utilisable dans le query editor et les dashboards."],
["daa","sql","Quelle clause transforme des lignes en colonnes, par exemple un trimestre par colonne ?",["PIVOT","EXPLODE","UNPIVOT","ROLLUP"],0,"PIVOT agrège une valeur pour chaque modalité d'une colonne. UNPIVOT fait l'opération inverse."],
["daa","sql","Que renvoie SUM(montant) OVER (ORDER BY date_vente) ?",["Le total général sur chaque ligne","Un cumul progressif dans l'ordre des dates","Une moyenne mobile","Une erreur"],1,"Avec ORDER BY, la fenêtre par défaut va du début jusqu'à la ligne courante, d'où un cumul."],
["daa","viz","Quelle visualisation choisir pour montrer l'évolution d'un CA mensuel ?",["Un camembert","Une courbe (line chart)","Un counter","Une table pivot"],1,"La courbe met en évidence la tendance dans le temps. Le counter convient à un KPI unique."],
["daa","viz","Un dashboard AI/BI est publié avec les identifiants intégrés (embed credentials). Quelles données voient les lecteurs ?",["Celles autorisées par leurs propres droits","Celles accessibles à la personne qui a publié","Aucune donnée","Toutes les données du metastore"],1,"Avec embed credentials, les requêtes tournent avec les droits du publieur. Sans, chaque lecteur utilise ses propres droits."],
["daa","viz","Comment envoyer automatiquement un instantané d'un dashboard par e-mail chaque lundi ?",["Avec une planification et des abonnés sur le dashboard","Avec Delta Sharing","Avec un job compute","Ce n'est pas possible"],0,"Un planning rafraîchit le dashboard et envoie un instantané aux abonnés."],
["daa","viz","Un filtre doit s'appliquer à plusieurs widgets basés sur des datasets différents. Comment faire ?",["Créer un filtre et le lier aux champs correspondants de chaque dataset","Dupliquer le dashboard","Ce n'est pas possible","Créer une vue par widget"],0,"Un filtre de dashboard peut cibler des champs de plusieurs datasets à la fois."],
["daa","viz","Comment être prévenu quand le nombre de commandes en erreur dépasse 100 ?",["Avec une alerte Databricks SQL sur une requête","Avec un counter rouge","Avec Genie","Avec OPTIMIZE"],0,"L'alerte exécute la requête selon un planning, compare au seuil et notifie."],
["daa","viz","Quelle visualisation pour un KPI unique comparé à un objectif ?",["Counter","Nuage de points","Heatmap","Sankey"],0,"Le counter affiche une valeur principale, éventuellement comparée à une cible."],
["daa","genie","Qu'est-ce qu'un Genie space ?",["Un espace de stockage de fichiers","Une interface en langage naturel pour interroger un ensemble de tables","Un type de cluster","Un outil d'ETL"],1,"Les utilisateurs posent leurs questions en langage courant et Genie génère le SQL sur les tables configurées."],
["daa","genie","Quelle action améliore le plus la précision d'un Genie space ?",["Ajouter beaucoup de tables sans rapport","Ajouter des instructions, des exemples de requêtes SQL et des descriptions de tables et colonnes","Augmenter la taille du warehouse","Supprimer les métadonnées"],1,"Le contexte métier (instructions, exemples, descriptions) guide la génération SQL."],
["daa","genie","Que signifie une réponse Genie marquée comme trusted ?",["Elle a été vérifiée par un administrateur réseau","Elle s'appuie sur un actif de confiance (requête ou fonction SQL validée) défini par l'auteur du space","Elle est certifiée par Databricks","Elle est mise en cache"],1,"Les trusted assets sont des requêtes paramétrées ou des fonctions validées. Les réponses qui les utilisent sont signalées comme fiables."],
["daa","genie","Quelle fonction SQL appelle un endpoint de modèle d'IA sur chaque ligne ?",["ai_query()","model_call()","llm()","predict_sql()"],0,"ai_query appelle un endpoint de modèle. Des fonctions dédiées existent aussi : ai_classify, ai_summarize, ai_extract, ai_sentiment..."],
["daa","genie","Pour qualifier des avis clients en positif, neutre ou négatif en SQL, quelle fonction est la plus directe ?",["ai_sentiment()","sentiment_of()","classify()","ai_mask()"],0,"ai_sentiment renvoie le sentiment d'un texte. ai_classify permet de choisir ses propres catégories."],
["daa","sec","Quelle commande affiche les privilèges accordés sur une table ?",["SHOW GRANTS ON TABLE sales.orders","DESCRIBE PERMISSIONS sales.orders","SHOW ACCESS sales.orders","LIST GRANTS sales.orders"],0,"SHOW GRANTS liste les principaux et leurs privilèges sur l'objet."],
["daa","sec","Un analyste voit la table dans le catalogue mais ne peut pas la requêter. Quel privilège manque probablement ?",["SELECT","MODIFY","CREATE TABLE","BROWSE"],0,"BROWSE permet de voir les métadonnées. Lire les données exige SELECT, avec USE CATALOG et USE SCHEMA."],
["daa","sec","Comment masquer une colonne e-mail pour tous sauf le groupe RH ?",["Avec un column mask basé sur une fonction qui teste l'appartenance au groupe","Avec un filtre de dashboard","En renommant la colonne","Avec un ZORDER"],0,"Le column mask applique une fonction à chaque lecture de la colonne, qui peut utiliser is_account_group_member."],
["daa","sec","Qui peut accorder des privilèges sur une table par défaut ?",["N'importe quel lecteur","Le propriétaire de l'objet, ainsi que les admins du catalogue ou du metastore","Seulement Databricks","Personne"],1,"Le owner d'un objet contrôle ses droits. La propriété peut être transférée, idéalement à un groupe."],
["daa","sec","Pourquoi accorder les droits à des groupes plutôt qu'à des utilisateurs ?",["C'est obligatoire","Pour simplifier la gestion : arrivées et départs se gèrent dans les groupes","Pour réduire les coûts","Pour accélérer les requêtes"],1,"Les droits par groupe restent stables quand l'équipe change."],
// Questions originales complémentaires
["daa", "genie", "Comment mesurer objectivement la précision d'un espace Genie avant et après une modification des instructions ?", ["En comptant les questions posées", "Avec des benchmarks : des questions de référence et leur SQL attendu, relancés après chaque changement", "En augmentant la taille du warehouse", "En demandant aux utilisateurs de noter chaque réponse"], 1, "Les benchmarks comparent les réponses de Genie aux réponses attendues. On les relance après chaque modification pour vérifier que la précision progresse."],
["daa", "genie", "Les utilisateurs d'un espace Genie se plaignent que le « CA » est calculé toutes taxes comprises au lieu de hors taxes. Que faire en priorité ?", ["Changer de SQL warehouse", "Ajouter une instruction ou un trusted asset qui définit le calcul du CA hors taxes", "Supprimer des tables de l'espace", "Recréer l'espace"], 1, "Les instructions et les trusted assets portent les définitions métier. Un trusted asset garantit un calcul validé, et la réponse est signalée comme fiable."],
["daa", "genie", "Où voir les questions posées par les utilisateurs d'un espace Genie et leurs retours ?", ["Dans l'onglet Monitoring de l'espace", "Dans system.billing.usage", "Dans Catalog Explorer", "Dans l'historique du warehouse uniquement"], 0, "L'onglet Monitoring liste les questions, les réponses et les retours (pouces, demandes de revue), point de départ des améliorations."],
["daa", "genie", "Un utilisateur ouvre un espace Genie partagé avec lui mais obtient une erreur d'accès aux données. Quelle est la cause la plus probable ?", ["Il lui manque le droit SELECT sur les tables de l'espace", "L'espace n'a pas de questions exemples", "Le warehouse est trop petit", "Genie ne fonctionne qu'en anglais"], 0, "Partager l'espace ne donne pas accès aux données : l'utilisateur doit aussi pouvoir lire les tables (USE CATALOG, USE SCHEMA, SELECT) et utiliser le warehouse."],
["daa", "model", "Dans quelle couche de l'architecture médaillon place-t-on typiquement un schéma en étoile destiné aux tableaux de bord ?", ["Bronze", "Silver", "Gold", "Landing"], 2, "Le gold porte les modèles de consommation : schémas en étoile, agrégats et vues matérialisées. Un data vault ou un modèle normalisé se place plutôt en silver."],
["daa", "model", "Quel modèle sépare hubs, links et satellites pour intégrer de nombreuses sources en conservant tout l'historique ?", ["Schéma en étoile", "Schéma en flocon", "Data vault", "Table plate dénormalisée"], 2, "Le data vault distingue les clés métier (hubs), les relations (links) et les attributs historisés (satellites). On le place en silver, avec une couche de présentation en gold."],
["daa", "model", "Quelle différence entre un schéma en étoile et un schéma en flocon ?", ["Le flocon n'a pas de table de faits", "Dans le flocon, les dimensions sont normalisées en plusieurs tables, ce qui ajoute des jointures", "L'étoile ne permet pas d'agréger", "Le flocon est réservé au streaming"], 1, "L'étoile garde des dimensions dénormalisées, simples et rapides. Le flocon les découpe (produit, catégorie, famille), avec moins de redondance mais plus de jointures."],
["daa", "plat", "Une équipe veut utiliser un jeu de données météo commercial sans écrire de pipeline d'ingestion. Que proposer ?", ["Le Databricks Marketplace", "Un export CSV quotidien", "Lakehouse Federation", "Un notebook qui scrape un site web"], 0, "Le Marketplace donne accès à des jeux de données, modèles et notebooks de fournisseurs. Les données arrivent via Delta Sharing, sous forme de catalogue en lecture seule, sans copie."],
["daa", "viz", "Un tableau de bord doit être lu par des managers qui n'ont aucun droit sur les tables sources. Comment le publier ?", ["Sans identifiants intégrés", "Avec identifiants intégrés (embed credentials)", "En leur donnant ALL PRIVILEGES", "En exportant un PDF chaque jour"], 1, "Avec les identifiants intégrés, les requêtes s'exécutent avec les droits de l'auteur de la publication. Sans eux, chaque lecteur ne voit que ce qu'il a le droit de lire."],
["daa", "ana", "Une grosse table de ventes est presque toujours filtrée par région et par date. Quelle optimisation recommander ?", ["Partitionner par identifiant client", "Liquid Clustering sur region et date_vente", "Désactiver Photon", "Convertir la table en CSV"], 1, "Le Liquid Clustering range les données selon les colonnes filtrées, ce qui permet de lire beaucoup moins de fichiers. Les clés se changent plus tard sans tout réécrire."]
];

const COURSE={daa:[{"u": "plat", "t": "Plateforme Databricks", "w": 11, "lessons": [{"id": "daa-plat-1", "t": "Les briques de la plateforme", "md": "Source : [Databricks Data Intelligence Platform](https://docs.databricks.com/aws/en/introduction/).\n\n| Brique | Rôle pour un analyste |\n| --- | --- |\n| **Delta Lake** | Format des tables : transactions fiables, historique, time travel |\n| **Unity Catalog** | Catalogue unique : droits, lignage, recherche, tables certifiées |\n| **Databricks SQL** | Éditeur SQL, SQL warehouses, tableaux de bord, alertes |\n| **Data Intelligence Engine** | L'IA qui comprend vos données et alimente l'assistant, Genie et la recherche |\n| **Lakeflow Jobs** et pipelines déclaratifs (ex-DLT) | Orchestration et préparation des données par les data engineers |\n| **Mosaic AI** | Création et service de modèles et d'agents d'IA |\n| **Marketplace** | Jeux de données, modèles et notebooks publiés par des fournisseurs, gratuits ou payants |\n\nLe **Marketplace** s'appuie sur Delta Sharing : on « obtient » un jeu de données, qui apparaît comme un catalogue en lecture seule, sans copie.\n\n### Pièges d'examen\n\n- Exécuter des requêtes SQL et des tableaux de bord : Databricks SQL sur un SQL warehouse.\n- Trouver des données publiques ou d'un partenaire prêtes à l'emploi : Marketplace.\n- Gouvernance et lignage : Unity Catalog.", "kw": ["delta lake", "unity catalog", "marketplace", "mosaic", "databricks sql", "platform", "lakehouse"]}, {"id": "daa-plat-2", "t": "Catalog Explorer : tables, vues, certification et lignage", "md": "Source : [Catalog Explorer](https://docs.databricks.com/aws/en/catalog-explorer/).\n\nLes objets sont rangés en **catalogue › schéma › table, vue ou volume**. Dans Catalog Explorer, chaque table montre son schéma, un aperçu, ses détails, son historique, ses droits, son lignage et des statistiques d'usage.\n\n| Objet | À retenir |\n| --- | --- |\n| Table **managed** | Unity Catalog gère les fichiers : un `DROP` supprime aussi les données |\n| Table **external** | Les fichiers restent à leur emplacement : un `DROP` ne supprime que la définition |\n| **Vue** | Requête enregistrée, rien n'est stocké, toujours à jour |\n| **Vue matérialisée** | Résultat précalculé et rafraîchi |\n| **Vue dynamique** | Vue qui filtre ou masque selon l'utilisateur (`is_account_group_member`) |\n| Table **certifiée** | Marquée comme source de confiance par son propriétaire, via un tag système. Une table peut aussi être marquée **dépréciée** |\n\nLe **lignage** montre d'où viennent les données d'une table et ce qui en dépend (tables, notebooks, tableaux de bord), jusqu'à la colonne.\n\n### Pièges d'examen\n\n- Savoir quelles tables alimentent un tableau de bord : onglet Lignage.\n- Repérer la bonne table parmi plusieurs copies : la table certifiée.\n- Une vue ne stocke rien : elle relance sa requête à chaque lecture.", "kw": ["catalog explorer", "lineage", "certified", "managed", "external", "view", "schema"]}]}, {"u": "data", "t": "Gestion des données", "w": 8, "lessons": [{"id": "daa-data-1", "t": "Découvrir, taguer et nettoyer les données", "md": "Source : [tags](https://docs.databricks.com/aws/en/database-objects/tags).\n\n### Découvrir et documenter\n\n- La **recherche** de l'espace de travail trouve les tables par nom, commentaire ou tag. Les tables certifiées remontent en priorité.\n- Les **tags** (paires clé-valeur) se posent dans Catalog Explorer ou en SQL : `ALTER TABLE ventes SET TAGS ('domaine' = 'commerce')`.\n- Les **commentaires** décrivent tables et colonnes. L'assistant peut les générer automatiquement.\n\n### Nettoyer en SQL\n\n```sql\nCREATE OR REPLACE TABLE main.analyse.ventes_propres AS\nSELECT DISTINCT                                   -- supprime les doublons exacts\n  id,\n  COALESCE(region, 'Inconnue')       AS region,   -- remplace les NULL\n  TRY_CAST(montant AS DECIMAL(10,2)) AS montant,  -- NULL si la valeur n'est pas un nombre\n  TRIM(LOWER(email))                 AS email\nFROM main.brut.ventes\nWHERE id IS NOT NULL AND montant >= 0;            -- retire les lignes invalides\n```\n\n| Problème | Fonction |\n| --- | --- |\n| Valeurs manquantes | `COALESCE`, `IFNULL`, ou filtre `IS NOT NULL` |\n| Compter les manquants | `count_if(col IS NULL)` ou `count(*) - count(col)` |\n| Mauvais type | `TRY_CAST` |\n| Espaces, casse | `TRIM`, `LOWER`, `UPPER` |\n| Doublons | `DISTINCT`, ou `ROW_NUMBER()` avec `QUALIFY` pour garder la plus récente |\n\n### Pièges d'examen\n\n- `col = NULL` ne renvoie jamais rien : on écrit `col IS NULL`.\n- `count(col)` ignore les NULL, `count(*)` compte toutes les lignes.\n- Supprimer des lignes invalides d'une table Delta : `DELETE FROM t WHERE ...`.", "kw": ["tag", "null", "clean", "duplicate", "coalesce", "certified", "discover", "missing"]}]}, {"u": "imp", "t": "Import des données", "w": 5, "lessons": [{"id": "daa-imp-1", "t": "Faire entrer les données", "md": "Source : [ingestion](https://docs.databricks.com/aws/en/ingestion/overview).\n\n| Source | Moyen | Qui le met en place |\n| --- | --- | --- |\n| Fichier sur votre poste (CSV, JSON, Excel…) | Interface **Add data / Upload** : crée une table managée | L'analyste |\n| Fichiers dans S3, ADLS ou GCS | `read_files`, `COPY INTO`, ou **Auto Loader** pour l'arrivée continue de fichiers | L'analyste en SQL, ou un data engineer |\n| Données d'une autre organisation | **Delta Sharing** : la table apparaît sans copie | Le fournisseur partage, vous lisez |\n| Jeux de données publics ou commerciaux | **Marketplace** | L'analyste |\n| Applications SaaS et bases | Connecteurs Lakeflow Connect, ou appels d'**API** dans un notebook | Un data engineer |\n\n```sql\nCREATE TABLE main.analyse.tarifs AS\nSELECT * FROM read_files('/Volumes/main/analyse/depot/tarifs.csv', format => 'csv', header => true);\n```\n\nÀ l'**upload**, on choisit le catalogue et le schéma, on renomme les colonnes et on ajuste leurs types. Si la détection automatique des types est désactivée, toutes les colonnes sont créées en STRING.\n\n### Pièges d'examen\n\n- Un petit CSV fourni par un métier : upload par l'interface.\n- Des fichiers qui arrivent en continu dans un stockage cloud : Auto Loader.\n- Accéder aux données d'un partenaire sans copie : Delta Sharing.", "kw": ["upload", "auto loader", "delta sharing", "marketplace", "s3", "api", "read_files", "import", "csv"]}]}, {"u": "sql", "t": "Requêtes Databricks SQL", "w": 20, "lessons": [{"id": "daa-sql-1", "t": "SQL warehouses, assistant et fédération", "md": "Source : [SQL warehouses](https://docs.databricks.com/aws/en/compute/sql-warehouse/).\n\nUn **SQL warehouse** est le calcul qui exécute les requêtes de l'éditeur SQL, des tableaux de bord, des alertes et de Genie.\n\n| Type | Démarrage | Usage |\n| --- | --- | --- |\n| **Serverless** | Quelques secondes | Recommandé : BI et analyses ad hoc |\n| Pro | Plusieurs minutes | Besoins réseau particuliers |\n| Classic | Plusieurs minutes | Fonctions de base |\n\n- **Taille** (2X-Small à 4X-Large) : accélère une requête lourde.\n- **Scaling** (nombre de clusters) : absorbe de nombreux utilisateurs simultanés.\n- **Auto stop** : arrête le warehouse inactif pour ne pas payer.\n\nL'**assistant Databricks** écrit une requête à partir d'une demande en français, l'explique, ou corrige une erreur (bouton *Diagnose error*), dans l'éditeur SQL comme dans un notebook.\n\nLa **fédération** (Lakehouse Federation) permet de joindre une table Delta et une table d'une base externe dans la même requête :\n\n```sql\nSELECT c.nom, SUM(v.montant)\nFROM main.gold.ventes v\nJOIN crm_postgres.public.clients c ON v.client_id = c.id   -- catalogue fédéré\nGROUP BY c.nom;\n```\n\n### Pièges d'examen\n\n- Requêtes en file d'attente avec beaucoup d'utilisateurs : augmenter le nombre maximum de clusters.\n- Une requête unique trop lente : augmenter la taille.\n- Démarrage trop lent : serverless.", "kw": ["warehouse", "assistant", "federat", "serverless", "scaling", "auto stop"]}, {"id": "daa-sql-2", "t": "Agréger, joindre, trier", "md": "### Agréger\n\n```sql\nSELECT region,\n  count(*)                       AS nb_ventes,\n  count(DISTINCT client_id)      AS nb_clients,\n  approx_count_distinct(client_id) AS nb_clients_approx,   -- rapide sur de gros volumes\n  avg(montant)                   AS panier_moyen\nFROM main.gold.ventes\nWHERE annee = 2026\nGROUP BY region\nHAVING count(*) > 100            -- filtre après agrégation\nORDER BY nb_ventes DESC\nLIMIT 10;\n```\n\n- `WHERE` filtre **avant** l'agrégation, `HAVING` **après**.\n- `ROLLUP` et `CUBE` ajoutent des sous-totaux. Pour des statistiques descriptives rapides : `dbutils.data.summarize(df)` dans un notebook, ou les statistiques de colonnes de l'aperçu.\n\n### Joindre et combiner\n\n| Opération | Résultat |\n| --- | --- |\n| `INNER JOIN` | Seulement les lignes présentes des deux côtés |\n| `LEFT JOIN` | Toutes les lignes de gauche, NULL à droite si pas de correspondance |\n| `RIGHT JOIN` | L'inverse |\n| `FULL JOIN` | Toutes les lignes des deux côtés |\n| `LEFT ANTI JOIN` | Les lignes de gauche **sans** correspondance |\n| `CROSS JOIN` | Toutes les combinaisons |\n| `UNION` / `UNION ALL` | Empile deux résultats, `UNION` supprime les doublons, `UNION ALL` les garde |\n\nUne jointure sur plusieurs clés s'écrit `ON a.id = b.id AND a.date = b.date`.\n\n### Pièges d'examen\n\n- Clients sans commande : `LEFT JOIN` puis `WHERE commande.id IS NULL`, ou `LEFT ANTI JOIN`.\n- Fusionner deux mois sans doublons : `UNION`. Plus rapide et garder tout : `UNION ALL`.\n- Filtrer sur un agrégat : `HAVING`.", "kw": ["join", "union", "count", "approx", "avg", "group by", "having", "order by"]}, {"id": "daa-sql-3", "t": "Tables, vues et historique", "md": "### Créer des tables et des vues\n\n```sql\n-- table managée qui unifie trois sources\nCREATE TABLE main.analyse.ventes_unifiees AS\nSELECT * FROM read_files('/Volumes/main/depot/ventes_2024/', format => 'csv', header => true)\nUNION ALL SELECT * FROM parquet.`/Volumes/main/depot/ventes_2025/`\nUNION ALL SELECT * FROM main.gold.ventes_2026;\n\n-- table externe : les fichiers restent à leur emplacement\nCREATE TABLE main.analyse.archives LOCATION 's3://bucket/archives/';\n\n-- vue matérialisée : résultat précalculé, rafraîchi chaque jour\nCREATE MATERIALIZED VIEW main.analyse.ca_mensuel SCHEDULE EVERY 1 DAY AS\nSELECT date_trunc('MONTH', date_vente) AS mois, SUM(montant) AS ca FROM main.gold.ventes GROUP BY 1;\n```\n\n| Objet | Quand l'utiliser |\n| --- | --- |\n| Vue | Simplifier une requête, toujours à jour, rien de stocké |\n| Vue dynamique | Montrer des lignes ou colonnes différentes selon le groupe de l'utilisateur |\n| Vue matérialisée | Agrégat coûteux lu souvent par des tableaux de bord |\n| Streaming table | Ingestion continue de nouvelles données, chaque ligne traitée une fois |\n\n### Time travel\n\n```sql\nDESCRIBE HISTORY main.gold.ventes;                         -- versions, auteurs, opérations\nSELECT * FROM main.gold.ventes VERSION AS OF 12;\nSELECT * FROM main.gold.ventes TIMESTAMP AS OF '2026-10-01';\n```\n\n### Pièges d'examen\n\n- Agrégat lent dans un tableau de bord : vue matérialisée.\n- Masquer des colonnes selon le groupe : vue dynamique.\n- Retrouver les chiffres d'hier avant une correction : time travel.", "kw": ["materialized", "view", "streaming table", "time travel", "version as of", "create table", "external"]}]}, {"u": "ana", "t": "Analyse des requêtes", "w": 15, "lessons": [{"id": "daa-ana-1", "t": "Photon, query profile et cache", "md": "Sources : [Photon](https://docs.databricks.com/aws/en/compute/photon), [query profile](https://docs.databricks.com/aws/en/sql/user/queries/query-profile).\n\n- **Photon** est le moteur vectorisé de Databricks, actif sur les SQL warehouses. Il accélère les requêtes SQL et DataFrame sur les gros volumes (scans, jointures, agrégations) sans changer le code. Il n'accélère pas les UDF Python.\n- **Query history** liste les requêtes passées avec leur durée, leur auteur et leur statut. **Query insights** signale les requêtes à optimiser.\n- Le **query profile** montre le plan exécuté, l'étape la plus coûteuse, les lignes et octets lus, et si les fichiers ont été écartés grâce aux statistiques.\n- Le **cache des résultats** renvoie instantanément le résultat d'une requête identique si les tables n'ont pas changé. Le **cache disque** garde les fichiers lus sur les SSD du warehouse.\n- Le **Liquid Clustering** (`ALTER TABLE ventes CLUSTER BY (region, date_vente)`) accélère les requêtes qui filtrent souvent sur ces colonnes, en lisant moins de fichiers.\n\n### Pièges d'examen\n\n- Une requête relancée sans changement de données revient instantanément : cache des résultats.\n- Trouver l'étape la plus lente : query profile.\n- Une grosse table toujours filtrée par région et date : Liquid Clustering sur ces colonnes.", "kw": ["photon", "query profile", "query history", "insight", "cache", "liquid", "slow"]}, {"id": "daa-ana-2", "t": "Auditer et corriger une requête", "md": "### Auditer avec Delta\n\n```sql\nDESCRIBE HISTORY main.gold.ventes;           -- qui a modifié quoi, quand\n\n-- comparer le chiffre d'affaires avant et après la dernière mise à jour\nSELECT\n  (SELECT SUM(montant) FROM main.gold.ventes) AS ca_actuel,\n  (SELECT SUM(montant) FROM main.gold.ventes VERSION AS OF 41) AS ca_v41;\n```\n\n### Corriger une requête qui donne un mauvais résultat\n\n| Symptôme | Cause fréquente | Correction |\n| --- | --- | --- |\n| Montants gonflés après une jointure | Clé de jointure non unique, lignes dupliquées | Agréger avant de joindre, ou joindre sur la bonne clé |\n| Lignes disparues | `INNER JOIN` au lieu de `LEFT JOIN`, ou filtre sur la table de droite dans le `WHERE` | `LEFT JOIN`, filtre dans le `ON` |\n| Moyenne fausse | NULL ignorés ou comptés comme 0 | `avg` ignore les NULL, `COALESCE` si 0 est voulu |\n| Erreur sur un agrégat | Colonne non agrégée absente du `GROUP BY` | Ajouter la colonne au `GROUP BY` |\n| Filtre sur un agrégat refusé | `WHERE` sur `SUM(...)` | `HAVING` |\n\n### Pièges d'examen\n\n- Un `WHERE` sur une colonne de la table de droite transforme un `LEFT JOIN` en `INNER JOIN`.\n- Comparer une tendance avant et après une correction : time travel.", "kw": ["describe history", "history", "audit", "fix", "error", "result"]}]}, {"u": "viz", "t": "Dashboards & visualisations", "w": 16, "lessons": [{"id": "daa-viz-1", "t": "Tableaux de bord AI/BI", "md": "Source : [tableaux de bord AI/BI](https://docs.databricks.com/aws/en/dashboards/).\n\nUn tableau de bord AI/BI a deux parties :\n\n- l'onglet **Data**, où l'on définit les **datasets** : des requêtes SQL ou des tables, éventuellement plusieurs sources\n- le **canevas**, organisé en **pages** (onglets), où l'on place des **widgets** : visualisations, textes, images, filtres\n\n| Choisir | Pour |\n| --- | --- |\n| Courbe | Une évolution dans le temps |\n| Barres | Comparer des catégories |\n| Compteur (counter) | Un indicateur clé, éventuellement comparé à un objectif |\n| Table, tableau croisé | Le détail ou un croisement de deux dimensions |\n| Nuage de points | La relation entre deux mesures |\n| Carte | Une répartition géographique |\n| Camembert | Une part du total, avec peu de catégories |\n\nOn peut aussi créer des visualisations directement dans les résultats de l'éditeur SQL ou d'un notebook (bouton **+** au-dessus des résultats). L'assistant peut générer un widget à partir d'une phrase.\n\n### Pièges d'examen\n\n- Évolution mensuelle : courbe. Un seul KPI : compteur.\n- Plusieurs pages thématiques dans un même tableau de bord : pages (onglets) du canevas.\n- Un widget s'appuie sur un dataset défini dans l'onglet Data.", "kw": ["visualization", "chart", "dashboard", "widget", "counter", "page"]}, {"id": "daa-viz-2", "t": "Paramètres, filtres et partage", "md": "### Paramètres et filtres\n\n```sql\n-- paramètre nommé dans une requête ou un dataset\nSELECT * FROM main.gold.ventes WHERE region = :region AND date_vente >= :date_debut;\n```\n\n- Un **filtre** de tableau de bord peut s'appliquer à des champs de **plusieurs datasets**.\n- Un **paramètre** se teste dans l'éditeur SQL avant d'être exposé dans le tableau de bord.\n\n### Partager\n\n| Mode | Ce que voit le lecteur |\n| --- | --- |\n| Utilisateurs et groupes de l'espace de travail | Permissions *Can view*, *Can run*, *Can edit*, *Can manage* |\n| **Identifiants intégrés** (embed credentials) | Les données accessibles à l'auteur de la publication, même sans droits propres |\n| Sans identifiants intégrés | Uniquement les données que le lecteur a le droit de lire |\n| Lien partageable aux utilisateurs du compte, y compris hors de l'espace de travail | Selon la configuration du compte |\n| Intégration (embed) dans une application externe | Le tableau de bord dans une iframe ou via l'API |\n\n### Pièges d'examen\n\n- Des lecteurs sans droits sur les tables doivent voir les données : publier avec identifiants intégrés.\n- Chacun ne doit voir que ses données : publier sans identifiants intégrés.\n- Un même filtre sur deux graphiques de datasets différents : un filtre lié aux deux champs.", "kw": ["parameter", "filter", "share", "embed", "credential", "permission"]}, {"id": "daa-viz-3", "t": "Planifier et alerter", "md": "- **Planification** d'un tableau de bord : rafraîchissement automatique à fréquence fixe, avec envoi d'un instantané (PDF) par e-mail aux **abonnés** ou vers une destination Slack ou Teams.\n- **Alerte** : une requête SQL planifiée, une **condition** sur le résultat (seuil) et une **destination** de notification (e-mail, Slack, Teams, webhook).\n\n```sql\n-- requête d'alerte : notifier si plus de 100 commandes en erreur\nSELECT count(*) AS nb_erreurs FROM main.gold.commandes WHERE statut = 'ERREUR' AND date = current_date();\n-- condition : nb_erreurs > 100\n```\n\n- La requête d'une alerte s'exécute sur un SQL warehouse : avec l'auto stop, il démarre pour l'occasion puis s'arrête.\n- Le planning d'une requête ou d'un tableau de bord peut avoir une date de fin.\n\n### Pièges d'examen\n\n- Recevoir le tableau de bord chaque lundi : planification avec abonnés.\n- Être prévenu quand un indicateur dépasse un seuil : alerte.\n- Notifier un outil interne : destination webhook.", "kw": ["schedule", "refresh", "alert", "subscri", "destination"]}]}, {"u": "genie", "t": "Espaces AI/BI Genie", "w": 12, "lessons": [{"id": "daa-genie-1", "t": "Créer un espace Genie", "md": "Source : [AI/BI Genie](https://docs.databricks.com/aws/en/genie/).\n\nUn **espace Genie** permet aux métiers de poser des questions en langage naturel sur un ensemble de tables. Genie génère le SQL, l'exécute sur un SQL warehouse et répond par un tableau ou un graphique.\n\nPour le construire, l'auteur :\n\n1. choisit un **SQL warehouse** et quelques **tables ou vues** Unity Catalog, de préférence propres et bien commentées (moins de tables, c'est plus de précision)\n2. écrit des **instructions** métier : définitions, règles de calcul, vocabulaire (« le CA s'entend hors taxes »)\n3. ajoute des **exemples de requêtes SQL** pour les questions fréquentes\n4. définit des **trusted assets** : requêtes paramétrées ou fonctions SQL validées. Une réponse qui s'appuie dessus est signalée comme fiable\n5. propose des **questions exemples** aux utilisateurs\n\nLes **commentaires** des tables et colonnes et les métadonnées Unity Catalog sont le premier levier de précision.\n\n### Partager\n\nOn partage l'espace avec des utilisateurs ou des groupes (*Can view*, *Can run*, *Can edit*, *Can manage*). Les utilisateurs ont aussi besoin du droit de **lire les tables** et d'utiliser le warehouse. Un espace peut être intégré dans d'autres outils : lien, Teams, Slack, application externe via l'API.\n\n### Pièges d'examen\n\n- Améliorer la précision : instructions, exemples SQL, commentaires de colonnes. Pas un warehouse plus gros.\n- Réponse marquée fiable : elle utilise un trusted asset.\n- Trop de tables sans rapport dégradent les réponses.", "kw": ["genie", "instruction", "trusted", "sample question"]}, {"id": "daa-genie-2", "t": "Faire vivre un espace Genie", "md": "- L'onglet **Monitoring** montre les questions posées, les réponses et les **retours** des utilisateurs (pouce vers le haut ou vers le bas, demandes de revue).\n- Les **benchmarks** : une liste de questions avec la réponse SQL attendue. On les relance après chaque modification pour mesurer la précision.\n- Le cycle d'amélioration : repérer les questions mal comprises, ajouter une instruction, un exemple SQL ou un trusted asset, enrichir les commentaires de tables, puis relancer les benchmarks.\n- Après une évolution des tables, on rafraîchit les métadonnées pour que Genie voie les nouvelles colonnes.\n\n### Pièges d'examen\n\n- Mesurer objectivement la précision avant et après un changement : benchmarks.\n- Savoir ce que demandent les utilisateurs : monitoring et retours.\n- Une définition métier mal interprétée de façon récurrente : instruction ou trusted asset.", "kw": ["benchmark", "feedback", "monitor", "genie"]}]}, {"u": "model", "t": "Modélisation des données", "w": 5, "lessons": [{"id": "daa-model-1", "t": "Modèles en étoile, flocon et data vault", "md": "| Modèle | Structure | Atout | Limite |\n| --- | --- | --- | --- |\n| **Étoile** | Une table de faits reliée directement à des dimensions dénormalisées | Simple, rapide pour la BI | Redondance dans les dimensions |\n| **Flocon** | Dimensions normalisées en sous-tables (produit › catégorie › famille) | Moins de redondance | Plus de jointures |\n| **Data vault** | Hubs (clés métier), links (relations), satellites (attributs historisés) | Historique complet, ajout de sources facile | Peu lisible directement : il faut une couche de présentation |\n\n### Avec l'architecture médaillon\n\n- **Bronze** : données brutes.\n- **Silver** : données nettoyées et intégrées. C'est souvent là qu'on place un **data vault** ou un modèle normalisé.\n- **Gold** : modèles de consommation, typiquement **en étoile**, agrégats et vues matérialisées pour la BI et Genie.\n\n```sql\nSELECT d.mois, p.categorie, SUM(f.montant) AS ca\nFROM gold.fait_ventes f\nJOIN gold.dim_date d    ON f.date_id = d.date_id\nJOIN gold.dim_produit p ON f.produit_id = p.produit_id\nGROUP BY d.mois, p.categorie;\n```\n\n### Pièges d'examen\n\n- Tableaux de bord rapides et simples : schéma en étoile en gold.\n- Intégrer de nombreuses sources en gardant tout l'historique : data vault en silver.\n- Dimensions normalisées en plusieurs tables : flocon.", "kw": ["star", "snowflake", "vault", "dimension", "fact", "medallion", "gold", "silver"]}]}, {"u": "sec", "t": "Sécurisation des données", "w": 8, "lessons": [{"id": "daa-sec-1", "t": "Sécuriser les données", "md": "Source : [privilèges Unity Catalog](https://docs.databricks.com/aws/en/data-governance/unity-catalog/manage-privileges/privileges).\n\n### Les droits\n\nPour lire une table, il faut `USE CATALOG` sur le catalogue, `USE SCHEMA` sur le schéma et `SELECT` sur la table. Un droit donné sur un catalogue ou un schéma s'applique à tout ce qu'il contient.\n\n```sql\nGRANT SELECT ON TABLE main.gold.ventes TO `analystes`;\nSHOW GRANTS ON TABLE main.gold.ventes;\nREVOKE SELECT ON TABLE main.gold.ventes FROM `stagiaires`;\n```\n\n| Privilège | Permet |\n| --- | --- |\n| `BROWSE` | Voir les métadonnées dans la recherche, sans lire les données |\n| `SELECT` | Lire |\n| `MODIFY` | Modifier les lignes |\n| `MANAGE` ou propriétaire | Gérer les droits de l'objet |\n\nLes objets de l'espace de travail (requêtes, tableaux de bord, espaces Genie, warehouses) ont leurs propres permissions : *Can view*, *Can run*, *Can edit*, *Can manage*, *Can use*.\n\n### Bonnes pratiques\n\n- Donner les droits à des **groupes**, et confier la propriété des tables à un groupe plutôt qu'à une personne.\n- Protéger les **PII** : vues dynamiques, ou masques de colonnes et filtres de lignes (`ALTER TABLE ... ALTER COLUMN email SET MASK ...`), et taguer les colonnes sensibles.\n- Préférer les tables managées et les volumes à des chemins de stockage ouverts.\n\n### Pièges d'examen\n\n- Une table visible mais impossible à requêter : il manque `SELECT` (ou `USE SCHEMA`).\n- Masquer l'email sauf pour les RH : masque de colonne ou vue dynamique avec `is_account_group_member('rh')`.\n- Voir qui a accès à une table : `SHOW GRANTS` ou l'onglet Permissions.", "kw": ["grant", "privilege", "owner", "pii", "mask", "permission", "select", "browse", "revoke"]}]}],dep:[{"u": "dev", "t": "Développement Python & SQL", "w": 23, "lessons": [{"id": "dep-dev-1", "t": "Projets Python, bundles et dépendances", "md": "Source : [bundles](https://docs.databricks.com/aws/en/dev-tools/bundles/), [environnement serverless](https://docs.databricks.com/aws/en/compute/serverless/dependencies).\n\nAu niveau Professional, le code ne vit plus dans des notebooks isolés : c'est un **projet Python** packagé, testé et déployé par un bundle.\n\n### Une structure qui passe à l'échelle\n\n```text\nmon_projet/\n├── databricks.yml          # bundle : nom, variables, targets\n├── resources/\n│   ├── etl.job.yml         # définition des jobs\n│   └── ventes.pipeline.yml # définition des pipelines\n├── src/ventes/             # package Python importable\n│   ├── __init__.py\n│   └── transformations.py  # fonctions pures, testables\n├── tests/                  # pytest\n└── pyproject.toml          # dépendances et build du wheel\n```\n\n- La logique métier est dans des **fonctions** du package, les notebooks se contentent de les appeler.\n- Le bundle construit le **wheel** (`artifacts`) et l'attache aux tâches, en dev comme en prod.\n- Les dépendances sont **figées** (`requests==2.32.3`) et déclarées une seule fois.\n\n### Où déclarer les dépendances\n\n| Calcul | Déclaration |\n| --- | --- |\n| Notebook serverless | Panneau *Environment* : version d'environnement et liste de dépendances (PyPI, wheel dans un volume, `requirements.txt`) |\n| Tâche serverless d'un job | Bloc `environments` du job (`environment_key`), partagé par plusieurs tâches |\n| Pipeline déclaratif | Champ `environment.dependencies` du pipeline |\n| Cluster classique | Bibliothèques de cluster ou de tâche, `%pip install` dans le notebook |\n\n### Diagnostiquer un échec d'installation\n\n- **Conflit de versions** : la bibliothèque demande une version d'une dépendance différente de celle du runtime ou d'un autre paquet. Figer une version compatible, ou monter la version d'environnement.\n- **Paquet introuvable** : pas d'accès réseau à PyPI, ou miroir privé non configuré. Déposer le wheel dans un volume Unity Catalog et l'installer depuis `/Volumes/...`.\n- **Archive source** (`.tar.gz`) qui doit compiler du C : préférer un wheel précompilé.\n- Après `%pip install`, redémarrer Python (`dbutils.library.restartPython()`) avant d'importer.\n\n### Pièges d'examen\n\n- Code réutilisé par plusieurs jobs : un package Python dans le bundle, pas des copies de notebooks.\n- Bibliothèque privée inaccessible depuis le serverless : wheel dans un volume, référencé dans l'environnement.\n- Les bibliothèques de cluster ne s'appliquent pas au serverless, qui passe par les environnements.", "kw": ["bundle", "wheel", "library", "pip", "dependenc", "package"], "pre": ["dea-cicd-2", "dea-cicd-3"]}, {"id": "dep-dev-2", "t": "UDF Python, pandas et SQL", "md": "Source : [UDF](https://docs.databricks.com/aws/en/udf/).\n\nUne UDF n'est justifiée que si **aucune fonction native** ne fait le travail : les fonctions natives sont optimisées par Photon et l'optimiseur, les UDF non.\n\n| Type | Exécution | Usage |\n| --- | --- | --- |\n| UDF Python (`@udf`) | Ligne par ligne, sérialisation entre la JVM et Python | Logique simple, faibles volumes |\n| **Pandas UDF** (`@pandas_udf`) | Par lots vectorisés via **Apache Arrow** | Calcul numérique, bibliothèques pandas/NumPy, gros volumes |\n| UDF SQL Unity Catalog | Fonction SQL gouvernée, réutilisable partout | Règle métier partagée, masques et filtres |\n| UDF Python Unity Catalog | Fonction Python enregistrée dans un schéma | Logique Python partagée et gouvernée |\n\n```python\nimport pandas as pd\nfrom pyspark.sql.functions import pandas_udf\n\n@pandas_udf(\"double\")\ndef ttc(ht: pd.Series, taux: pd.Series) -> pd.Series:\n    return ht * (1 + taux)      # une opération vectorisée sur tout le lot\n\ndf.withColumn(\"prix_ttc\", ttc(\"prix_ht\", \"tva\"))\n```\n\n```sql\nCREATE OR REPLACE FUNCTION main.ref.categorie_client(ca DOUBLE)\nRETURNS STRING\nRETURN CASE WHEN ca >= 100000 THEN 'grand compte' WHEN ca >= 10000 THEN 'PME' ELSE 'TPE' END;\n\nSELECT main.ref.categorie_client(ca) FROM main.gold.clients;\n```\n\nPour appliquer une fonction par groupe (un modèle par magasin, par exemple), on utilise `groupBy(...).applyInPandas(fn, schema)`.\n\n### Pièges d'examen\n\n- Pandas UDF plus rapide qu'une UDF Python classique : vectorisation et Arrow, pas de sérialisation ligne par ligne.\n- Une règle à partager entre équipes et outils SQL : fonction Unity Catalog, avec le privilège `EXECUTE`.\n- Une UDF n'est pas accélérée par Photon : remplacer par une fonction native quand c'est possible.", "kw": ["udf", "pandas"], "pre": []}, {"id": "dep-dev-3", "t": "Structured Streaming avec état", "md": "Source : [Structured Streaming](https://docs.databricks.com/aws/en/structured-streaming/).\n\n### Watermark et état\n\nUne agrégation ou une déduplication en streaming garde un **état** en mémoire. Le **watermark** dit jusqu'à quand attendre les données en retard, puis permet de purger l'état.\n\n```python\nfrom pyspark.sql.functions import window, count\n\n(events\n  .withWatermark(\"event_time\", \"10 minutes\")              # retard toléré\n  .groupBy(window(\"event_time\", \"5 minutes\"), \"device\")   # fenêtre glissante ou fixe\n  .agg(count(\"*\").alias(\"n\"))\n  .writeStream\n  .outputMode(\"append\")                                    # émet chaque fenêtre une fois close\n  .option(\"checkpointLocation\", \"/Volumes/main/chk/agg\")\n  .toTable(\"main.silver.events_5min\"))\n```\n\n| Mode de sortie | Ce qui est écrit à chaque micro-batch | Usage |\n| --- | --- | --- |\n| `append` | Seulement les lignes définitives | Défaut, agrégations avec watermark, ingestion |\n| `update` | Les lignes modifiées depuis le dernier batch | Agrégats mis à jour, souvent via `foreachBatch` |\n| `complete` | Tout le résultat | Petits agrégats sans watermark, tableaux de bord |\n\n- Dédoublonner un flux : `dropDuplicatesWithinWatermark([\"id\"])` avec un watermark, sinon l'état grossit sans fin.\n- Jointure stream-stream externe : watermark des deux côtés et borne temporelle dans la condition.\n- Jointure stream-static : la table statique Delta est relue à sa dernière version à chaque micro-batch.\n\n### foreachBatch : du batch dans le streaming\n\n```python\ndef upsert(batch_df, batch_id):\n    (batch_df.dropDuplicates([\"id\"]).createOrReplaceTempView(\"updates\"))\n    batch_df.sparkSession.sql(\"\"\"\n      MERGE INTO main.silver.clients t USING updates s ON t.id = s.id\n      WHEN MATCHED THEN UPDATE SET * WHEN NOT MATCHED THEN INSERT *\"\"\")\n\nstream.writeStream.foreachBatch(upsert).option(\"checkpointLocation\", chk).start()\n```\n\n`foreachBatch` sert au MERGE, aux écritures vers plusieurs tables ou aux sinks non supportés. Pour rendre des écritures Delta idempotentes en cas de relance, on passe `txnAppId` et `txnVersion` (le `batch_id`).\n\n### Checkpoints et exactly-once\n\nLe checkpoint stocke les offsets traités et l'état. Combiné à une source rejouable (Kafka, Delta, Auto Loader) et à un sink idempotent (Delta), il garantit l'**exactly-once** après une panne. Un checkpoint est propre à une requête : deux flux ne partagent jamais le même, et changer la logique d'agrégation impose souvent un nouveau checkpoint.\n\n### Pièges d'examen\n\n- État qui grossit indéfiniment : il manque un watermark.\n- Agrégation fenêtrée en `append` : rien n'est émis tant que la fenêtre n'est pas close par le watermark.\n- MERGE depuis un flux : `foreachBatch`.\n- Deux flux qui écrivent dans la même table : chacun son checkpoint.", "kw": ["watermark", "foreachbatch", "output mode", "outputmode", "stateful", "checkpoint", "stream-stream", "window("], "pre": ["dea-jobs-3"]}, {"id": "dep-dev-4", "t": "Pipelines déclaratifs en production", "md": "Source : [Lakeflow Spark Declarative Pipelines](https://docs.databricks.com/aws/en/dlt/).\n\n### Le pipeline type\n\n```python\nfrom pyspark import pipelines as dp\n\n@dp.table(comment=\"Commandes brutes\")\ndef bronze_orders():\n    return (spark.readStream.format(\"cloudFiles\")\n            .option(\"cloudFiles.format\", \"json\")\n            .load(\"/Volumes/main/raw/orders/\"))\n\n@dp.table\n@dp.expect_or_drop(\"id_present\", \"order_id IS NOT NULL\")\ndef silver_orders():\n    return spark.readStream.table(\"bronze_orders\").select(\"order_id\", \"customer_id\", \"amount\", \"ts\")\n\n@dp.materialized_view\ndef gold_ca_jour():\n    return spark.read.table(\"silver_orders\").groupBy(\"ts\").sum(\"amount\")\n```\n\nLe pipeline déduit le graphe des dépendances, gère les checkpoints, l'évolution du schéma d'Auto Loader, les reprises et l'infrastructure. Le schéma Python est `pyspark.pipelines` (ex-`dlt`).\n\n### Streaming table ou materialized view\n\n| Critère | Streaming table | Materialized view |\n| --- | --- | --- |\n| Source | En ajout seul (fichiers, Kafka, table en append) | Quelconque, y compris mises à jour et suppressions |\n| Traitement | Chaque ligne une seule fois, faible latence | Résultat toujours égal à un recalcul complet, rafraîchi incrémentalement quand c'est possible |\n| Coût | Faible : seules les nouvelles données sont lues | Plus élevé si le rafraîchissement doit tout recalculer |\n| Usage | Bronze, silver en append | Agrégats gold, jointures, dimensions |\n\n### Pipeline déclaratif ou Structured Streaming\n\n| Choisir un pipeline déclaratif si… | Choisir Structured Streaming si… |\n| --- | --- |\n| On veut l'orchestration, la qualité (expectations), le lignage et les reprises gérés | On a besoin d'un contrôle fin : `foreachBatch` complexe, sinks externes, état personnalisé |\n| L'équipe privilégie le SQL ou le déclaratif | Le code existe déjà en Structured Streaming |\n| CDC avec AUTO CDC | Logique impossible à exprimer en tables et vues |\n\n### Pièges d'examen\n\n- Agrégat gold recalculé souvent, source modifiée : materialized view. Ingestion append à faible latence : streaming table.\n- Une streaming table ne recalcule pas les lignes déjà traitées si la source change : pour une correction, full refresh.\n- Mode *development* : calcul réutilisé et pas de reprise. Mode *production* : redémarrages et reprises automatiques.", "kw": ["declarative pipeline", "delta live", "dlt", "streaming table", "materialized view", "auto loader", "cloudfiles", "live table"], "pre": ["dea-ing-3", "dea-trans-6", "dea-trans-7"]}, {"id": "dep-dev-5", "t": "AUTO CDC et SCD", "md": "Source : [AUTO CDC](https://docs.databricks.com/aws/en/dlt/cdc).\n\nAUTO CDC (ex-APPLY CHANGES) applique un flux de changements (insert, update, delete) à une table cible, dans le bon ordre, même si les événements arrivent en désordre.\n\n```sql\nCREATE OR REFRESH STREAMING TABLE silver.clients;\n\nCREATE FLOW clients_cdc AS AUTO CDC INTO silver.clients\nFROM STREAM bronze.clients_cdc\nKEYS (client_id)\nAPPLY AS DELETE WHEN operation = 'DELETE'\nSEQUENCE BY event_ts            -- ordre des événements\nCOLUMNS * EXCEPT (operation, event_ts)\nSTORED AS SCD TYPE 2;           -- ou SCD TYPE 1\n```\n\n```python\ndp.create_streaming_table(\"clients\")\ndp.create_auto_cdc_flow(target=\"clients\", source=\"clients_cdc\", keys=[\"client_id\"],\n    sequence_by=\"event_ts\", apply_as_deletes=\"operation = 'DELETE'\",\n    except_column_list=[\"operation\", \"event_ts\"], stored_as_scd_type=2)\n```\n\n| | SCD type 1 | SCD type 2 |\n| --- | --- | --- |\n| Historique | Non, la ligne est écrasée | Oui, une ligne par version |\n| Colonnes ajoutées | Aucune | `__START_AT` et `__END_AT` (version courante : `__END_AT` à NULL) |\n| Usage | Référentiel « état actuel » | Historique d'attributs (adresse, segment) |\n\n- `SEQUENCE BY` est indispensable : sans lui, une mise à jour ancienne arrivée en retard écraserait une plus récente.\n- `track_history_column_list` limite l'historique SCD 2 à certaines colonnes.\n- Sans AUTO CDC, on écrit un `MERGE` dans `foreachBatch`, en dédoublonnant le lot sur la clé et en gardant le dernier événement.\n\n### Pièges d'examen\n\n- Événements dans le désordre : `SEQUENCE BY`.\n- Garder l'historique des changements : `STORED AS SCD TYPE 2`.\n- Une suppression dans la source doit supprimer dans la cible : `APPLY AS DELETE WHEN`.", "kw": ["apply changes", "auto cdc", "scd", "sequence by", "cdc"], "pre": ["dea-trans-4"]}, {"id": "dep-dev-6", "t": "Lakeflow Jobs avancés et calcul", "md": "Source : [serverless pour les jobs](https://docs.databricks.com/aws/jobs/run-serverless-jobs), [API Jobs](https://docs.databricks.com/api/workspace/jobs).\n\n### Créer et automatiser un job\n\nUn même job se crée de trois façons, avec la même définition JSON ou YAML :\n\n- l'**interface** Lakeflow Jobs\n- l'**API REST** (`POST /api/2.2/jobs/create`, puis `run-now` avec des paramètres)\n- la **CLI** ou un **bundle** (`databricks jobs create`, `databricks bundle deploy`)\n\n### Flux de contrôle\n\n- **If/else condition** : compare une valeur, par exemple `{{tasks.check.values.nb_lignes}} > 0` ou `{{job.start_time.iso_weekday}} >= 6`, et n'exécute que la branche retenue.\n- **For each** : lance une tâche par élément d'une liste (statique, paramètre ou task value), avec un parallélisme réglable.\n- **Run if** sur les dépendances (*All succeeded*, *At least one failed*, *All done*…) pour les tâches de nettoyage ou d'alerte.\n\n### Choisir le calcul\n\n| Besoin | Réglage |\n| --- | --- |\n| Pas d'administration, démarrage rapide | Serverless jobs |\n| Coût minimal, latence de démarrage acceptable | Serverless en mode **standard** (démarrage de quelques minutes, moins de DBU) |\n| Délai serré | Serverless en mode **performance optimized** |\n| Notebook qui manque de mémoire | Option *high memory* des tâches notebook serverless (préversion) |\n| Tâche non idempotente (envoi de mails, appel d'API) | Désactiver l'auto-optimisation dans la politique de reprise, pour éviter les reprises automatiques |\n| Bibliothèques natives, GPU, configuration Spark libre | Jobs compute classique |\n\nLe serverless n'accepte qu'une liste réduite de configurations Spark, au niveau de la session.\n\n### Pièges d'examen\n\n- Lancer un job avec d'autres paramètres depuis un orchestrateur externe : API `run-now` avec des paramètres.\n- Traiter 50 pays avec le même notebook : tâche For each.\n- Job serverless qui peut s'exécuter deux fois et envoyer deux factures : désactiver les reprises automatiques.", "kw": ["if/else", "for each", "jobs api", "run_now", "run now", "serverless", "task", "retr"], "pre": ["dea-jobs-1", "dea-jobs-2"]}, {"id": "dep-dev-7", "t": "Tests unitaires et d'intégration", "md": "Source : [tests PySpark](https://spark.apache.org/docs/latest/api/python/getting_started/testing_pyspark.html).\n\n### Des transformations testables\n\nOn isole chaque transformation dans une fonction qui prend et renvoie un DataFrame, puis on les enchaîne avec `DataFrame.transform` :\n\n```python\ndef nettoyer(df):\n    return df.dropna(subset=[\"id\"]).withColumn(\"pays\", F.upper(\"pays\"))\n\ndef enrichir(df):\n    return df.withColumn(\"ttc\", F.col(\"ht\") * 1.2)\n\nresultat = brut.transform(nettoyer).transform(enrichir)\n```\n\n### Les assertions PySpark\n\n```python\nfrom pyspark.testing import assertDataFrameEqual, assertSchemaEqual\n\ndef test_nettoyer(spark):\n    entree = spark.createDataFrame([(1, \"fr\"), (None, \"be\")], \"id INT, pays STRING\")\n    attendu = spark.createDataFrame([(1, \"FR\")], \"id INT, pays STRING\")\n    assertDataFrameEqual(nettoyer(entree), attendu)      # contenu, ordre ignoré par défaut\n    assertSchemaEqual(nettoyer(entree).schema, attendu.schema)\n```\n\n| Test | Portée | Où il tourne |\n| --- | --- | --- |\n| **Unitaire** | Une fonction, de petits DataFrames construits dans le test | En local ou en CI, avec pytest, éventuellement Databricks Connect |\n| **Intégration** | Plusieurs composants ensemble : lecture, transformations, écriture, sur un environnement réel | Target de test d'un bundle, données de test |\n| **Bout en bout** | Le pipeline complet tel qu'en production | Après déploiement, avant la mise en prod |\n\nEn CI, on lance `pytest` puis `databricks bundle deploy -t test` et `databricks bundle run` sur la target de test.\n\n### Pièges d'examen\n\n- Rendre un notebook testable : extraire la logique dans des fonctions, ce qui demande d'y penser dès la conception.\n- Comparer deux DataFrames dans un test : `assertDataFrameEqual`. Comparer leurs schémas : `assertSchemaEqual`.\n- Test d'intégration : vérifie que les composants fonctionnent ensemble, pas une fonction isolée.", "kw": ["test", "assert", "pytest"], "pre": []}]}, {"u": "ing", "t": "Ingestion & acquisition", "w": 12, "lessons": [{"id": "dep-ing-1", "t": "Sources de streaming et formats", "md": "Source : [Kafka](https://docs.databricks.com/aws/en/connect/streaming/kafka), [Kinesis](https://docs.databricks.com/aws/en/connect/streaming/kinesis).\n\n### Bus de messages\n\n```python\nraw = (spark.readStream.format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\", \"broker1:9092\")\n  .option(\"subscribe\", \"orders\")                 # ou subscribePattern\n  .option(\"startingOffsets\", \"earliest\")\n  .load())\n\norders = raw.select(F.col(\"key\").cast(\"string\"),\n                    F.from_json(F.col(\"value\").cast(\"string\"), schema).alias(\"v\"),\n                    \"topic\", \"partition\", \"offset\", \"timestamp\")\n```\n\n- Kafka livre `key` et `value` en **binaire** : il faut les caster, puis parser le JSON avec `from_json` ou les sto
