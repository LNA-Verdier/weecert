    const fl=findLesson(SES.course);if(fl&&fl.u.lessons.every(l=>p.course[l.id])&&!(p.unitDone||{})[fl.c+"-"+fl.u.u])courseDone+=`<p class="note">Toutes les leçons de « ${esc(fl.u.t)} » sont lues : la révision de section est débloquée, elle ouvre le coffre.</p>`}
  if(SES.section){p.unitDone=p.unitDone||{};const uk=SES.cert+"-"+SES.section;const u=(courseOf(SES.cert)||[]).find(x=>x.u===SES.section);if(!p.unitDone[uk]){p.unitDone[uk]=Date.now();bonus+=50;{const units=courseOf(SES.cert)||[];const all=units.length&&units.every(x=>p.unitDone[SES.cert+"-"+x.u]);const ui=units.indexOf(u);secWin={kicker:all?"Parcours "+CERTS[SES.cert].short+" terminé":"Section "+(ui+1)+" terminée",title:all?"Parcours terminé !":"Coffre ouvert !",sub:all?"Bravo, tu as terminé toutes les sections. Place aux examens blancs !":"Bravo, tu as terminé « "+(u?u.t:"")+" ». Continue sur ta lancée !",xp:0}}courseDone+=`<p class="note ok">Section « ${esc(u?u.t:"")} » terminée : coffre ouvert, +50 XP !</p>`}}
  if(SES.mode==="timed"){p.timedBest=p.timedBest||{};p.timedBest[SES.cert]=Math.max(p.timedBest[SES.cert]||0,SES.firstOk);courseDone+=`<p class="note">${SES.firstOk} bonne${SES.firstOk>1?"s":""} réponse${SES.firstOk>1?"s":""} sur ${SES.first} répondue${SES.first>1?"s":""} · record ${p.timedBest[SES.cert]}/${TIMED_N}</p>`}
  SES.xp+=bonus;addXp(SES.xp);p.sessions++;const froze=bumpStreak();
  saveSrs(SES.cert);const nb=checkBadges();savePlayer();
  const acc=SES.first?Math.round(100*SES.firstOk/SES.first):0;const mins=Math.max(1,Math.round((Date.now()-SES.start)/60000));
  results({title:SES.mode==="timed"?(SES.done<SES.items.length?"Temps écoulé !":"Session terminée !"):perfect?"Sans faute !":SES.mode==="wrong"?"Rattrapage terminé !":SES.section?"Section révisée !":SES.course?"Étape validée !":"Révisions terminées !",mood:acc>=60?"happy":"wow",
    kpis:[["XP gagnés","+"+SES.xp,""],["Précision",acc+" %","g"],["Durée",mins+" min","b"]],newBadges:nb,
    extra:`${courseDone}${froze?'<p class="note">Ton jour de pause hebdomadaire a protégé ta série.</p>':""}<p class="note">Série : ${streakOf(p)} jour${streakOf(p)>1?"s":""} · Combo max : ${SES.maxCombo}</p>`});
  if(secWin){secWin.xp=SES.xp;celebrate(secWin)}
}

/* ---------- Sprint ---------- */
function startSprint(){
  const pool=allQ(S.cert);if(!pool.length)return;let list=shuffle(pool);while(list.length<SPRINT_N)list=list.concat(shuffle(pool));list=list.slice(0,SPRINT_N);
  SES={mode:"sprint",cert:S.cert,items:list.map(present),i:0,sel:new Set(),ok:0,log:[],end:Date.now()+SPRINT_MS,lock:false};openSession();renderSprint();
  TIMER=setInterval(()=>{const left=SES.end-Date.now();const t=$("#tm");if(t){t.textContent=fmtTime(left);t.classList.toggle("warn",left<60e3)}if(left<=0)finishSprint()},250);
}
function renderSprint(){
  const it=SES.items[SES.i];SES.cur=it;SES.sel=new Set();SES.lock=false;const multi=it.q.a.length>1;
  SE.innerHTML=`<div class="s-head"><div class="wrap"><button class="iconbtn" data-x="quit" aria-label="Quitter">${I.close}</button><div class="prog"><i style="width:${100*SES.i/SPRINT_N}%;background:var(--blue)"></i></div><span class="timer num" id="tm">${fmtTime(SES.end-Date.now())}</span></div></div>
  <div class="s-body"><div class="wrap"><div class="qtag"><span class="chip rev num">${SES.i+1} / ${SPRINT_N}</span><span class="chip num" style="background:var(--green-bg);color:var(--green-fg)">${SES.ok} justes</span></div>${qBlock(it).replace('<div class="qtag">','<div class="qtag" hidden>')}</div></div>
  ${multi?`<div class="s-foot" id="foot"><div class="wrap"><button class="btn blue" id="sprintOk" disabled>Valider</button></div></div>`:""}`;
}
function answerSprint(){if(SES.lock)return;const q=SES.cur.q;SES.lock=true;const ok=isRight(q,SES.sel);record(q,ok);if(ok)SES.ok++;SES.log.push({q,ok,sel:[...SES.sel]});
  const body=SE.querySelector(".opts");body.parentElement.classList.add(ok?"flash-good":"flash-bad");
  if(!ok)document.querySelectorAll(".opt").forEach(b=>{if(q.a.includes(+b.dataset.oi))b.classList.add("good")});
  setTimeout(()=>{if(!SES||SES.mode!=="sprint")return;SES.i++;if(SES.i>=SPRINT_N)finishSprint();else renderSprint()},ok?350:900)}
function finishSprint(){if(!SES||SES.mode!=="sprint"||SES.finished)return;SES.finished=true;clearInterval(TIMER);
  const p=S.player;const xp=SES.ok*5+(SES.log.length>=SPRINT_N?10:0);addXp(xp);p.sessions++;bumpStreak();
  p.sprintBest[SES.cert]=Math.max(p.sprintBest[SES.cert]||0,SES.ok);saveSrs(SES.cert);const nb=checkBadges();savePlayer();
  const wrong=SES.log.filter(l=>!l.ok);const time=SPRINT_MS-Math.max(0,SES.end-Date.now());
  results({title:SES.log.length<SPRINT_N?"Temps écoulé !":"Sprint terminé !",mood:SES.ok>=30?"wow":"happy",
    kpis:[["Score",SES.ok+"/"+SPRINT_N,"g"],["XP gagnés","+"+xp,""],["Temps",fmtTime(time),"b"]],newBadges:nb,review:wrong,
    extra:`<p class="note">${SES.log.length} questions traitées · record : ${p.sprintBest[SES.cert]}/${SPRINT_N}</p>`});
}

/* ---------- Exam ---------- */
function drawWeighted(by,w,n){
  // quotas au plus fort reste, puis redistribution si un domaine manque de questions
  const keys=Object.keys(by).filter(k=>(w[k]||0)>0);const quota={};let total=0;
  const tw=keys.reduce((a,k)=>a+w[k],0)||1;const rest=[];
  for(const k of keys){const x=n*w[k]/tw;quota[k]=Math.min(Math.floor(x),by[k].length);total+=quota[k];rest.push([x-Math.floor(x),k])}
  rest.sort((a,b)=>b[0]-a[0]);
  for(const[,k]of rest){if(total>=n)break;if(quota[k]<by[k].length){quota[k]++;total++}}
  const pick=[];for(const k of keys)pick.push(...by[k].slice(0,quota[k]));
  // complément : domaines pondérés encore disponibles, par ordre de poids, puis domaines hors exam guide
  const order=keys.slice().sort((a,b)=>w[b]-w[a]).concat(Object.keys(by).filter(k=>!(w[k]>0)));
  const used={};for(const k of keys)used[k]=quota[k];
  while(pick.length<n){let added=false;for(const k of order){const u=used[k]||0;if(u<by[k].length&&pick.length<n){pick.push(by[k][u]);used[k]=u+1;added=true}}if(!added)break}
  return pick}
function examMinutes(c){const n=Math.min(CERTS[c].exam.n,allQ(c).length);return Math.round(CERTS[c].exam.min*n/CERTS[c].exam.n)}
function startExam(){
  const saved=LS.get("exam",null);
  if(saved&&saved.cert===S.cert){SES=Object.assign({mode:"exam"},saved,{flags:new Set(saved.flags||[]),last:Date.now(),confirm:false,showGrid:false});SES.orders=saved.orders;}
  else{const c=CERTS[S.cert];const pool=allQ(S.cert);
    // tirage selon les pondérations officielles de l'exam guide
    const by={};for(const q of shuffle(pool))(by[q.d]=by[q.d]||[]).push(q);const n=Math.min(c.exam.n,pool.length);
    const pick=drawWeighted(by,c.exam.w||{},n);
    const ids=shuffle(pick).map(q=>q.id);const orders={};ids.forEach(id=>{const q=qById(id);orders[id]=shuffle(q.o.map((_,i)=>i))});
    SES={mode:"exam",cert:S.cert,ids,orders,ans:{},flags:new Set(),idx:0,remaining:examMinutes(S.cert)*60e3,last:Date.now(),confirm:false,showGrid:false}}
  SES.ids=SES.ids.filter(id=>qById(id));if(!SES.ids.length){LS.del("exam");return toast("Examen indisponible")}
  openSession();renderExam();
  TIMER=setInterval(()=>{const now=Date.now();SES.remaining-=now-SES.last;SES.last=now;const t=$("#tm");if(t){t.textContent=fmtTime(SES.remaining);t.classList.toggle("warn",SES.remaining<5*60e3)}if(SES.remaining<=0)finishExam()},500);
}
function saveExam(){LS.set("exam",{cert:SES.cert,ids:SES.ids,orders:SES.orders,ans:SES.ans,flags:[...SES.flags],idx:SES.idx,remaining:SES.remaining})}
function renderExam(){
  const id=SES.ids[SES.idx],q=qById(id);const it={q,order:SES.orders[id]||q.o.map((_,i)=>i)};SES.cur=it;SES.sel=new Set(SES.ans[id]||[]);
  const N=SES.ids.length,answered=Object.keys(SES.ans).length;
  SE.innerHTML=`<div class="s-head"><div class="wrap"><button class="iconbtn" data-x="pause" aria-label="Mettre en pause">${I.pause}</button><div class="prog"><i style="width:${100*answered/N}%;background:var(--violet)"></i></div><span class="timer num" id="tm">${fmtTime(SES.remaining)}</span></div></div>
  <div class="s-body"><div class="wrap">
    <div class="qtag"><span class="chip num" style="background:var(--violet);color:var(--on)">Question ${SES.idx+1} / ${N}</span><span class="spacer"></span><button class="iconbtn flagbtn" data-x="flag" aria-pressed="${SES.flags.has(id)}" aria-label="Marquer pour revoir">${I.flag}</button><button class="iconbtn" data-x="grid" aria-label="Vue d'ensemble">${I.grid}</button></div>
    ${SES.showGrid?`<div class="card"><b style="color:var(--strong)">Vue d'ensemble · ${answered}/${N} répondues</b><div class="grid-nav">${SES.ids.map((x,i)=>`<button data-go="${i}" class="${SES.ans[x]?"done":""}${SES.flags.has(x)?" flag":""}${i===SES.idx?" cur":""}">${i+1}</button>`).join("")}</div><p class="note">Bleu : répondue · liseré jaune : à revoir</p></div>`:""}
    ${qBlock(it).replace('<div class="qtag">','<div class="qtag" hidden>')}
    ${SES.confirm?`<div class="confirm"><p>${N-answered?`Il reste ${N-answered} question${N-answered>1?"s":""} sans réponse. `:""}Terminer l'examen et voir ton score ?</p><div class="btnrow"><button class="btn violet small" data-x="finish">Terminer</button><button class="btn ghost small" data-x="cancel">Continuer l'examen</button></div></div>`:""}
  </div></div>
  <div class="s-foot"><div class="wrap" style="flex-direction:row"><button class="btn ghost" data-x="prev" ${SES.idx?"":"disabled"} style="flex:1">Précédente</button>${SES.idx<N-1?`<button class="btn violet" data-x="next" style="flex:1">Suivante</button>`:`<button class="btn" data-x="end" style="flex:1">Terminer</button>`}</div></div>`;
  paintSel();
}
function finishExam(){if(!SES||SES.mode!=="exam"||SES.finished)return;SES.finished=true;clearInterval(TIMER);LS.del("exam");
  const N=SES.ids.length;let ok=0;const dom={};const review=[];
  for(const id of SES.ids){const q=qById(id);const sel=SES.ans[id]||[];const right=sel.length&&isRight(q,new Set(sel));if(right)ok++;if(sel.length)record(q,right);
    const d=dom[q.d]=dom[q.d]||{l:q.dl||q.d,n:0,ok:0};d.n++;if(right)d.ok++;if(!right)review.push({q,ok:false,sel})}
  const pct=Math.round(100*ok/N);const p=S.player;const xp=ok*10+30;addXp(xp);p.sessions++;bumpStreak();
  p.examBest[SES.cert]=Math.max(p.examBest[SES.cert]||0,pct);saveSrs(SES.cert);const nb=checkBadges();savePlayer();
  results({title:pct>=PASS?"Examen réussi !":"Examen terminé",mood:pct>=PASS?"wow":"sad",kpis:[["Score",pct+" %",pct>=PASS?"g":""],["Justes",ok+"/"+N,"b"],["XP gagnés","+"+xp,""]],newBadges:nb,review,
    extra:`<span class="pass ${pct>=PASS?"y":"n"}">${pct>=PASS?"Au-dessus":"En dessous"} du seuil indicatif de ${PASS} %</span>
    <div class="dombars"><div class="sec-title" style="margin:8px 0 0">Par domaine</div>${Object.values(dom).map(d=>{const v=Math.round(100*d.ok/d.n);return `<div><div class="lab"><span>${esc(d.l)}</span><span class="num">${d.ok}/${d.n}</span></div><div class="bar"><i style="width:${v}%;background:${v>=PASS?"var(--green)":"var(--red)"}"></i></div></div>`}).join("")}</div>`});
}

/* ---------- Results screen ---------- */
function results(o){
  SES.result=true;
  SE.innerHTML=`<div class="s-body"><div class="wrap"><div class="res">
    <div class="bounce">${mascot(120,o.mood)}</div><h2>${esc(o.title)}</h2>
    <div class="kpis">${o.kpis.map(([h,v,cl])=>`<div class="kpi ${cl}"><div class="h"><span>${esc(h)}</span></div><div class="v num">${esc(v)}</div></div>`).join("")}</div>
    ${o.extra||""}
    ${o.newBadges&&o.newBadges.length?`<div class="sec-title" style="margin:6px 0 0">Nouveau badge</div><div class="newbadges">${o.newBadges.map(b=>badgeHtml(b)).join("")}</div>`:""}
    ${o.review&&o.review.length?`<div class="review"><div class="sec-title" style="margin:8px 0 0">À revoir (${o.review.length})</div>${o.review.map(r=>`<details><summary>${esc(r.q.q)}</summary>${r.q.code?`<pre class="code" style="margin-top:8px">${esc(r.q.code)}</pre>`:""}${r.sel&&r.sel.length?`<p class="r-y">Ta réponse : ${esc(r.sel.map(i=>r.q.o[i]).join(" + "))}</p>`:'<p class="r-y">Sans réponse</p>'}<p class="r-a">Bonne réponse : ${esc(answerText(r.q))}</p>${r.q.e?`<p class="r-e">${esc(r.q.e)}</p>`:""}</details>`).join("")}<p class="note">Ces questions sont ajoutées à ton rattrapage.</p></div>`:""}
  </div></div></div>
  <div class="s-foot"><div class="wrap"><button class="btn" data-x="close" id="closeBtn">Continuer</button></div></div>`;
  $("#closeBtn").focus({preventScroll:true});
}

/* ---------- Session events ---------- */
SE.addEventListener("click",e=>{
  if(!SES)return;const opt=e.target.closest(".opt");const x=e.target.closest("[data-x]");const go=e.target.closest("[data-go]");
  if(opt&&!opt.disabled){const oi=+opt.dataset.oi;
    if(SES.mode==="lesson"||SES.mode==="wrong"||SES.mode==="timed"){if(SES.checked)return;toggleSel(oi);$("#checkBtn").disabled=!SES.sel.size}
    else if(SES.mode==="sprint"){if(SES.lock)return;toggleSel(oi);if(SES.cur.q.a.length===1)answerSprint();else $("#sprintOk").disabled=SES.sel.size!==SES.cur.q.a.length}
    else if(SES.mode==="exam"){toggleSel(oi);const id=SES.ids[SES.idx];if(SES.sel.size)SES.ans[id]=[...SES.sel];else delete SES.ans[id];saveExam();const N=SES.ids.length;SE.querySelector(".prog>i").style.width=(100*Object.keys(SES.ans).length/N)+"%"}
    return}
  if(e.target.closest("#checkBtn"))return checkLesson();
  if(e.target.closest("#nextBtn"))return nextLesson();
  if(e.target.closest("#sprintOk"))return answerSprint();
  if(go){SES.idx=+go.dataset.go;SES.showGrid=false;saveExam();return renderExam()}
  if(!x)return;const a=x.dataset.x;
  if(a==="close")return closeSession();
  if(a==="quit"){if(SES.mode==="sprint"&&SES.log.length)return finishSprint();if((SES.mode==="lesson"||SES.mode==="wrong"||SES.mode==="timed")&&SES.first){saveSrs(SES.cert);savePlayer()}return closeSession()}
  if(a==="pause"){saveExam();toast("Examen en pause, reprends-le quand tu veux");return closeSession()}
  if(a==="flag"){const id=SES.ids[SES.idx];SES.flags.has(id)?SES.flags.delete(id):SES.flags.add(id);saveExam();return renderExam()}
  if(a==="grid"){SES.showGrid=!SES.showGrid;return renderExam()}
  if(a==="prev"){SES.idx--;SES.confirm=false;saveExam();return renderExam()}
  if(a==="next"){SES.idx++;SES.confirm=false;saveExam();return renderExam()}
  if(a==="end"){SES.confirm=true;renderExam();SE.querySelector(".s-body").scrollTop=1e6;return}
  if(a==="cancel"){SES.confirm=false;return renderExam()}
  if(a==="finish")return finishExam();
  if(a==="quiz")return startCourseQuiz(SES.lesson);
  if(a==="pre")return openCourse(x.dataset.l);
});
document.addEventListener("keydown",e=>{
  if(!SES||SE.hidden||SES.result)return;if(e.target.tagName==="TEXTAREA")return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=9){const b=SE.querySelectorAll(".opt")[n-1];if(b&&!b.disabled){b.click();e.preventDefault()}return}
  if(e.key==="Enter"){const nb=$("#nextBtn")||$("#checkBtn")||$("#sprintOk");if(nb&&!nb.disabled){nb.click();e.preventDefault()}}
  if(SES.mode==="exam"){if(e.key==="ArrowRight"&&SES.idx<SES.ids.length-1){SES.idx++;saveExam();renderExam()}if(e.key==="ArrowLeft"&&SES.idx>0){SES.idx--;saveExam();renderExam()}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)$("#sheet").hidden=true});

/* ---------- Boot ---------- */
S.imported=LS.get("imports",[]).map(q=>Object.assign({src:"i"},q));
render();
const dclone=x=>x==null?x:JSON.parse(JSON.stringify(x));
(async function connect(){
  const C=window.claude;if(!C||!C.use)return;
  try{
    const [db,user,dl]=await Promise.all([C.use("db"),C.use("user"),C.use("downloads").catch(()=>null)]);
    S.canDownload=!!dl;S.user=user;
    try{S.isOwner=user?!!(await user.isOwner()):false}catch(e){S.isOwner=false}
    if(!db||!user){render();return}
    const uid=await user.id();if(!uid){render();return}
    S.db=db;S.uid=uid;S.online=true;
    // Rôles : administrateurs désignés par le propriétaire
    db.doc("config/roles").onSnapshot(d=>{const v=d&&d.exists?(dclone(d.data())||{}):{};S.admins=Array.isArray(v.admins)?v.admins.filter(x=>typeof x==="string"):[];const was=S.isAdmin;S.isAdmin=S.isOwner||S.admins.includes(S.uid);if(was!==S.isAdmin||S.tab==="profile")render()},()=>{});
    // Progression du joueur
    try{const snap=await db.doc("players/"+uid).get();if(snap.exists){const remote=dclone(snap.data())||{};const local=S.player;S.player=Object.assign(defaultPlayer(),remote);if((local.xp||0)>(remote.xp||0))S.player=Object.assign(defaultPlayer(),local)}else{writeDoc("players/"+uid,S.player)}}catch(e){}
    for(const c of Object.keys(CERTS)){try{const s=await db.doc("data/users/"+uid+"/srs_"+c).get();if(s.exists){const r=(dclone(s.data())||{}).m||{};const l=S.srs[c]||{};S.srs[c]=Object.keys(r).length>=Object.keys(l).length?r:l}else if(Object.keys(S.srs[c]).length)saveSrs(c)}catch(e){}}
    LS.set("player",S.player);LS.set("srs",S.srs);
    // Classement en direct
    db.collection("players").onSnapshot(snap=>{S.players=snap.docs.map(d=>Object.assign({id:d.id},dclone(d.data())||{}));const me=S.players.find(p=>p.id===uid);if(!me)S.players.push(Object.assign({id:uid},S.player));if(S.tab==="league"&&$("#session").hidden)render()},()=>{});
    // Questions importées partagées
    db.collection("questions").onSnapshot(snap=>{const remote=snap.docs.map(d=>Object.assign({id:d.id,src:"i"},dclone(d.data())||{})).filter(q=>q.c&&CERTS[q.c]&&Array.isArray(q.o)&&Array.isArray(q.a));const local=LS.get("imports",[]).map(q=>Object.assign({src:"i"},q));S.imported=remote.concat(local.filter(l=>!remote.find(r=>r.id===l.id)));if($("#session").hidden)render()},()=>{});
    try{const cw=await user.can("data.write");if(cw===false){S.localOnly=true}}catch(e){}
    render();
  }catch(e){render()}
})();
</script>
