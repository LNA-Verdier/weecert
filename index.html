cker en VARIANT.\n- Kinesis (`format(\"kinesis\")`) et Pub/Sub (`format(\"pubsub\")`) suivent le même modèle.\n- Les messages peuvent être livrés **plusieurs fois** : on garde `topic`, `partition` et `offset` en bronze, puis on dédoublonne sur une clé métier en aval.\n- En bronze, on stocke le message brut (ajout seul) pour pouvoir rejouer. Le parsing et le dédoublonnage se font en silver.\n\n### Formats de fichiers\n\n| Format | Particularité à l'ingestion |\n| --- | --- |\n| CSV, JSON | Texte, types inférés en STRING par Auto Loader sans `inferColumnTypes` |\n| Parquet, Avro | Schéma embarqué dans les fichiers |\n| Delta | Lecture en streaming d'une table : seulement les ajouts, sauf `skipChangeCommits` ou Change Data Feed |\n| Iceberg | Lisible et inscriptible dans Unity Catalog (tables Iceberg managées, catalogue REST Iceberg) |\n| Binaire | `binaryFile` : une ligne par fichier avec `content` |\n\n### Pièges d'examen\n\n- `value` de Kafka illisible : cast en STRING puis `from_json`.\n- Doublons venant du bus : dédoublonner sur une clé avec un watermark, pas compter sur la source.\n- Un flux qui lit une table Delta modifiée par des UPDATE échoue : `skipChangeCommits`, ou lire le Change Data Feed.", "kw": ["kafka", "kinesis", "pub/sub", "iceberg", "binary", "duplicate"], "pre": ["dea-ing-1"]}, {"id": "dep-ing-2", "t": "CDC entrant : Lakeflow Connect et cibles Delta ou Iceberg", "md": "Source : [Lakeflow Connect](https://docs.databricks.com/en/ingestion/lakeflow-connect.html).\n\nPour SQL Server, MySQL et PostgreSQL, un **connecteur managé** lit les changements de la base (CDC ou change tracking) et les applique à des streaming tables :\n\n- une **connection** Unity Catalog porte les identifiants\n- une **ingestion gateway** tourne en continu près de la base et dépose les changements dans un stockage intermédiaire\n- un **pipeline d'ingestion** serverless applique ces changements aux tables cibles, en SCD type 1 ou type 2\n\nDans un pipeline déclaratif, la cible d'un flux AUTO CDC peut être une table **Delta** ou **Iceberg**, ce qui laisse d'autres moteurs lire le résultat au format Iceberg.\n\n| Situation | Outil |\n| --- | --- |\n| Base relationnelle, CDC sans code | Lakeflow Connect |\n| Fichiers de changements déposés par un outil tiers | Auto Loader + AUTO CDC |\n| Changements d'une table Delta existante | Change Data Feed + AUTO CDC ou MERGE |\n\n### Pièges d'examen\n\n- La gateway n'existe que pour les bases de données, pas pour les SaaS.\n- Le CDC doit être activé côté base source (CDC ou change tracking pour SQL Server).\n- L'historique des changements côté cible : SCD type 2.", "kw": ["lakeflow connect", "cdc", "sql server", "mysql", "postgres"], "pre": ["dea-ing-4"]}, {"id": "dep-ing-3", "t": "Partage : OpenSharing, Delta Sharing et Clean Rooms", "md": "Sources : [Delta Sharing](https://docs.databricks.com/aws/en/delta-sharing/), [OpenSharing](https://www.databricks.com/company/newsroom/press-releases/databricks-announces-opensharing), [Clean Rooms](https://docs.databricks.com/aws/en/clean-rooms/).\n\n**OpenSharing**, annoncé en juin 2026, est présenté comme l'évolution de Delta Sharing : un protocole ouvert, hébergé par la Linux Foundation, étendu aux actifs d'IA et aux clients Iceberg. Les deux modes de partage restent :\n\n| | Databricks-to-Databricks (D2D) | Databricks-to-Open (D2O, partage ouvert) |\n| --- | --- | --- |\n| Destinataire | Workspace Databricks avec Unity Catalog | N'importe quel client : Spark, pandas, Power BI, Tableau, Snowflake… |\n| Identification | Identifiant de partage du metastore destinataire | Fichier d'identification (jeton) ou fédération OIDC |\n| Objets | Tables, vues, volumes, modèles, notebooks | Surtout des tables |\n| Historique | Possible : `WITH HISTORY` permet time travel, CDF et lecture en streaming | Selon le client |\n\n```sql\nCREATE SHARE ventes_partenaires;\nALTER SHARE ventes_partenaires ADD TABLE main.gold.ventes WITH HISTORY;\nCREATE RECIPIENT partenaire_a USING ID 'aws:eu-west-1:<metastore-uuid>';   -- D2D\nGRANT SELECT ON SHARE ventes_partenaires TO RECIPIENT partenaire_a;\n```\n\n- Le partage est toujours en **lecture seule** et sans copie. Entre clouds ou régions, l'egress est facturé au fournisseur.\n- Pour ne partager qu'une partie des lignes ou des colonnes : partager une **vue**, ou utiliser des partitions.\n\n### Clean Rooms\n\nUne **Clean Room** est un espace isolé où plusieurs organisations rapprochent leurs données **sans qu'aucune ne voie les données brutes des autres**. Chacun y partage des tables, seuls des notebooks approuvés par les participants s'exécutent, et seuls les résultats autorisés sortent, par exemple un agrégat de clients communs. Elle repose sur Delta Sharing et le calcul serverless.\n\n### Pièges d'examen\n\n- Partenaire hors Databricks : partage ouvert. Partenaire Databricks : D2D avec l'identifiant de metastore.\n- Calcul commun sur des données que personne ne doit voir en clair : Clean Room, pas un partage classique.\n- Le destinataire doit lire en streaming ou faire du time travel : `WITH HISTORY`.", "kw": ["delta sharing", "share", "recipient", "clean room", "opensharing"], "pre": ["dea-plat-3"]}, {"id": "dep-ing-4", "t": "Lakehouse Federation gouvernée", "md": "Source : [Lakehouse Federation](https://docs.databricks.com/aws/en/query-federation/).\n\n```sql\nCREATE CONNECTION sqlserver_crm TYPE sqlserver\nOPTIONS (host 'crm.corp', port '1433', user secret('crm','user'), password secret('crm','pwd'));\n\nCREATE FOREIGN CATALOG crm USING CONNECTION sqlserver_crm OPTIONS (database 'crm');\n\nGRANT USE CATALOG ON CATALOG crm TO `analystes`;\nGRANT SELECT ON SCHEMA crm.dbo TO `analystes`;\n```\n\n- La **connection** porte les identifiants de la source, stockés une fois et masqués. Il faut le privilège `CREATE CONNECTION` sur le metastore pour la créer, et `USE CONNECTION` pour l'utiliser.\n- Le **foreign catalog** expose les tables de la source dans Unity Catalog. Les droits se gèrent avec les GRANT habituels, et le lignage et l'audit s'appliquent.\n- Les filtres et agrégats sont poussés vers la source quand c'est possible (*pushdown*).\n- Sources : MySQL, PostgreSQL, SQL Server, Oracle, Snowflake, Redshift, BigQuery, Teradata, un autre workspace Databricks, et la fédération de catalogues (Hive metastore, Glue).\n\n### Pièges d'examen\n\n- Interroger sans copier, avec les droits Unity Catalog : Lakehouse Federation.\n- Les utilisateurs ne doivent pas connaître le mot de passe de la base : identifiants dans la connection, droits par GRANT.\n- Requêtes lourdes et répétées : ingérer plutôt que fédérer, pour ne pas charger la base source.", "kw": ["federation", "foreign catalog", "connection"], "pre": ["dea-ing-4"]}]}, {"u": "manip", "t": "Manipulation des données", "w": 12, "lessons": [{"id": "dep-manip-1", "t": "Fenêtres, jointures et agrégations à grande échelle", "md": "Source : [fonctions de fenêtre](https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-window-functions).\n\n### Fenêtres\n\n```sql\nSELECT customer_id, ts, amount,\n  SUM(amount)  OVER (PARTITION BY customer_id ORDER BY ts\n                     ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)   AS cumul_7_lignes,\n  SUM(amount)  OVER (PARTITION BY customer_id ORDER BY ts\n                     RANGE BETWEEN INTERVAL 7 DAYS PRECEDING AND CURRENT ROW) AS cumul_7_jours,\n  LAG(amount)  OVER (PARTITION BY customer_id ORDER BY ts)       AS precedent,\n  amount / SUM(amount) OVER (PARTITION BY customer_id)            AS part_du_total\nFROM silver.orders\nQUALIFY ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY ts DESC) <= 3;\n```\n\n- `ROWS` compte des lignes, `RANGE` des valeurs (des jours, par exemple).\n- Une fenêtre **sans** `PARTITION BY` envoie toutes les lignes sur une seule tâche : à éviter sur de gros volumes.\n- `ROW_NUMBER`, `RANK`, `DENSE_RANK` pour les classements, `LAG` et `LEAD` pour comparer à la ligne précédente ou suivante.\n\n### Jointures sur de gros volumes\n\n| Stratégie | Quand Spark la choisit | Coût |\n| --- | --- | --- |\n| Broadcast hash join | Une table sous le seuil de broadcast | Pas de shuffle de la grosse table |\n| Sort-merge join | Deux grosses tables | Shuffle et tri des deux côtés |\n| Shuffle hash join | Choisi par AQE si un côté reste petit après filtrage | Shuffle sans tri |\n\nAQE peut passer en broadcast pendant l'exécution, et découper les partitions asymétriques (*skew join*). Les hints `BROADCAST`, `MERGE`, `SHUFFLE_HASH` et `SKEW` forcent un choix.\n\n### Agrégations\n\n- `approx_count_distinct` et `approx_percentile` pour des estimations rapides sur des milliards de lignes.\n- `GROUP BY ROLLUP` ou `CUBE` pour les sous-totaux.\n- Filtrer et projeter **avant** la jointure ou l'agrégation, pour réduire le shuffle.\n\n### Pièges d'examen\n\n- Cumul glissant sur 7 jours calendaires avec des jours manquants : `RANGE` sur un intervalle, pas `ROWS`.\n- Jointure lente avec une petite table de référence : broadcast.\n- Fenêtre sans partition sur toute une table : goulet sur une seule tâche.", "kw": ["window", "join", "aggregat", "rank", "lag", "over ("], "pre": ["dea-trans-2", "dea-trans-4"]}, {"id": "dep-manip-2", "t": "Le type VARIANT", "md": "Source : [VARIANT](https://docs.databricks.com/aws/en/semi-structured/variant).\n\nVARIANT stocke des données semi-structurées dans un format binaire optimisé. Il évite de figer un schéma à l'ingestion et se lit beaucoup plus vite qu'une chaîne JSON.\n\n```sql\nCREATE TABLE bronze.events (id BIGINT, payload VARIANT);\nINSERT INTO bronze.events SELECT id, parse_json(raw) FROM bronze.events_raw;\n\nSELECT\n  payload:device.id::STRING                      AS device_id,     -- chemin et cast\n  variant_get(payload, '$.reading', 'DOUBLE')    AS reading,       -- équivalent fonctionnel\n  try_variant_get(payload, '$.temp', 'INT')      AS temp,          -- NULL si le cast échoue\n  schema_of_variant(payload)                     AS schema_ligne\nFROM bronze.events;\n```\n\n| Fonction | Rôle |\n| --- | --- |\n| `parse_json(str)` | STRING JSON vers VARIANT (erreur si invalide), `try_parse_json` renvoie NULL |\n| `variant_get(v, chemin, type)` | Extraire et typer un champ |\n| `v:chemin::type` | Même chose en syntaxe courte |\n| `is_variant_null`, `schema_of_variant` | Tester un null JSON, inspecter la structure |\n| `variant_explode` | Une ligne par élément d'un tableau ou d'un objet |\n\nAuto Loader et `read_files` peuvent produire une colonne VARIANT directement (option `singleVariantColumn`).\n\n### Pièges d'examen\n\n- JSON dont la structure change souvent, requêtes rapides : VARIANT plutôt que STRING ou un STRUCT figé.\n- Un champ mal typé ne doit pas faire échouer la requête : `try_variant_get` ou `try_cast`.\n- `:` fonctionne sur VARIANT comme sur une STRING JSON, mais VARIANT évite de reparser le texte à chaque requête.", "kw": ["variant", "parse_json", "json"], "pre": ["dea-ing-6"]}, {"id": "dep-manip-3", "t": "Fonctions d'IA dans les pipelines", "md": "Source : [fonctions d'IA](https://docs.databricks.com/aws/en/large-language-models/ai-functions).\n\nLes fonctions d'IA appellent un modèle depuis le SQL ou PySpark, ligne par ligne, sur des tables entières, en batch ou dans un pipeline.\n\n| Fonction | Usage |\n| --- | --- |\n| `ai_query(endpoint, prompt)` | Appeler n'importe quel endpoint de Model Serving (modèle de fondation, modèle maison), avec `responseFormat` pour une sortie structurée |\n| `ai_classify(texte, ARRAY('a','b'))` | Classer dans des catégories données |\n| `ai_extract(texte, ARRAY('nom','ville'))` | Extraire des entités |\n| `ai_sentiment`, `ai_summarize`, `ai_translate`, `ai_mask` | Tâches courantes prêtes à l'emploi |\n\n```sql\nCREATE OR REPLACE MATERIALIZED VIEW gold.avis_enrichis AS\nSELECT avis_id, texte,\n  ai_classify(texte, ARRAY('livraison','qualité','prix','service')) AS theme,\n  ai_query('databricks-meta-llama-3-3-70b-instruct',\n           CONCAT('Résume en une phrase : ', texte))               AS resume\nFROM silver.avis;\n```\n\n- Pour de gros volumes, on lance ces fonctions en **batch** (job ou pipeline). Databricks parallélise les appels.\n- On stocke le résultat dans une table pour ne pas repayer l'inférence à chaque lecture.\n- Un modèle MLflow enregistré dans Unity Catalog s'applique aussi en batch avec `mlflow.pyfunc.spark_udf`.\n\n### Pièges d'examen\n\n- Enrichir ou classer du texte dans un pipeline SQL : `ai_query`, ou une fonction dédiée comme `ai_classify`.\n- Sortie structurée exploitable : `responseFormat` dans `ai_query`.\n- Ne pas recalculer l'inférence à chaque requête : matérialiser le résultat.", "kw": ["ai_query", "ai_", "model", "mlflow", "llm"], "pre": []}, {"id": "dep-manip-4", "t": "Expectations : quarantaine, rejet ou arrêt", "md": "Source : [expectations](https://docs.databricks.com/aws/en/dlt/expectations).\n\n| Action | SQL | Python | Ligne non conforme |\n| --- | --- | --- | --- |\n| Signaler | `EXPECT (cond)` | `@dp.expect` | Gardée, comptée |\n| Rejeter | `... ON VIOLATION DROP ROW` | `@dp.expect_or_drop` | Supprimée, comptée |\n| Arrêter | `... ON VIOLATION FAIL UPDATE` | `@dp.expect_or_fail` | La mise à jour échoue |\n\n### Le motif de quarantaine\n\nPlutôt que de perdre les lignes rejetées, on les oriente vers une table de quarantaine avec la règle inverse, à partir d'un dictionnaire de règles partagé :\n\n```python\nregles = {\"id_present\": \"order_id IS NOT NULL\", \"montant_positif\": \"amount >= 0\"}\ntoutes = \" AND \".join(f\"({r})\" for r in regles.values())\n\n@dp.table\n@dp.expect_all_or_drop(regles)\ndef silver_orders():\n    return spark.readStream.table(\"bronze_orders\")\n\n@dp.table\ndef quarantine_orders():\n    return spark.readStream.table(\"bronze_orders\").where(f\"NOT ({toutes})\")\n```\n\nVariante : une seule table avec une colonne `is_quarantined` calculée, puis deux vues filtrées.\n\n### Mesurer la qualité\n\nLes métriques de chaque expectation (lignes passées, rejetées) sont dans l'**event log** du pipeline, événements `flow_progress`, champ `details:flow_progress.data_quality.expectations`.\n\n### Pièges d'examen\n\n- Garder les lignes invalides pour analyse sans polluer la silver : table de quarantaine.\n- Une règle critique doit bloquer la publication : `expect_or_fail`.\n- Appliquer les mêmes règles à plusieurs tables : dictionnaire de règles et `expect_all_*`.\n- Vérifier qu'aucune ligne n'a été perdue entre deux tables : une expectation sur une vue qui compare les comptes ou fait une jointure externe.", "kw": ["expect", "quarantin", "quality", "constraint", "check"], "pre": ["dea-trans-7"]}]}, {"u": "mon", "t": "Supervision & alertes", "w": 10, "lessons": [{"id": "dep-mon-1", "t": "Tables système", "md": "Source : [tables système](https://docs.databricks.com/aws/en/admin/system-tables/).\n\nLes tables système sont des tables Delta en lecture seule, gérées par Databricks dans le catalogue `system`. Elles couvrent **tout le compte**, tous workspaces confondus, et s'interrogent en SQL.\n\n| Schéma | Tables utiles | Questions typiques |\n| --- | --- | --- |\n| `system.billing` | `usage`, `list_prices` | Combien coûte ce job ? Quelle consommation par SKU, par tag, par équipe ? |\n| `system.access` | `audit`, `table_lineage`, `column_lineage` | Qui a lu cette table ? Qui a changé ce droit ? |\n| `system.compute` | `clusters`, `node_timeline`, `warehouse_events` | Quels clusters tournent, avec quelle utilisation CPU et mémoire ? |\n| `system.lakeflow` | `jobs`, `job_run_timeline`, `job_task_run_timeline`, `pipelines` | Quels jobs échouent, combien durent leurs exécutions ? |\n| `system.query` | `history` | Quelles requêtes SQL sont lentes ou coûteuses ? |\n| `system.storage` | `predictive_optimization_operations_history` | Quelle maintenance a été faite ? |\n\n```sql\n-- coût des 30 derniers jours par job\nSELECT u.usage_metadata.job_id, j.name,\n       SUM(u.usage_quantity * p.pricing.default) AS cout_estime\nFROM system.billing.usage u\nJOIN system.billing.list_prices p\n  ON u.sku_name = p.sku_name AND u.usage_start_time >= p.price_start_time\n     AND (p.price_end_time IS NULL OR u.usage_start_time < p.price_end_time)\nLEFT JOIN system.lakeflow.jobs j ON u.usage_metadata.job_id = j.job_id\nWHERE u.usage_date >= current_date() - 30 AND u.usage_metadata.job_id IS NOT NULL\nGROUP BY ALL ORDER BY cout_estime DESC;\n```\n\n- Les tables système s'activent par schéma et se lisent avec des droits accordés par un administrateur du metastore.\n- Les **tags** posés sur les clusters, jobs et warehouses remontent dans `usage.custom_tags` : c'est la base de la refacturation par équipe.\n\n### Pièges d'examen\n\n- Coût par SKU sur tous les workspaces : `system.billing.usage` (avec `list_prices` pour les montants).\n- Qui a accédé à une table : `system.access.audit`.\n- Durée et statut des exécutions de jobs sur tout le compte : `system.lakeflow.job_run_timeline`.", "kw": ["system.", "billing", "audit", "usage"], "pre": ["dea-ops-1"]}, {"id": "dep-mon-2", "t": "API REST, CLI et SDK", "md": "Source : [SDK Python](https://docs.databricks.com/aws/en/dev-tools/sdk-python), [API Jobs](https://docs.databricks.com/api/workspace/jobs).\n\n```python\nfrom databricks.sdk import WorkspaceClient\nw = WorkspaceClient()                       # authentification par profil ou variables d'environnement\n\nfor run in w.jobs.list_runs(job_id=123, limit=20):\n    duree = (run.end_time - run.start_time) / 1000 if run.end_time else None\n    print(run.run_id, run.state.result_state, duree)\n\nw.jobs.run_now(job_id=123, job_parameters={\"date\": \"2026-10-30\"})\n```\n\n```bash\ndatabricks jobs list-runs --job-id 123 --output json\ndatabricks pipelines get-update <pipeline-id> <update-id>\n```\n\n| Outil | Usage |\n| --- | --- |\n| API REST | Intégration avec un orchestrateur ou un outil de supervision externe |\n| CLI | Scripts, CI/CD, actions ponctuelles |\n| SDK Python | Scripts de supervision, automatisation dans un notebook ou un service |\n| Interface Lakeflow Jobs | Historique des exécutions, matrice des tâches, durée, métriques |\n\n### Pièges d'examen\n\n- Superviser les jobs depuis un outil externe : API REST Jobs (`runs/list`, `runs/get`).\n- Automatiser en Python sans gérer l'authentification HTTP : SDK Databricks.\n- Le statut d'une exécution se lit dans `state.life_cycle_state` et `state.result_state`.", "kw": ["rest api", "api", "cli", "sdk"], "pre": []}, {"id": "dep-mon-3", "t": "Event log des pipelines", "md": "Source : [event log](https://docs.databricks.com/aws/en/dlt/observability).\n\nChaque pipeline déclaratif écrit un **event log** : démarrages, mises à jour, progression de chaque flux, qualité des données, lignage, erreurs.\n\n```sql\nSELECT timestamp, details:flow_progress.metrics.num_output_rows AS lignes,\n       details:flow_progress.data_quality.expectations          AS qualite\nFROM event_log('<pipeline-id>')            -- ou event_log(TABLE main.silver.orders)\nWHERE event_type = 'flow_progress'\nORDER BY timestamp DESC;\n```\n\n| `event_type` | Contenu |\n| --- | --- |\n| `flow_progress` | Lignes écrites, métriques des expectations, backlog |\n| `update_progress` | État de la mise à jour (RUNNING, COMPLETED, FAILED) |\n| `flow_definition` | Schéma et lignage des tables |\n| `cluster_resources` | Autoscaling du calcul |\n\nOn peut publier l'event log dans une table Unity Catalog pour le requêter ou bâtir un tableau de bord de qualité.\n\n### Pièges d'examen\n\n- Combien de lignes ont été rejetées par chaque expectation : event log, `flow_progress`.\n- Construire un tableau de bord de qualité : requêtes sur l'event log, puis alertes.", "kw": ["event log", "event_log"], "pre": ["dea-trans-7"]}, {"id": "dep-mon-4", "t": "Alertes", "md": "Source : [alertes Databricks SQL](https://docs.databricks.com/aws/en/sql/user/alerts/).\n\nUne **alerte** exécute une requête SQL selon un planning, compare le résultat à une condition, et notifie une **destination** : e-mail, Slack, Teams, PagerDuty ou webhook.\n\n```sql\n-- requête de l'alerte : lignes en quarantaine sur la dernière heure\nSELECT count(*) AS nb_quarantaine\nFROM main.silver.quarantine_orders\nWHERE _ingest_ts >= now() - INTERVAL 1 HOUR;\n-- condition : nb_quarantaine > 100\n```\n\nLe guide liste ce que les alertes doivent surveiller :\n\n| Domaine | Source de la requête |\n| --- | --- |\n| Métriques métier gouvernées | Tables gold ou metric views |\n| Qualité et anomalies | Event log, tables de quarantaine, monitoring de la qualité des données (profil et dérive) |\n| Usage et coût | `system.billing.usage` |\n| Santé des SQL warehouses et des requêtes | `system.query.history`, `system.compute` |\n| Audit et sécurité | `system.access.audit` |\n| Qualité des agents d'IA | Tables d'évaluation et de monitoring des agents |\n| Branchement des jobs | Une tâche d'alerte SQL dans un job, dont le résultat oriente une condition If/else |\n\nLes notifications de **job** (échec, durée dépassée, succès) se règlent séparément, sur le job ou la tâche.\n\n### Pièges d'examen\n\n- Être prévenu quand un indicateur calculé en SQL dépasse un seuil : alerte sur une requête.\n- Notifier un outil interne : destination webhook.\n- Être prévenu d'un job anormalement long : seuil de durée dans les notifications du job.", "kw": ["alert", "notification", "webhook", "monitor"], "pre": ["dea-jobs-2"]}]}, {"u": "perf", "t": "Coûts & performance", "w": 15, "lessons": [{"id": "dep-perf-1", "t": "Tables managed, predictive optimization et Liquid Clustering", "md": "Sources : [liquid clustering](https://docs.databricks.com/aws/delta/clustering), [predictive optimization](https://docs.databricks.com/aws/en/optimizations/predictive-optimization).\n\nLe guide insiste sur la **réduction de la maintenance** : avec des tables managed Unity Catalog, Databricks prend en charge ce qu'on planifiait à la main.\n\n| Mécanisme | Ce qu'il supprime comme travail manuel |\n| --- | --- |\n| Table **managed** | Gestion des chemins et du cycle de vie des fichiers |\n| **Predictive optimization** | Jobs `OPTIMIZE`, `VACUUM` et `ANALYZE` planifiés à la main |\n| **Liquid Clustering** | Choix et maintenance des partitions et du Z-order |\n| **`CLUSTER BY AUTO`** | Choix des clés de clustering, déduit des requêtes |\n\n### Liquid Clustering, partitionnement ou Z-order\n\n| | Partitionnement | Z-order | Liquid Clustering |\n| --- | --- | --- | --- |\n| Principe | Un dossier par valeur | Réécriture qui co-localise plusieurs colonnes | Clustering incrémental sur jusqu'à 4 clés |\n| Changer de clés | Réécrire toute la table | Relancer un `OPTIMIZE ZORDER BY` complet | `ALTER TABLE ... CLUSTER BY`, sans réécriture immédiate |\n| Bon cas | Très grosses tables (plus de 1 To), colonne à faible cardinalité, partitions d'au moins 1 Go | Ancien standard, remplacé | Recommandé pour toute nouvelle table |\n| Risque | Petits fichiers si la cardinalité est forte | Coût de réécriture élevé | Incompatible avec partitionnement et Z-order |\n\nPour une table de moins de 1 To, on ne partitionne pas : Liquid Clustering, ou rien.\n\n### Pièges d'examen\n\n- Table de 200 Go partitionnée par `customer_id` : trop de partitions, passer au Liquid Clustering.\n- Plus de jobs `OPTIMIZE` et `VACUUM` à maintenir : predictive optimization sur des tables managed.\n- Les filtres changent souvent : Liquid Clustering, dont les clés se modifient sans réécriture.", "kw": ["liquid", "predictive", "partition", "zorder", "z-order", "managed"], "pre": ["dea-ops-3"]}, {"id": "dep-perf-2", "t": "Deletion vectors, CLUSTER BY AUTO et cache disque", "md": "Sources : [deletion vectors](https://docs.databricks.com/aws/en/delta/deletion-vectors), [cache disque](https://docs.databricks.com/aws/en/optimizations/disk-cache).\n\n### Choisir l'optimisation selon l'usage\n\n| Profil d'accès | Optimisation |\n| --- | --- |\n| Beaucoup de `DELETE`, `UPDATE`, `MERGE` ponctuels | **Deletion vectors** : les lignes sont marquées supprimées sans réécrire le fichier |\n| Filtres connus et stables | Liquid Clustering sur ces colonnes |\n| Filtres variés ou mal connus, table managed | `CLUSTER BY AUTO` |\n| Mêmes données relues souvent | Cache disque, activé par défaut sur les instances adaptées |\n\n### Deletion vectors\n\nAvec les deletion vectors, un `DELETE` écrit un petit fichier qui liste les lignes supprimées, au lieu de réécrire tout le fichier Parquet. Les écritures sont beaucoup plus rapides, la lecture filtre ces lignes à la volée. Les fichiers sont réécrits plus tard par `OPTIMIZE`, ou explicitement par `REORG TABLE t APPLY (PURGE)`.\n\nConséquence pour la conformité : après un `DELETE`, la donnée est encore **physiquement présente** jusqu'à la purge et au `VACUUM` (voir la leçon sur la purge RGPD).\n\n### Cache disque (ex-Delta cache)\n\nLe cache disque copie les fichiers Parquet lus sur les **SSD locaux** des nœuds, dans un format optimisé. Les lectures suivantes des mêmes données ne repassent pas par le stockage cloud. Il est automatique et cohérent : un fichier modifié est relu. À ne pas confondre avec `df.cache()`, qui garde un DataFrame en mémoire Spark pour la session.\n\n### Pièges d'examen\n\n- MERGE fréquents qui réécrivent beaucoup de fichiers : activer les deletion vectors.\n- Requêtes répétées sur les mêmes données, cluster avec SSD : le cache disque accélère sans code.\n- Supprimer physiquement les lignes marquées : `REORG TABLE ... APPLY (PURGE)` puis `VACUUM`.", "kw": ["deletion vector", "cluster by auto", "cache"], "pre": ["dea-plat-2"]}, {"id": "dep-perf-3", "t": "Change Data Feed", "md": "Source : [Change Data Feed](https://docs.databricks.com/aws/en/delta/delta-change-data-feed).\n\nLe Change Data Feed (CDF) enregistre les changements **ligne par ligne** d'une table Delta, pour propager vers l'aval seulement ce qui a changé.\n\n```sql\nALTER TABLE silver.clients SET TBLPROPERTIES (delta.enableChangeDataFeed = true);\n\nSELECT * FROM table_changes('silver.clients', 12);      -- depuis la version 12\n```\n\n```python\n(spark.readStream\n   .option(\"readChangeFeed\", \"true\")\n   .option(\"startingVersion\", 12)\n   .table(\"silver.clients\"))\n```\n\n| `_change_type` | Signification |\n| --- | --- |\n| `insert` | Ligne ajoutée |\n| `update_preimage` | Valeur avant la mise à jour |\n| `update_postimage` | Valeur après la mise à jour |\n| `delete` | Ligne supprimée |\n\nChaque ligne porte aussi `_commit_version` et `_commit_timestamp`. Le CDF ne capture que les changements **après** son activation, et ses fichiers sont soumis au `VACUUM` comme les autres.\n\n### Pièges d'examen\n\n- Propager les UPDATE et DELETE d'une silver vers une gold : lire le CDF, appliquer un MERGE ou AUTO CDC.\n- Une mise à jour produit deux lignes : `update_preimage` et `update_postimage`.\n- Le CDF ne remonte pas avant son activation.\n- Le CDF garde des copies des lignes supprimées : à purger aussi pour le RGPD.", "kw": ["change data feed", "readchangefeed", "table_changes", "cdf", "_change_type"], "pre": ["dea-trans-4"]}, {"id": "dep-perf-4", "t": "Lire le query profile", "md": "Source : [query profile](https://docs.databricks.com/aws/en/sql/user/queries/query-profile).\n\nLe **query profile** s'ouvre depuis l'historique des requêtes (SQL warehouse, notebook ou job). Il montre le plan exécuté, opérateur par opérateur, avec le temps, les lignes et les octets.\n\n| Ce qu'on cherche | Indicateur | Correctif |\n| --- | --- | --- |\n| Data skipping inefficace | *Files read* proche de *files total*, beaucoup d'octets lus pour peu de lignes gardées | Clustering sur les colonnes filtrées, statistiques à jour, filtres sur des colonnes clusterées |\n| Mauvaise stratégie de jointure | Sort-merge join sur une petite table, ou explosion du nombre de lignes après jointure | Broadcast, condition de jointure corrigée |\n| Shuffle coûteux | Gros volumes en *shuffle write/read* entre étapes | Filtrer plus tôt, broadcast, revoir l'agrégation |\n| Spill | Octets déversés sur disque | Plus de mémoire, partitions plus petites |\n| Asymétrie | Une tâche beaucoup plus longue que les autres | AQE skew join, autre clé |\n\nLes opérateurs les plus coûteux sont signalés en haut du profil. Le Spark UI donne le même diagnostic côté stages et tâches.\n\n### Pièges d'examen\n\n- Requête qui lit tous les fichiers malgré un filtre : data skipping inefficace, revoir le clustering.\n- Jointure lente avec une table de 5 Mo : forcer le broadcast.\n- Trouver l'étape la plus coûteuse d'une requête SQL : query profile.", "kw": ["query profile", "skip", "join", "shuffle", "spark ui", "spill", "skew"], "pre": ["dea-ops-2", "dea-trans-5"]}]}, {"u": "sec", "t": "Sécurité & conformité", "w": 8, "lessons": [{"id": "dep-sec-1", "t": "Moindre privilège et ABAC", "md": "Sources : [privilèges](https://docs.databricks.com/aws/en/data-governance/unity-catalog/manage-privileges/privileges), [ABAC](https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/policies).\n\n### Le moindre privilège\n\n- Accorder à des **groupes**, jamais à des individus, et faire tourner la production sous un **service principal**.\n- Accorder au niveau le plus bas suffisant : `SELECT` sur une table plutôt que sur le schéma si un seul objet est nécessaire.\n- Séparer lecture et écriture : `SELECT` pour les consommateurs, `MODIFY` seulement pour le pipeline qui écrit.\n- Déléguer l'administration d'un schéma avec `MANAGE`, sans transférer la propriété ni donner `ALL PRIVILEGES`.\n- Les ressources du workspace (jobs, pipelines, notebooks, warehouses, secrets) ont leurs propres ACL : `CAN VIEW`, `CAN RUN`, `CAN MANAGE`, `CAN USE`, `READ` sur un scope de secrets.\n\n### ABAC à l'échelle\n\nLes politiques ABAC appliquent un filtre ou un masque à **toutes les tables qui portent un tag**, dans un catalogue ou un schéma, y compris les tables futures :\n\n```sql\nCREATE POLICY masquer_emails ON CATALOG prod\nCOLUMN MASK main.secu.mask_email\nTO `account users` EXCEPT `dpo`\nFOR TABLES\nMATCH COLUMNS has_tag_value('pii', 'email') AS c\nON COLUMN c;\n```\n\n| Approche | Portée | Maintenance |\n| --- | --- | --- |\n| Vue dynamique | Une vue | Une vue par table, à garder synchronisée |\n| Filtre ou masque par table | Une table | Une commande par table et par colonne |\n| Politique ABAC | Toutes les tables taguées d'un catalogue ou d'un schéma | Une politique, il suffit de taguer |\n\n### Pièges d'examen\n\n- Protéger des centaines de colonnes PII, nouvelles tables comprises : ABAC avec governed tags.\n- Un job de production qui tourne avec le compte d'un développeur : passer à un service principal.\n- Lire un secret sans pouvoir le modifier : `READ` sur le scope.", "kw": ["grant", "privilege", "service principal", "acl", "abac", "least"], "pre": ["dea-gov-2", "dea-gov-4"]}, {"id": "dep-sec-2", "t": "Anonymisation, pseudonymisation et détection des PII", "md": "Source : [masques de colonnes](https://docs.databricks.com/aws/en/tables/row-and-column-filters).\n\n| Méthode | Principe | Réversible ? | Exemple |\n| --- | --- | --- | --- |\n| **Hachage** | Fonction à sens unique, idéalement avec un sel secret | Non, mais une même valeur donne le même hash, ce qui permet les jointures | `sha2(concat(email, secret('cle','sel')), 256)` |\n| **Tokenisation** | Remplacer par un jeton, table de correspondance protégée à part | Oui, pour qui accède à la table de correspondance | `client_id` vers `tok_8f2a` |\n| **Suppression** | Retirer ou vider la valeur | Non | `NULL`, `'***'` |\n| **Généralisation** | Réduire la précision | Non | Date de naissance vers tranche d'âge, code postal vers département |\n\nLa **pseudonymisation** (hachage, tokenisation) garde la possibilité de relier les données d'une même personne : la donnée reste personnelle au sens du RGPD. L'**anonymisation** (suppression, généralisation, agrégation) rend la réidentification impossible.\n\n```sql\nCREATE FUNCTION main.secu.pseudo_email(email STRING)\nRETURN CASE WHEN is_account_group_member('dpo') THEN email\n            ELSE sha2(concat(lower(email), secret('pii', 'sel')), 256) END;\n\nALTER TABLE main.silver.clients ALTER COLUMN email SET MASK main.secu.pseudo_email;\n```\n\n### Un pipeline conforme\n\n1. **Détecter** : la classification automatique de Unity Catalog (*data classification*) repère les colonnes sensibles et propose des tags. `ai_classify` ou des expressions régulières complètent pour du texte libre.\n2. **Taguer** les colonnes (`pii = email`, `pii = telephone`).\n3. **Masquer** par une politique ABAC sur ces tags, qui s'applique en batch comme en streaming car le masque s'évalue à la lecture.\n4. Pour du texte libre, masquer dès l'ingestion avec `ai_mask` ou des expressions régulières avant d'écrire la silver.\n\n### Pièges d'examen\n\n- Garder la possibilité de joindre deux tables sur l'email sans l'exposer : hachage salé, toujours le même.\n- Retrouver la valeur d'origine pour un service autorisé : tokenisation.\n- Un hash sans sel d'un email se casse facilement par dictionnaire.", "kw": ["hash", "mask", "pii", "pseudonym", "anonymi", "token"], "pre": ["dea-gov-3"]}, {"id": "dep-sec-3", "t": "Purge RGPD : droit à l'effacement", "md": "Source : [RGPD avec Delta Lake](https://docs.databricks.com/aws/en/security/privacy/gdpr-delta).\n\nSupprimer une personne d'une table Delta demande **trois étapes**, car `DELETE` seul ne retire pas les fichiers :\n\n```sql\n-- 1. supprimer logiquement, idéalement à partir d'une table de demandes\nDELETE FROM main.silver.clients\nWHERE client_id IN (SELECT client_id FROM main.gdpr.demandes_effacement);\n\n-- 2. si les deletion vectors sont actifs, réécrire les fichiers concernés\nREORG TABLE main.silver.clients APPLY (PURGE);\n\n-- 3. supprimer physiquement les anciens fichiers, après la rétention\nVACUUM main.silver.clients;            -- 7 jours par défaut\n```\n\n- Tant que le `VACUUM` n'est pas passé, l'ancienne version reste lisible par **time travel**.\n- La suppression doit être propagée à **toutes les copies** : bronze, silver, gold, tables dérivées, Change Data Feed, et tables partagées.\n- Une bonne pratique : isoler les données personnelles dans une table de référence pseudonymisée. Effacer la ligne de correspondance suffit alors à rendre les autres tables anonymes.\n- Dans un pipeline en streaming, une suppression en amont casse les flux qui lisent la table : `skipChangeCommits`, ou lecture du CDF pour propager les suppressions.\n- Réduire `delta.deletedFileRetentionDuration` raccourcit le délai d'effacement, mais aussi la fenêtre de time travel.\n\n### Pièges d'examen\n\n- Après un `DELETE`, les données sont encore lisibles en time travel : il manque le `VACUUM`.\n- Deletion vectors actifs : `REORG TABLE ... APPLY (PURGE)` avant le `VACUUM`.\n- Effacer une personne dans toute la chaîne : propager la suppression du bronze au gold, CDF compris.", "kw": ["gdpr", "delete", "vacuum", "purge", "erasure", "forgotten", "retention"], "pre": ["dea-plat-2"]}]}, {"u": "gov", "t": "Gouvernance des données", "w": 5, "lessons": [{"id": "dep-gov-1", "t": "Tags, commentaires et héritage des permissions", "md": "Sources : [tags](https://docs.databricks.com/aws/en/database-objects/tags), [privilèges](https://docs.databricks.com/aws/en/data-governance/unity-catalog/manage-privileges/).\n\n### Tags et commentaires\n\nLes **commentaires** décrivent un objet ou une colonne en langage naturel. Les **tags** sont des paires clé-valeur qui le classent. Les deux alimentent la recherche dans Catalog Explorer, Genie et l'assistant.\n\n```sql\nCOMMENT ON TABLE main.gold.ventes IS 'Ventes quotidiennes par magasin, source ERP';\nALTER TABLE main.gold.ventes ALTER COLUMN email COMMENT 'Email client, donnée personnelle';\n\nALTER TABLE main.gold.ventes SET TAGS ('domaine' = 'commerce', 'certifie' = 'oui');\nALTER TABLE main.gold.ventes ALTER COLUMN email SET TAGS ('pii' = 'email');\n\nSELECT * FROM system.information_schema.column_tags WHERE tag_name = 'pii';\n```\n\n- Les **governed tags** sont définis au niveau du compte, avec des valeurs autorisées et des droits sur qui peut les poser. Ce sont eux qu'utilisent les politiques ABAC.\n- Les tables `information_schema.table_tags` et `column_tags` permettent d'inventorier les objets tagués.\n\n### L'héritage des permissions\n\n```text\nmetastore\n└── catalogue        GRANT SELECT ON CATALOG prod → toutes les tables de tous ses schémas\n    └── schéma       GRANT SELECT ON SCHEMA prod.ventes → toutes ses tables, présentes et futures\n        └── table, vue, volume, fonction\n```\n\n- Un privilège accordé sur un conteneur **descend** sur tout ce qu'il contient, y compris les objets créés plus tard.\n- Pour accéder à un objet, il faut aussi pouvoir traverser ses parents : `USE CATALOG` et `USE SCHEMA`.\n- Le **propriétaire** d'un objet a tous les droits dessus. Le propriétaire d'un schéma peut gérer les droits de tout ce qu'il contient.\n- `BROWSE` sur un catalogue permet de voir les métadonnées de ses objets sans lire les données, utile pour la découverte.\n- On ne peut pas retirer à un niveau inférieur un droit hérité : un `REVOKE` sur la table ne change rien à un `SELECT` accordé sur le schéma.\n\n### Pièges d'examen\n\n- Donner la lecture de toutes les tables d'un schéma, futures comprises : `GRANT SELECT ON SCHEMA`.\n- `REVOKE SELECT` sur une table sans effet : le droit vient du schéma ou du catalogue.\n- Rendre une table trouvable par la recherche : commentaires et tags.\n- Inventorier toutes les colonnes PII : `information_schema.column_tags`.", "kw": ["tag", "comment", "inherit", "owner", "grant", "catalog", "lineage"], "pre": ["dea-gov-2"]}]}, {"u": "ops", "t": "Débogage & déploiement", "w": 10, "lessons": [{"id": "dep-ops-1", "t": "Trouver la cause d'une erreur", "md": "Sources : [dépannage du calcul](https://docs.databricks.com/aws/en/compute/troubleshooting/), [Spark UI](https://docs.databricks.com/aws/en/optimizations/spark-ui-guide/).\n\n| Source | Ce qu'elle apporte |\n| --- | --- |\n| Sortie de la tâche et trace d'erreur | Première lecture : exception, ligne de code |\n| **Spark UI** | Stage et tâches en échec, skew, spill, erreurs d'exécuteurs |\n| **Logs du cluster** : driver (stdout, stderr, log4j), event log | OOM du driver, échec d'un script d'initialisation, perte d'un nœud |\n| **Tables système** | Historique des exécutions, consommation, requêtes, audit |\n| **Query profile** | Opérateur SQL le plus coûteux |\n\n| Symptôme | Où regarder | Cause probable |\n| --- | --- | --- |\n| `OutOfMemoryError` sur le driver | Logs du driver | `collect()`, `toPandas()`, broadcast trop gros |\n| `ExecutorLostFailure`, conteneur tué | Spark UI, event log du cluster | Mémoire exécuteur, skew, spill extrême |\n| Le cluster ne démarre pas | Event log du cluster | Quota cloud, script d'init, réseau |\n| `ModuleNotFoundError` | Sortie de la tâche | Dépendance absente de l'environnement |\n| `AnalysisException` | Sortie de la tâche | Table ou colonne introuvable, droits manquants |\n\nLes logs des clusters de jobs disparaissent avec le cluster : configurer la **livraison des logs** vers un volume ou un stockage cloud pour les garder.\n\n### Pièges d'examen\n\n- Diagnostiquer un échec d'un cluster de job déjà terminé : logs livrés dans un volume, ou event log du cluster.\n- Une seule tâche très longue dans un stage : skew, visible dans le Spark UI.", "kw": ["spark ui", "log", "error", "exception", "fail", "debug"], "pre": ["dea-ops-4"]}, {"id": "dep-ops-2", "t": "Réparer une exécution et surcharger les paramètres", "md": "Source : [repair run](https://docs.databricks.com/aws/en/jobs/repair-job-failures).\n\n- **Repair run** relance uniquement les tâches en échec et leurs dépendantes. Les tâches réussies ne sont pas rejouées.\n- La réparation utilise la **définition actuelle** du job : un notebook corrigé, une taille de cluster modifiée sont pris en compte.\n- On peut **surcharger les paramètres** pour la réparation, par exemple corriger une date mal passée : interface (*Repair run* puis *Parameters*), API `POST /api/2.2/jobs/runs/repair` avec `job_parameters`, ou CLI `databricks jobs repair-run`.\n- Le même principe s'applique au lancement : *Run now with different parameters*, ou `run-now` avec `job_parameters`.\n\n```bash\ndatabricks jobs repair-run 987654 --rerun-all-failed-tasks --json '{\"job_parameters\": {\"date\": \"2026-10-29\"}}'\n```\n\n### Pièges d'examen\n\n- Ne rejouer que ce qui a échoué après une correction : Repair run.\n- Rejouer une journée avec une autre date sans modifier le job : surcharge de paramètres.\n- La réparation prend le code actuel, pas celui de l'exécution d'origine.", "kw": ["repair", "parameter", "rerun"], "pre": ["dea-jobs-2"]}, {"id": "dep-ops-3", "t": "Déployer : bundles et Git folders", "md": "Sources : [bundles](https://docs.databricks.com/aws/en/dev-tools/bundles/), [Git folders et CI/CD](https://docs.databricks.com/aws/en/repos/ci-cd-techniques-with-repos).\n\n### Le flux CI/CD type\n\n1. Chaque développeur travaille sur une **branche** dans son Git folder, et déploie sa copie avec `databricks bundle deploy -t dev` (mode development).\n2. La **pull request** déclenche la CI : tests unitaires, `bundle validate`, déploiement sur la target de test, tests d'intégration.\n3. À la fusion dans `main`, la CD déploie en prod : `databricks bundle deploy -t prod`, sous un **service principal**.\n\n```yaml\ntargets:\n  prod:\n    mode: production\n    workspace:\n      host: https://prod.cloud.databricks.com\n      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}\n    run_as:\n      service_principal_name: sp-etl-prod\n    permissions:\n      - group_name: data-engineers\n        level: CAN_VIEW\n```\n\n### Git folders en production\n\nUne alternative plus simple aux bundles : un **Git folder de production**, mis à jour par la CI avec l'API Repos (`PATCH /api/2.0/repos/{id}` sur la branche de release), et des jobs qui pointent vers ce dossier ou directement vers le dépôt Git (source *Git provider* de la tâche). Les bundles restent recommandés dès qu'il faut déployer aussi les jobs et pipelines eux-mêmes.\n\n### Pièges d'examen\n\n- Déployer code, jobs et pipelines ensemble sur plusieurs environnements : bundles.\n- La prod ne doit pas tourner sous l'identité d'un développeur : `run_as` avec un service principal.\n- Mettre à jour un Git folder partagé depuis la CI : API Repos, pas un pull manuel.", "kw": ["bundle", "git", "repo", "deploy", "ci/cd", "cli"], "pre": ["dea-cicd-1", "dea-cicd-2"]}]}, {"u": "model", "t": "Modélisation des données", "w": 5, "lessons": [{"id": "dep-model-1", "t": "Dessiner la disposition physique des tables", "md": "Source : [bonnes pratiques Delta](https://docs.databricks.com/aws/en/delta/best-practices).\n\nTrois leviers, à aligner sur la façon dont la table est écrite et lue :\n\n| Levier | Règle | Exemple |\n| --- | --- | --- |\n| **Partitionnement** | Seulement pour les très grosses tables, sur une colonne de faible cardinalité alignée sur le **grain** des données et des suppressions | Table d'événements de 50 To partitionnée par `event_date`, purgée jour par jour |\n| **Clustering** | Sur les colonnes des filtres et jointures les plus fréquents | `CLUSTER BY (customer_id, event_date)` |\n| **Compaction** | Viser des fichiers de taille équilibrée, de l'ordre de 100 Mo à 1 Go | `OPTIMIZE`, auto-compaction et écritures optimisées, ou predictive optimization |\n\n- Trop de partitions crée des **petits fichiers**, qui ralentissent tout : une partition doit contenir au moins 1 Go.\n- **Auto-compaction** et **optimized writes** (`delta.autoOptimize.*`) limitent les petits fichiers dès l'écriture, utiles pour les flux et les MERGE fréquents.\n- Les mêmes principes s'appliquent aux tables Iceberg managées, avec Liquid Clustering.\n\n### Pièges d'examen\n\n- Table de 300 Go partitionnée par un identifiant client : mauvaise idée, Liquid Clustering à la place.\n- Beaucoup de petits fichiers après des écritures en streaming : auto-compaction, ou `OPTIMIZE` régulier.\n- Purger par mois facilement sur une table énorme : partition alignée sur ce grain.", "kw": ["partition", "cluster", "compaction", "optimize", "small files", "file size"], "pre": ["dea-ops-3"]}, {"id": "dep-model-2", "t": "Modèle dimensionnel, materialized views et metric views", "md": "Sources : [materialized views](https://docs.databricks.com/aws/en/views/materialized), [metric views](https://docs.databricks.com/aws/en/metric-views/create/sql).\n\n### Le modèle en étoile en gold\n\n- **Tables de faits** : les événements mesurables (ventes, clics), avec des clés vers les dimensions et des mesures numériques.\n- **Dimensions** : les axes d'analyse (client, produit, date), souvent en SCD type 2 pour garder l'historique.\n- Clés de substitution avec `GENERATED ALWAYS AS IDENTITY`. Les contraintes `PRIMARY KEY` et `FOREIGN KEY` sont informatives : elles documentent et aident l'optimiseur avec `RELY`, sans être vérifiées.\n\n### Materialized views pour les agrégats\n\nUne materialized view précalcule une agrégation et se rafraîchit, de façon incrémentale quand c'est possible. Les tableaux de bord lisent le résultat au lieu de recalculer sur les faits.\n\n### Metric views pour des définitions partagées\n\nUne **metric view** Unity Catalog définit **une fois** les mesures et les dimensions d'un sujet. Tous les outils (SQL, tableaux de bord, Genie) utilisent alors la même définition du chiffre d'affaires ou du panier moyen.\n\n```sql\nCREATE OR REPLACE VIEW main.gold.ventes_metrics WITH METRICS LANGUAGE YAML AS\n$$\n  version: 1.1\n  source: main.gold.fait_ventes\n  dimensions:\n    - name: Mois\n      expr: date_trunc('MONTH', date_vente)\n    - name: Région\n      expr: region\n  measures:\n    - name: Chiffre d'affaires\n      expr: SUM(montant)\n    - name: Panier moyen\n      expr: SUM(montant) / COUNT(DISTINCT commande_id)\n$$;\n\nSELECT `Mois`, MEASURE(`Chiffre d'affaires`) FROM main.gold.ventes_metrics GROUP BY ALL;\n```\n\n| | Materialized view | Metric view |\n| --- | --- | --- |\n| Rôle | Stocker un résultat précalculé | Définir des mesures réutilisables et gouvernées |\n| Calcul | Au rafraîchissement | À la requête, selon les dimensions demandées |\n| Atout | Performance | Cohérence : une seule définition de chaque indicateur |\n\n### Pièges d'examen\n\n- Agrégat lourd lu par de nombreux tableaux de bord : materialized view.\n- Toutes les équipes doivent calculer le chiffre d'affaires de la même façon : metric view.\n- Une mesure comme un ratio ne se pré-agrège pas correctement à tous les niveaux : c'est l'intérêt de la metric view, qui recalcule selon les dimensions demandées.", "kw": ["star", "dimension", "fact", "materialized", "metric", "scd", "identity", "primary key"], "pre": ["dea-trans-6"]}]}],dea:[{"u": "plat", "t": "Plateforme Databricks", "w": 6, "lessons": [{"id": "dea-plat-1", "t": "Architecture", "md": "Source : [architecture Databricks](https://docs.databricks.com/aws/en/getting-started/overview).\n\n| Plan | Où | Ce qu'il contient |\n| --- | --- | --- |\n| **Control plane** | Compte cloud de Databricks | Application web, gestion des jobs et des clusters, code des notebooks (chiffré), métadonnées Unity Catalog |\n| **Compute plane classique** | Compte cloud du client | Machines des clusters classiques et des SQL warehouses classiques/pro |\n| **Compute plane serverless** | Compte cloud de Databricks, isolé par client | Calcul serverless : notebooks, jobs, pipelines, SQL warehouses serverless |\n| **Stockage** | Compte cloud du client | Les **données** : fichiers des tables, volumes |\n\nLes données restent dans le stockage du client, même quand le calcul est serverless.\n\nLe **lakehouse** réunit le lac de données (fichiers ouverts, peu coûteux, tous types de données) et l'entrepôt (transactions ACID, schéma, performances SQL, gouvernance). Une seule copie des données sert la BI, le data engineering et le ML, au lieu de systèmes cloisonnés. Les formats ouverts (Delta Lake, Parquet, Apache Spark) évitent la dépendance à un fournisseur.\n\n### Pièges d'examen\n\n- « Entièrement dans le control plane » : l'application web. Les données, elles, sont toujours dans le compte du client.\n- Le code d'un notebook planifié est stocké chiffré dans le control plane, et exécuté dans le compute plane.\n- Unifier des architectures cloisonnées : le data lakehouse. Bénéfice des technologies open source : éviter l'enfermement chez un fournisseur.", "kw": ["control plane", "compute plane", "lakehouse", "open source", "vendor", "silo", "web application", "cloud account"]}, {"id": "dea-plat-2", "t": "Delta Lake", "md": "Source : [Delta Lake](https://docs.databricks.com/aws/en/delta/).\n\nUne table Delta est un dossier de **fichiers Parquet** accompagné d'un **journal de transactions**, `_delta_log`, en fichiers JSON et checkpoints. Le journal enregistre chaque opération et apporte :\n\n- des **transactions ACID** : une écriture est entièrement visible ou pas du tout, même avec des lecteurs et écrivains simultanés\n- l'**application du schéma** : une écriture au mauvais schéma est refusée, sauf évolution demandée (`mergeSchema`)\n- l'**historique** et le **time travel**\n- une même table lisible en batch et en streaming\n\n### Historique et time travel\n\n```sql\nDESCRIBE HISTORY sales;                          -- version, date, utilisateur, opération\nSELECT * FROM sales VERSION AS OF 4;             -- ou sales@v4\nSELECT * FROM sales TIMESTAMP AS OF '2026-10-01';\nRESTORE TABLE sales TO VERSION AS OF 4;          -- revenir à une version\n```\n\n### Maintenance\n\n| Commande | Effet | À retenir |\n| --- | --- | --- |\n| `OPTIMIZE` | Compacte les petits fichiers en gros fichiers | Idempotent : relancé sans nouvelles données, il ne fait rien |\n| `VACUUM` | Supprime les fichiers qui ne sont plus référencés, au-delà de la rétention (7 jours par défaut) | Rend impossible le time travel vers les versions concernées |\n| `ANALYZE TABLE` | Calcule les statistiques pour l'optimiseur | Automatisé par la predictive optimization |\n\n### Pièges d'examen\n\n- Format de stockage des fichiers de données : Parquet. Le journal est en JSON.\n- Time travel impossible vers une ancienne version : un `VACUUM` a supprimé les fichiers.\n- Auditer qui a modifié une table : `DESCRIBE HISTORY`.\n- Supprimer des lignes d'une table Delta : `DELETE FROM t WHERE ...`. Pas besoin de réécrire la table.\n- Un CTAS depuis Parquet bénéficie d'un schéma bien défini, contrairement au CSV.", "kw": ["delta", "vacuum", "time travel", "version as of", "describe history", "optimize", "parquet", "acid", "delete from"]}, {"id": "dea-plat-3", "t": "Unity Catalog", "md": "Source : [Unity Catalog](https://docs.databricks.com/aws/en/data-governance/unity-catalog/).\n\nUnity Catalog est la couche de gouvernance unique des données et des actifs d'IA : droits d'accès, audit, lignage, découverte et partage.\n\n- **Un metastore par région cloud**, rattaché à un ou plusieurs workspaces de cette région. Un compte peut avoir plusieurs metastores, mais un workspace n'est rattaché qu'à un seul.\n- Les objets sont nommés sur **trois niveaux** : `catalog.schema.objet`. Un objet peut être une table, une vue, un volume, une fonction ou un modèle.\n- Les droits sont donnés par `GRANT` et hérités vers le bas. Voir le domaine Gouvernance.\n- Le **lignage** est capturé automatiquement jusqu'à la colonne. Le graphe s'affiche dans Catalog Explorer et montre les tables, notebooks, jobs et tableaux de bord en amont et en aval.\n- **Catalog Explorer**, ex-Data Explorer, montre le propriétaire, les droits, l'historique et le lignage de chaque objet.\n\nAvant Unity Catalog, chaque workspace avait son **Hive metastore** local, avec un schéma `default` stocké par défaut sous `dbfs:/user/hive/warehouse`. Les questions anciennes utilisent encore `DATABASE` à la place de `SCHEMA`, qui sont synonymes.\n\n### Partager et fédérer\n\n| Besoin | Outil |\n| --- | --- |\n| Partager des tables avec un autre workspace Databricks, même dans un autre cloud | **Delta Sharing** Databricks-to-Databricks : on demande l'*identifiant de partage* du metastore destinataire |\n| Partager avec un partenaire qui n'utilise pas Databricks | **Delta Sharing ouvert** : le destinataire reçoit un fichier d'identification et lit avec pandas, Spark, Power BI, etc. |\n| Interroger MySQL, Redshift ou BigQuery sans copier | **Lakehouse Federation** |\n\nDelta Sharing est en **lecture seule** pour le destinataire. Un partage entre clouds ou régions différents entraîne des frais de sortie (*egress*). Les répliquer dans la région du destinataire, ou les stocker dans Cloudflare R2, qui ne facture pas l'egress, réduit ces coûts.\n\n### Pièges d'examen\n\n- Voir quelles tables alimentent un tableau de bord : le lignage Unity Catalog.\n- Partenaire Databricks : identifiant de partage de son metastore. Partenaire hors Databricks : partage ouvert.\n- `DESCRIBE SCHEMA` (ou `DATABASE`) renvoie l'emplacement d'un schéma.", "kw": ["unity catalog", "metastore", "lineage", "delta sharing", "federation", "catalog explorer", "describe database", "hive"]}, {"id": "dea-plat-4", "t": "Choisir son calcul", "md": "Source : [types de calcul](https://docs.databricks.com/aws/en/compute/).\n\n| Calcul | Pour quoi | Coût et démarrage |\n| --- | --- | --- |\n| **All-purpose** (classique) | Développement interactif, notebooks partagés | Reste allumé tant qu'il n'est pas arrêté (auto-termination). Tarif DBU plus élevé |\n| **Jobs compute** (classique) | Un job en production. Créé au lancement, détruit à la fin | Tarif DBU plus bas. Plusieurs minutes de démarrage |\n| **Serverless** (notebooks, jobs, pipelines) | Charges courtes, irrégulières ou sans administration | Démarrage en secondes, mise à l'échelle automatique, facturé à l'usage. Python et SQL |\n| **SQL warehouse serverless** | BI, SQL ad hoc, forte concurrence | Démarrage rapide, Photon, arrêt automatique rapide |\n| **SQL warehouse pro / classique** | SQL quand le serverless n'est pas possible, par exemple pour atteindre un réseau privé du client | Démarrage plus lent. Le pro ajoute des fonctions avancées |\n\n### Les leviers\n\n- **Pools** : des machines gardées prêtes pour réduire le démarrage des clusters classiques. Utiles quand des jobs nocturnes perdent du temps au démarrage.\n- **Autoscaling** : ajoute ou retire des nœuds selon la charge, entre un minimum et un maximum.\n- **Instances spot** : moins chères mais récupérables par le fournisseur. Bien pour les workers d'un job tolérant, pas pour le driver.\n- **SQL warehouse** : *scaling range* (nombre de clusters) pour gérer plus de requêtes simultanées. *Taille* pour accélérer une requête lourde. *Auto stop* pour ne payer que pendant l'usage.\n- **Databricks Connect** : exécuter du code PySpark depuis son IDE local. Le code est envoyé au calcul distant, classique ou serverless, et seuls les résultats reviennent.\n\n### Pièges d'examen\n\n- Job de production planifié : jobs compute ou serverless jobs, jamais all-purpose.\n- Beaucoup d'utilisateurs simultanés sur un warehouse : augmenter le *maximum* du scaling range. Une seule requête lente : augmenter la taille.\n- Warehouse qui ne doit tourner que pendant le rafraîchissement d'un tableau de bord : auto stop. Démarrage trop lent : serverless.\n- Petits scripts Python fréquents qui doivent s'arrêter vite : serverless.\n- Atteindre une base dans le réseau privé de l'entreprise : warehouse pro, qui tourne dans le compte du client.\n- Un notebook Python peut exécuter une cellule SQL avec `%sql` en première ligne.", "kw": ["cluster", "serverless", "warehouse", "sql endpoint", "pool", "spot", "photon", "databricks connect", "autoscal", "%sql"]}]}, {"u": "ing", "t": "Ingestion et chargement", "w": 21, "lessons": [{"id": "dea-ing-1", "t": "Choisir sa méthode d'ingestion", "md": "La règle Databricks tient en une phrase : commencer par l'option la plus managée, et ne descendre vers une option plus personnalisable que si elle ne couvre pas la source ou le besoin ([vue d'ensemble de l'ingestion](https://docs.databricks.com/aws/en/ingestion/overview)).\n\n### Les trois rythmes d'ingestion\n\n| Rythme | Ce qui est lu à chaque exécution | Exécution | Exemple |\n| --- | --- | --- | --- |\n| Batch | Toute la source, rechargée | Ponctuelle ou planifiée | `CREATE TABLE AS SELECT` sur un dossier |\n| Batch incrémental | Seulement les données nouvelles depuis le dernier passage | Planifiée, mode *Triggered* | `COPY INTO`, Auto Loader avec `availableNow` |\n| Streaming | Les données au fil de l'eau | En continu, mode *Continuous* | Auto Loader ou Kafka en Structured Streaming |\n\nLe batch incrémental est le cas le plus fréquent à l'examen. Il garde la trace de ce qui a déjà été chargé, grâce aux métadonnées de la table pour COPY INTO ou au checkpoint pour Auto Loader. Relancer le job ne crée donc pas de doublons.\n\n### Les familles d'outils\n\n| Source | Outil recommandé | Plus personnalisable |\n| --- | --- | --- |\n| Bases de données (SQL Server, PostgreSQL, MySQL, Oracle…) | Connecteur managé Lakeflow Connect, avec CDC | Requête JDBC dans un notebook |\n| Applications SaaS (Salesforce, Workday, ServiceNow…) | Connecteur managé Lakeflow Connect | Appels d'API REST dans un notebook |\n| Fichiers sur stockage cloud | Auto Loader, en SQL avec `CREATE STREAMING TABLE` | Auto Loader en Structured Streaming, ou COPY INTO |\n| Bus de messages (Kafka, Kinesis, Pub/Sub, Pulsar) | Lakeflow Spark Declarative Pipelines | Structured Streaming |\n| Fichiers sur un poste local | Import par l'interface *Add data* | SDK Python au-delà de 5 Go |\n| Données à ne pas copier | Lakehouse Federation (requête sur place) | Delta Sharing |\n\nEn SQL, Databricks présente `CREATE STREAMING TABLE` comme l'alternative recommandée à `COPY INTO` pour l'ingestion incrémentale depuis le stockage cloud ([connecteurs standard](https://docs.databricks.com/en/ingestion/index.html)).\n\n### Importer un fichier local\n\nL'interface *Add data* ([documentation](https://docs.databricks.com/en/ingestion/file-upload/upload-data.html)) dépose le fichier dans un volume, puis crée une **table managée Unity Catalog** :\n\n- l'écran d'aperçu permet de renommer les colonnes, changer leur type ou en exclure\n- il faut un SQL warehouse démarré et le privilège `CREATE TABLE` sur le schéma cible\n- l'import par l'interface est limité à 5 Go par fichier\n- plusieurs fichiers pour une même table doivent avoir la même structure\n\n### Pièges d'examen\n\n- Un petit CSV fourni par un métier se charge par l'interface d'import, pas par un pipeline.\n- « Ne pas dupliquer la donnée » ou « données toujours à jour sans copie » : la réponse est Lakehouse Federation, pas une ingestion.\n- « Le moins de maintenance possible », « CDC intégré », « évolution de schéma automatique » pour une base ou un SaaS : c'est un connecteur managé Lakeflow Connect.\n- Batch planifié = mode *Triggered*. Streaming en continu = mode *Continuous*.", "kw": ["batch", "upload", "ingest", "federation"]}, {"id": "dea-ing-2", "t": "COPY INTO", "md": "`COPY INTO` charge en SQL les fichiers d'un dossier cloud ou d'un volume dans une table Delta existante, et ne recharge jamais un fichier déjà chargé ([référence SQL](https://docs.databricks.com/aws/sql/language-manual/delta-copy-into)). On peut donc le planifier et le relancer sans risque de doublon.\n\n### Syntaxe\n\n```sql\nCOPY INTO main.sales.orders\nFROM '/Volumes/main/sales/raw/orders/'\nFILEFORMAT = CSV                          -- CSV, JSON, AVRO, ORC, PARQUET, TEXT, BINARYFILE\nPATTERN = '2026-*.csv'                    -- ou FILES = ('a.csv', 'b.csv'), jamais les deux\nFORMAT_OPTIONS ('header' = 'true', 'inferSchema' = 'true')   -- options du lecteur Spark\nCOPY_OPTIONS ('mergeSchema' = 'true');    -- options propres à COPY INTO\n```\n\n| Clause | Rôle |\n| --- | --- |\n| `FILEFORMAT` | Format des fichiers source, obligatoire |\n| `FILES` | Liste explicite, 1 000 fichiers au maximum |\n| `PATTERN` | Filtre glob sur les noms de fichiers |\n| `FORMAT_OPTIONS` | Options de lecture : en-tête, séparateur, `multiLine` pour le JSON… |\n| `COPY_OPTIONS` | Deux options : `mergeSchema` et `force` |\n| `VALIDATE` | Contrôle les données sans les écrire (parsing, schéma, contraintes) |\n\n### Idempotence et option `force`\n\nCOPY INTO mémorise les fichiers déjà chargés. Un fichier déjà chargé est ignoré, **même s'il a été modifié depuis**. Avec `'force' = 'true'`, l'idempotence est désactivée et tous les fichiers sont rechargés, ce qui crée des doublons.\n\n### Table sans schéma et évolution\n\nLa table cible doit exister. Depuis le Runtime 11.3 LTS, elle peut être créée vide, sans colonnes, et COPY INTO en déduit le schéma ([guide COPY INTO](https://docs.databricks.com/aws/en/ingestion/copy-into/)) :\n\n```sql\nCREATE TABLE IF NOT EXISTS main.travel.bookings;   -- aucune colonne déclarée\n\nCOPY INTO main.travel.bookings\nFROM '/Volumes/main/travel/raw/bookings'\nFILEFORMAT = JSON\nFORMAT_OPTIONS ('mergeSchema' = 'true', 'multiLine' = 'true')\nCOPY_OPTIONS ('mergeSchema' = 'true');\n```\n\nTant que COPY INTO n'a rien chargé, cette table n'accepte ni `INSERT INTO` ni `MERGE INTO`. Ensuite, `'mergeSchema' = 'true'` ajoute automatiquement les nouvelles colonnes qui apparaissent dans les fichiers.\n\n### Quand ne pas l'utiliser\n\nPour un dossier contenant un très grand nombre de fichiers, Databricks recommande Auto Loader. Pour les utilisateurs SQL, la documentation recommande les *streaming tables*, plus robustes à grande échelle. Mieux vaut aussi éviter de lancer plusieurs COPY INTO en parallèle : une seule commande sur plusieurs fichiers est plus performante.\n\n### Pièges d'examen\n\n- « Le COPY INTO s'est exécuté mais la table n'a pas changé » : le fichier avait déjà été chargé.\n- « Un fichier corrigé est redéposé sous le même nom » : COPY INTO l'ignore. Il faut le déposer sous un nouveau nom, ou utiliser `force`, au prix de doublons.\n- `FILES` et `PATTERN` ne se combinent pas.\n- `mergeSchema` se place dans `COPY_OPTIONS` pour faire évoluer la table. `header`, `inferSchema` ou `multiLine` vont dans `FORMAT_OPTIONS`.\n- COPY INTO écrit dans une table Delta. Le format Parquet est accepté en entrée.", "kw": ["copy into"]}, {"id": "dea-ing-3", "t": "Auto Loader", "md": "Auto Loader est la source Structured Streaming `cloudFiles` : il détecte les nouveaux fichiers d'un dossier cloud, ne traite chacun qu'une fois grâce à son checkpoint, et sait inférer puis faire évoluer le schéma.\n\n### Le code type\n\n```python\n(spark.readStream\n    .format(\"cloudFiles\")                                     # c'est ce format qui active Auto Loader\n    .option(\"cloudFiles.format\", \"json\")                      # format des fichiers source\n    .option(\"cloudFiles.schemaLocation\", \"/Volumes/main/raw/_chk/orders\")  # active l'inférence de schéma\n    .option(\"cloudFiles.inferColumnTypes\", \"true\")            # sinon JSON et CSV sont lus en STRING\n    .load(\"/Volumes/main/raw/landing/orders/\")\n  .writeStream\n    .option(\"checkpointLocation\", \"/Volumes/main/raw/_chk/orders\")  # mémorise les fichiers traités\n    .trigger(availableNow=True)                               # traite l'existant puis s'arrête\n    .toTable(\"main.bronze.orders\"))\n```\n\nAvec `trigger(availableNow=True)`, Auto Loader fonctionne en **batch incrémental** : chaque exécution planifiée traite tous les nouveaux fichiers, en plusieurs micro-batchs si besoin, puis s'arrête. Sans trigger, le flux tourne en continu. En SQL, la même logique s'écrit avec `CREATE STREAMING TABLE … AS SELECT * FROM STREAM read_files(…)`.\n\n\nLe checkpoint mémorise les fichiers déjà ingérés. Un redémarrage reprend là où le flux s'était arrêté, sans doublon.\n\n### Inférence du schéma\n\nSource : [schéma dans Auto Loader](https://docs.databricks.com/gcp/en/ingestion/cloud-object-storage/auto-loader/schema).\n\n- L'inférence s'active avec `cloudFiles.schemaLocation`. L'historique du schéma est stocké dans un dossier `_schemas`.\n- Le premier échantillon porte sur 50 Go ou 1 000 fichiers, le premier seuil atteint.\n- JSON, CSV et XML sont inférés en **STRING** par défaut, champs imbriqués compris. Il faut `cloudFiles.inferColumnTypes = true` pour obtenir de vrais types. Parquet et Avro gardent les types inscrits dans les fichiers.\n- `cloudFiles.schemaHints` force le type de certaines colonnes, par exemple `'order_date DATE, amount DECIMAL(10,2)'`.\n\n### Évolution du schéma\n\nQuand une nouvelle colonne apparaît, le comportement dépend de `cloudFiles.schemaEvolutionMode` :\n\n| Mode | Nouvelle colonne | Le flux s'arrête ? |\n| --- | --- | --- |\n| `addNewColumns` (défaut sans schéma fourni) | Ajoutée en fin de schéma | Oui, une fois. Il reprend au redémarrage |\n| `rescue` | Rangée dans `_rescued_data`, schéma inchangé | Non |\n| `failOnNewColumns` | Rien n'est ajouté | Oui, jusqu'à correction manuelle du schéma |\n| `none` (défaut avec schéma fourni) | Ignorée | Non |\n\nAvec `addNewColumns`, l'arrêt sur `UnknownFieldException` est voulu. Databricks recommande d'exécuter le flux dans un job Lakeflow avec des reprises automatiques, pour qu'il redémarre avec le nouveau schéma.\n\n### La colonne `_rescued_data`\n\nAuto Loader l'ajoute automatiquement quand il infère le schéma. Elle contient, au format JSON, tout ce qui n'a pas pu être lu : colonnes absentes du schéma, valeurs du mauvais type, différences de casse, avec le chemin du fichier source. Aucune donnée n'est perdue en silence. Avec un schéma fourni, on l'active par l'option `rescuedDataColumn`.\n\n### Détection des nouveaux fichiers\n\nSource : [modes de détection](https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/file-detection-modes).\n\n| Mode | Fonctionnement | À retenir |\n| --- | --- | --- |\n| Directory listing (défaut) | Liste le dossier à chaque passage | Aucun droit supplémentaire, mais moins performant sur de gros volumes |\n| File notification classique | File d'attente et notifications créées dans le compte cloud | Droits supplémentaires, pas de support des volumes Unity Catalog |\n| File notification avec *file events* (recommandé) | S'appuie sur les file events de l'*external location* Unity Catalog | Plus performant, aucun droit en plus, Runtime 14.3 LTS minimum |\n\nOn peut changer de mode entre deux redémarrages sans perdre la garantie *exactly-once*. Aucun mode ne garantit l'ordre de traitement des fichiers.\n\n### Pièges d'examen\n\n- Toutes les colonnes sont en STRING après une ingestion JSON ou CSV : `inferColumnTypes` n'était pas activé. La raison n'est pas « Auto Loader ne sait lire que du texte ».\n- « L'ingestion doit échouer tant que le changement de schéma n'est pas validé » : `failOnNewColumns`.\n- « Ne pas perdre les champs inattendus sans arrêter le flux » : `rescue`, ou la colonne `_rescued_data`.\n- « Exécution planifiée qui traite tout le nouveau et s'arrête » : `trigger(availableNow=True)`. `trigger(once=True)` est l'ancienne écriture.\n- Le format à écrire est `cloudFiles`. `cloudFiles.format` désigne le format des fichiers lus.\n- Ne filtrer que certaines extensions : option `pathGlobFilter`, par exemple `'*.png'`.", "kw": ["auto loader", "autoloader", "cloudfiles", "schemalocation", "rescued", "schema evolution", "file notification"]}, {"id": "dea-ing-4", "t": "Lakeflow Connect, partenaires et Lakehouse Federation", "md": "Trois façons d'atteindre une base ou une application métier sans écrire de code d'extraction. Les deux premières **copient** les données dans le lakehouse. Lakehouse Federation, elle, les **interroge sur place**.\n\n### Lakeflow Connect : les connecteurs managés\n\nSource : [Lakeflow Connect](https://docs.databricks.com/en/ingestion/lakeflow-connect.html).\n\nUn connecteur managé crée un pipeline d'ingestion gouverné par Unity Catalog, exécuté en serverless, qui écrit dans des **streaming tables**. La première exécution charge tout, les suivantes ne chargent que les changements quand la source le permet.\n\n| Famille | Exemples | Mode incrémental |\n| --- | --- | --- |\n| Bases de données | SQL Server, MySQL, PostgreSQL | CDC ou change tracking |\n| Applications SaaS | Salesforce, Workday, HubSpot, Jira, ServiceNow | Colonne curseur fournie par l'API |\n| Fichiers | SharePoint, Google Drive | Nouveaux fichiers |\n\nLes briques à connaître :\n\n- **Connection** : objet Unity Catalog qui stocke l'authentification vers la source.\n- **Ingestion gateway** (bases de données seulement) : tâche continue qui lit les changements et les dépose dans un stockage intermédiaire.\n- **Ingestion pipeline** : pipeline serverless qui applique ces changements aux tables de destination.\n- Chaque planification ajoutée crée un job Lakeflow dont le pipeline est une tâche.\n\n### Partner Connect\n\nPour une source que Lakeflow Connect ne couvre pas, Partner Connect branche en quelques clics un outil d'intégration tiers, comme Fivetran ou Qlik. Databricks crée pour l'outil les ressources nécessaires, comme le SQL warehouse et le jeton. L'outil reste facturé et opéré par le partenaire.\n\n### Lakehouse Federation\n\nLakehouse Federation interroge une base externe sans la copier. On crée une **connection**, puis un **foreign catalog** qui apparaît dans Unity Catalog à côté des autres catalogues. Les requêtes sont poussées vers la source quand c'est possible, et les droits se gèrent avec les GRANT habituels.\n\n```sql\nCREATE CONNECTION pg_crm TYPE postgresql\n  OPTIONS (host 'crm.db.local', port '5432',\n           user secret('crm', 'user'), password secret('crm', 'pwd'));\n\nCREATE FOREIGN CATALOG crm USING CONNECTION pg_crm\n  OPTIONS (database 'crm');\n\nSELECT * FROM crm.public.customers WHERE country = 'FR';\n```\n\n### Choisir\n\n| Besoin | Réponse |\n| --- | --- |\n| Copier une base ou un SaaS régulièrement, en incrémental, sans code | Lakeflow Connect |\n| Source non couverte, équipe déjà équipée d'un ETL du marché | Partner Connect |\n| Exploration ponctuelle, preuve de concept, jointure avec une base opérationnelle sans dupliquer | Lakehouse Federation |\n| Requêtes lourdes et répétées sur ces données | Copier (Lakeflow Connect), la fédération chargerait la base source |\n\n### Pièges d'examen\n\n- « Interroger sans déplacer ni dupliquer les données » : Lakehouse Federation, pas Lakeflow Connect.\n- « Ingestion incrémentale managée depuis Salesforce ou SQL Server » : Lakeflow Connect.\n- La gateway n'existe que pour les connecteurs de bases de données, pas pour les SaaS.\n- Les tables créées par un connecteur managé sont des streaming tables.", "kw": ["lakeflow connect", "salesforce", "saas", "partner connect", "federation", "connector"]}, {"id": "dea-ing-5", "t": "JDBC, ODBC et API REST depuis un notebook", "md": "Quand aucun connecteur ne convient, on écrit l'extraction dans un notebook, puis on la planifie avec un job Lakeflow.\n\n### Lire une base en JDBC\n\n```python\npwd = dbutils.secrets.get(scope=\"crm\", key=\"pwd\")   # jamais de mot de passe en clair\n\ndf = (spark.read\n  .format(\"jdbc\")\n  .option(\"url\", \"jdbc:postgresql://crm.db.local:5432/crm\")\n  .option(\"dbtable\", \"public.orders\")\n  .option(\"user\", \"etl\")\n  .option(\"password\", pwd)\n  .option(\"partitionColumn\", \"order_id\")   # lecture parallèle\n  .option(\"lowerBound\", 1).option(\"upperBound\", 10000000)\n  .option(\"numPartitions\", 8)\n  .load())\n\ndf.write.mode(\"append\").saveAsTable(\"main.bronze.orders\")\n```\n\n- Les secrets sont stockés dans un *secret scope* et lus par `dbutils.secrets.get`. Leur valeur est masquée (`[REDACTED]`) si on l'affiche dans un notebook.\n- Sans `partitionColumn`, `lowerBound`, `upperBound` et `numPartitions`, la lecture passe par une seule connexion.\n- Pour l'incrémental, on filtre soi-même sur une colonne de date ou d'identifiant, avec `query` ou un `WHERE` dans `dbtable`.\n\n### Appeler une API REST\n\n```python\nimport requests\nrows = requests.get(\"https://api.exemple.com/v1/tickets\",\n                    headers={\"Authorization\": f\"Bearer {dbutils.secrets.get('api','token')}\"}).json()\nspark.createDataFrame(rows).write.mode(\"append\").saveAsTable(\"main.bronze.tickets\")\n```\n\nL'appel s'exécute sur le driver. On l'utilise pour de petits volumes. Pour un gros historique, on dépose les réponses en fichiers JSON dans un volume et on les ingère avec Auto Loader.\n\n### ODBC et JDBC dans l'autre sens\n\nLes pilotes ODBC et JDBC Databricks servent surtout aux outils externes, BI ou ETL, qui se connectent à un SQL warehouse pour lire ou écrire dans le lakehouse. Ils ne servent pas à ingérer depuis un notebook.\n\n### Orchestrer\n\nLe notebook devient une tâche d'un job Lakeflow : planification cron ou déclenchement à l'arrivée de fichiers, reprises automatiques, paramètres passés par les *widgets* ou `dbutils.widgets.get`, alertes en cas d'échec.\n\n### Pièges d'examen\n\n- Mot de passe dans le code : réponse attendue `dbutils.secrets.get`. Le `print` d'un secret affiche `[REDACTED]`.\n- Lecture JDBC lente sur une grosse table : il manque les options de partitionnement.\n- `spark.read.format(\"jdbc\")` lit en batch. Il n'existe pas de source streaming JDBC native, l'incrémental se gère à la main ou avec Lakeflow Connect.", "kw": ["jdbc", "odbc", "rest api", "secret", "sqlite"]}, {"id": "dea-ing-6", "t": "Données semi-structurées et non structurées", "md": "En bronze, le JSON arrive souvent tel quel dans une colonne STRING. Le passage en silver consiste à en extraire des colonnes typées.\n\n### Extraire d'une colonne JSON en STRING\n\n| Outil | Exemple | À retenir |\n| --- | --- | --- |\n| Opérateur `:` (SQL Databricks) | `raw:customer.id::INT` | Le plus court. Chemin à points, `::` pour typer, `raw:items[0]` pour un tableau |\n| `get_json_object` | `get_json_object(raw, '$.customer.id')` | Syntaxe JSONPath, renvoie toujours une STRING, à caster |\n| `from_json` + schéma | `from_json(raw, 'id INT, tags ARRAY<STRING>')` | Produit un STRUCT, accessible ensuite par `col.id`. Le schéma peut venir de `schema_of_json` |\n| `explode` | `explode(from_json(...).tags)` | Une ligne par élément de tableau |\n\n```sql\nCREATE OR REPLACE TABLE silver.users AS\nSELECT\n  user_profile:user_id::BIGINT        AS user_id,\n  user_profile:name::STRING           AS name,\n  user_profile:address.city::STRING   AS city,\n  explode(from_json(user_profile:tags, 'ARRAY<STRING>')) AS tag\nFROM bronze.api_responses;\n```\n\n### Le type VARIANT\n\nVARIANT stocke le JSON dans un format binaire optimisé au lieu d'une chaîne. On le crée avec `parse_json(raw)` et on l'interroge avec la même syntaxe `:` et `::`. Il évite de figer un schéma à l'ingestion tout en restant plus rapide à interroger qu'une STRING. Databricks le recommande pour le JSON dont la structure change souvent.\n\n### Fichiers non structurés : `binaryFile`\n\nImages, PDF ou audio se lisent avec le format `binaryFile`, en batch ou via Auto Loader avec `cloudFiles.format = binaryFile`. Chaque fichier devient une ligne avec les colonnes `path`, `modificationTime`, `length` et `content`, ce dernier contenant les octets bruts.\n\n```python\n(spark.readStream.format(\"cloudFiles\")\n   .option(\"cloudFiles.format\", \"binaryFile\")\n   .option(\"pathGlobFilter\", \"*.png\")\n   .load(\"/Volumes/main/raw/images/\"))\n```\n\n### Pièges d'examen\n\n- Les champs extraits par `get_json_object` sont des STRING. Un calcul numérique demande un `CAST`.\n- L'accès par point (`col.field`) marche sur un STRUCT, pas sur une STRING JSON. Sur une STRING, on utilise `:`.\n- Un tableau JSON qui doit donner une ligne par élément appelle `explode`.\n- `pathGlobFilter` sélectionne les fichiers par extension. Le format `binaryFile` ne décode pas le contenu.", "kw": ["json", "variant", "binaryfile", "from_json", "get_json_object", "png"]}]}, {"u": "trans", "t": "Transformation et modélisation", "w": 22, "lessons": [{"id": "dea-trans-1", "t": "Du bronze au silver", "md": "### L'architecture médaillon\n\nSource : [architecture médaillon](https://docs.databricks.com/aws/en/lakehouse/medallion).\n\n| Couche | Contenu | Qui l'utilise |\n| --- | --- | --- |\n| **Bronze** | Données brutes telles qu'ingérées, en ajout seul, avec des métadonnées (fichier source, date de chargement) | Data engineers, pour rejouer l'historique |\n| **Silver** | Données nettoyées, typées, dédoublonnées, éventuellement enrichies par jointure | Data engineers, data scientists, analystes |\n| **Gold** | Agrégats et tables métier prêtes pour la BI ou le ML | Analystes, tableaux de bord |\n\nLa qualité et la structure augmentent à chaque couche. Le volume, lui, ne diminue pas toujours : une table silver enrichie peut avoir plus de colonnes que sa source.\n\n### Nettoyer en PySpark\n\n```python\nfrom pyspark.sql import functions as F\n\nsilver = (spark.read.table(\"main.bronze.orders\")\n  .withColumn(\"order_date\", F.to_date(\"order_date\", \"yyyy-MM-dd\"))  # STRING -> DATE\n  .withColumn(\"amount\", F.col(\"amount\").cast(\"decimal(10,2)\"))      # STRING -> DECIMAL\n  .withColumn(\"country\", F.upper(F.trim(\"country\")))                 # normaliser le texte\n  .fillna({\"channel\": \"unknown\"})                                       # remplacer les NULL\n  .dropna(subset=[\"order_id\"])                                          # exclure les lignes sans clé\n)\nsilver.write.mode(\"overwrite\").saveAsTable(\"main.silver.orders\")\n```\n\n### Le même nettoyage en SQL\n\n```sql\nCREATE OR REPLACE TABLE main.silver.orders AS\nSELECT\n  order_id,\n  to_date(order_date, 'yyyy-MM-dd')      AS order_date,\n  CAST(amount AS DECIMAL(10,2))         AS amount,\n  upper(trim(country))                  AS country,\n  coalesce(channel, 'unknown')          AS channel\nFROM main.bronze.orders\nWHERE order_id IS NOT NULL;\n```\n\n### À retenir sur les NULL\n\n- `col = NULL` ou `col != NULL` renvoie toujours NULL, donc aucune ligne. On écrit `IS NULL` ou `IS NOT NULL`.\n- `count(*)` compte toutes les lignes. `count(col)` ignore les NULL de cette colonne. `count_if(col IS NULL)` compte les NULL.\n- `coalesce(a, b, 'x')` renvoie la première valeur non nulle.\n- `CAST` renvoie une erreur si la valeur ne se convertit pas (mode ANSI, actif par défaut sur les runtimes récents). `try_cast` renvoie NULL à la place.\n\n### Pièges d'examen\n\n- « Silver contient moins de données que bronze » n'est pas toujours vrai. La bonne formulation est « plus propre et plus raffinée ».\n- Le bronze garde les données brutes pour pouvoir retraiter. On ne nettoie pas en écrasant le bronze.\n- Pour compter les valeurs manquantes : `count_if(col IS NULL)` ou `count(*) - count(col)`.", "kw": ["bronze", "silver", "medallion", "null", "cast", "dropna", "fillna", "coalesce"]}, {"id": "dea-trans-2", "t": "Combiner des DataFrames", "md": "### Les jointures\n\n| Type | Lignes gardées | Usage typique |\n| --- | --- | --- |\n| `inner` (défaut) | Seulement celles qui ont une correspondance des deux côtés | Commandes avec un client connu |\n| `left` | Toutes celles de gauche, NULL à droite sans correspondance | Garder toutes les commandes, même sans client |\n| `right` / `full` | Toutes à droite / des deux côtés | Rapprochements, contrôles d'écarts |\n| `left_semi` | Celles de gauche qui ont une correspondance, sans les colonnes de droite | Équivalent d'un `WHERE EXISTS` |\n| `left_anti` | Celles de gauche **sans** correspondance | Trouver les orphelins, équivalent d'un `NOT EXISTS` |\n| `cross` | Toutes les combinaisons (n × m lignes) | Calendrier × produits. À éviter sur de gros volumes |\n\n```python\nfrom pyspark.sql import functions as F\n\n# jointure sur plusieurs clés : une liste de noms évite les colonnes dupliquées\norders.join(customers, on=[\"customer_id\", \"country\"], how=\"left\")\n\n# condition explicite quand les noms diffèrent\norders.join(customers, orders.cust == customers.id, \"inner\")\n\n# broadcast : copie la petite table sur chaque exécuteur, pas de shuffle de la grosse\norders.join(F.broadca
